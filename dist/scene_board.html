e hunted is the hunter; patience as action; accepted shame to save others.","turn":"The hills close in.","story":"Kālayavana runs and does not catch him. The man ahead is always one step out of reach. They cross a field, a river and a ridge. Kālayavana shouts at him: coward, runaway, one who will not fight. The man does not turn. Behind them the army falls away and the country gets wilder. The hills close in. Ahead, there is a dark opening in the rock.","gen":["Adventure","Thriller","Mythological epic"]},{"c":"S-668","src":"E05-04","t":"The cave and the sleeper","carrier":false,"ev":5,"evn":"Mucukunda","cat":"D","tier":3,"mins":"1","mid":1,"rasa":"Bhayānaka","pov":"Kālayavana","pl":"A mountain cave","k":"Shadow or sound","sum":"Krishna enters a cave. Kālayavana follows into the dark and finds a man asleep. Taking him for Krishna pretending to sleep, he approaches.","why":"The trap: a room with a sleeper and an arrogant intruder.","turn":"He raises his foot.","story":"The cave is dark and goes back a long way. A slender figure slips in ahead of Kālayavana and is gone behind a rock. Kālayavana follows, breathing hard. At the far end, in a patch of dimness, a man lies asleep. His chest barely moves. Kālayavana, who has been chasing a trick, sees what he takes for another. He walks up to the sleeper and lifts his foot.","gen":["Horror","Thriller","Mythological epic"]},{"c":"S-973","src":"E05-05","t":"The kick and the ash","carrier":false,"ev":5,"evn":"Mucukunda","cat":"A","tier":3,"mins":"1","mid":1,"rasa":"Raudra","pov":"Mucukunda","pl":"The cave","k":"Not present","sum":"Kālayavana kicks the sleeper. Mucukunda wakes, angry, and looks at him. Kālayavana burns to ash.","why":"A short, silent, frightening fight with no weapon; an act of arrogance wakes something that burns.","turn":"The sleeper’s eyes open.","story":"The foot lands. Mucukunda’s eyes open. He is angry and he looks at what has woken him. For half a second there is nothing. Then the light from his eyes fills the cave. When it clears there is only a shape of ash on the floor. Mucukunda sits up slowly. Behind a rock, someone waits.","gen":["Horror","Mythological epic","Thriller"]},{"c":"S-515","src":"E05-06","t":"The king who slept (Mucukunda’s past)","carrier":false,"ev":5,"evn":"Mucukunda","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Śānta","pov":"Mucukunda","pl":"Heaven’s war; the cave","k":"Not present","sum":"Mucukunda, a king of the Ikṣvāku line, fought for the Devas against the Asuras. Offered a boon, he asked for undisturbed sleep, with the power to burn whoever woke him. When Kārttikeya became general, he was released from service and chose sleep over liberation.","why":"Links Event 05 to the Manthana; the cave as a place where ages sleep.","turn":"He closes his eyes.","story":"Long ago, Mucukunda fought for the gods against the demons, and fought well. The war went on for ages. At the end he was offered a gift, and he asked for sleep. Let no one wake me, he said, and let whoever does be burnt. He found a cave and lay down. When the gods gave him leave to be free he chose to sleep on. The scene is told in three images: a battle, a bargain and a closing of eyes.","gen":["Mythological epic","Drama","Fantasy"]},{"c":"S-345","src":"E05-07","t":"Mucukunda sees him","carrier":false,"ev":5,"evn":"Mucukunda","cat":"D","tier":5,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"Mucukunda","pl":"The cave","k":"Reflection (the witness’s face)","sum":"A figure steps into the light. Mucukunda, a king who has slept through ages, sees a man of unearthly radiance and wonders if this is the Supreme Lord. His face is the whole scene.","why":"The film’s purest portrait of Krishna by an awed face; the illumination method at its smallest scale.","turn":"He bows.","story":"A figure steps into the light. Mucukunda sits on the cave floor and looks up. He does not know him, and he does. A light falls on his face from somewhere to the left, and the camera stays on him as his expression changes: surprise, doubt, recognition, and something like grief. His lips move. He bows his head. A tear runs down the old face. The film has promised the audience a portrait of Krishna, and this is it.","gen":["Spiritual drama","Mythological epic","Art-house"]},{"c":"S-871","src":"E05-08","t":"“My births are countless”","carrier":false,"ev":5,"evn":"Mucukunda","cat":"D","tier":2,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"Mucukunda","pl":"The cave","k":"Spoken of, direct (voice only)","sum":"Mucukunda asks who he is. A voice says: my births are countless; in this age I came as Vasudeva’s son to protect dharma; I killed Kaṁsa; your glance burned Kālayavana; I came because you once prayed for me.","why":"His account of himself, heard by someone who believes it; the closest to a statement of identity the film allows.","turn":"He recalls Garga’s prediction.","story":"Mucukunda asks who he is. A voice answers from the light. My births are countless, it says. In this age I came as Vasudeva’s son to protect dharma. I killed Kaṁsa. Your glance burned the Yavana, and I came because you once prayed for me. Mucukunda’s face changes as each line lands. He remembers an old sage, Garga, and what he said about this day.","gen":["Spiritual drama","Mythological epic","Drama"]},{"c":"S-640","src":"E05-09","t":"Mucukunda’s prayers","carrier":false,"ev":5,"evn":"Mucukunda","cat":"D","tier":3,"mins":"3","mid":3,"rasa":"Śānta","pov":"Mucukunda","pl":"The cave","k":"Spoken of, direct","sum":"Mucukunda prays: the delusion of worldly happiness, the rarity of human birth, the waste of kingship, death like a snake, the futility of power, freedom through good company. He asks only to serve.","why":"The most intimate portrait of the Lord in the whole gathering; the awed witness speaks.","turn":"He asks for nothing.","story":"Mucukunda’s prayer is long, and the film lets it be. He says that worldly happiness is a dream, that a human birth is rare, that he spent his on a kingdom and did not know it. He says power is a thing that ends, and death comes like a snake. He asks for only one thing: to be close to those who know the Lord. The camera stays on his face and the light on it does not move.","gen":["Spiritual drama","Art-house","Mythological epic"]},{"c":"S-589","src":"E05-10","t":"The test and the renunciation","carrier":false,"ev":5,"evn":"Mucukunda","cat":"D","tier":2,"mins":"1–2","mid":1.5,"rasa":"Śānta","pov":"Mucukunda","pl":"The cave","k":"Spoken of, direct","sum":"Krishna offers boons. Mucukunda declines every one. Krishna praises his steadiness and says the offer was a test.","why":"A man who gives up wealth for the sake of the truth he saw; a light for Rukmini’s plea.","turn":"He says “nothing”.","story":"The Lord offers him anything. Mucukunda thinks, and says nothing. He is offered it again. He shakes his head. He asks for nothing at all. The voice says something that sounds like laughter. It was a test, it says, and he has passed it. Mucukunda does not seem to care. He bows.","gen":["Spiritual drama","Mythological epic","Drama"]},{"c":"S-557","src":"E05-11","t":"The sage walks north","carrier":false,"ev":5,"evn":"Mucukunda","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Śānta","pov":"Mucukunda","pl":"The mountain road","k":"Not present","sum":"Mucukunda leaves the cave, judges that the age has changed, and walks north to Badarikāśrama to worship Hari.","why":"A man leaves the world he woke into; the witness departs.","turn":"He looks back once.","story":"Mucukunda comes out of the cave into daylight. He has not seen it for a very long time. He looks at the plants, the sky, the people. He sees that the world has changed and that the age has too. He turns north, and walks. At the top of a rise, he looks back once, then goes on.","gen":["Spiritual drama","Road movie","Mythological epic"]},{"c":"S-881","src":"E05-12","t":"The Yavana army destroyed","carrier":false,"ev":5,"evn":"Mucukunda","cat":"A","tier":3,"mins":"1","mid":1,"rasa":"Vīra","pov":"The water-carrier","pl":"Mathurā","k":"Effect","sum":"Krishna returns to Mathurā, destroys the barbarian army and sends its wealth toward Dvārakā.","why":"A summary beat: the second siege ends.","turn":"The gate opens.","story":"The gate of Mathurā opens. Outside, the plain is full of the Yavana army and, in the next shot, nearly empty. There is wreckage and silence. Carts are loaded with the dead army’s wealth and set on the road toward the sea. The water-carrier on the wall looks at his chalk marks and chalks a line under the last of them.","gen":["War","Mythological epic","Drama"]},{"c":"S-659","src":"E05-13","t":"The goatherd and the smoke","carrier":false,"ev":5,"evn":"Mucukunda","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Śānta","pov":"The goatherd","pl":"The mountain road","k":"Not present","sum":"A goatherd whose flock grazes near the mountain sees smoke from the cave and, later, a sage passing. When the siege is lifted, the goats walk back onto the road.","why":"World-welfare proof for Event 05.","turn":"The goats walk onto the road.","story":"A goatherd and his flock graze on a mountain slope. He sees smoke from the cave and moves the goats away. Later he sees an old man pass, walking north. When the news comes that the siege is lifted, he leads the goats down to the road, and they walk onto it as if nothing had been wrong.","gen":["Folk tale","Drama","Spiritual drama"]},{"c":"S-906","src":"E05-14","t":"The herdsman’s tale","carrier":true,"ev":5,"evn":"Mucukunda","cat":"D","tier":2,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"Rukmini","pl":"A roadside well near Kuṇḍina","k":"Spoken of, indirect","sum":"A herdsman tells a friend: a Yavana ran in after a man, and only smoke came out. Rukmini, filling a jar, hears. She asks which man. He does not know. She remembers the garland and the lone walk (E04-07).","why":"Delivers Event 05 as a rumour; gives Rukmini her private picture of him: the man who walks out alone.","turn":"She asks if he had a garland.","story":"At a well near Kuṇḍina, a herdsman says to a friend: a Yavana ran into a cave after a man, and only smoke came out. Rukmini, filling her jar, stops. “What man?” He does not know. “Did he wear a garland?” He says it is possible. Rukmini turns to go, and the jar is lighter than it should be.","gen":["Folk tale","Romance","Mythological epic"]},{"c":"S-237","src":"E05-15","t":"The prayer recited at Ambikā","carrier":true,"ev":5,"evn":"Mucukunda","cat":"D","tier":2,"mins":"2","mid":2,"rasa":"Śānta","pov":"Rukmini","pl":"The temple of Ambikā","k":"Spoken of, direct","sum":"A priest recites Mucukunda’s prayer to Rukmini’s mother and Rukmini: the king who gave up kingship after seeing him. Rukmini, hearing, is silent for a long moment.","why":"Delivers Event 05’s most intimate account of Krishna by someone who truly saw him.","turn":"She asks the priest to say it again.","story":"In the temple of Ambikā, a priest recites to Rukmini’s mother and to Rukmini. He tells of a king who slept for ages, who woke, and who asked for nothing. The prayer is in his voice, slow and precise. Rukmini says nothing for a long moment. Then she asks the priest to say it again.","gen":["Spiritual drama","Romance","Drama"]},{"c":"S-702","src":"E05-16","t":"Nārada’s marks reach Rukmini","carrier":true,"ev":5,"evn":"Mucukunda","cat":"D","tier":2,"mins":"2","mid":2,"rasa":"Hāsya","pov":"Rukmini","pl":"Bhīṣmaka’s palace","k":"Spoken of, direct","sum":"A visitor, trading gossip, lists the marks by which Vāsudeva is known, as Nārada gave them to Kālayavana. Rukmini’s maid giggles; Rukmini checks each against what she has heard.","why":"The closest the film comes to an exact description by a third party; it is also the audience’s checklist for E06-18.","turn":"She asks about a mark and the visitor cannot answer.","story":"A visitor to the palace is trading gossip about Krishna. He tells the marks as he heard them. The maid giggles at one. Rukmini, calmly and almost to herself, checks each against what she has heard: this one is right, that one is not. The visitor stops, a little offended. Rukmini smiles. There is a detail he got wrong, and she knows it.","gen":["Comedy of manners","Romance","Mystery"]},{"c":"S-438","src":"E06-01","t":"The question that frames the telling","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Adbhuta","pov":"The bard","pl":"The court of Parīkṣit; or a bard’s fire","k":"Spoken of, direct","sum":"Parīkṣit asks Śuka how Krishna won Rukmiṇī, having heard it was a rākṣasa-style marriage. Śuka begins. In the film’s version a bard answers a listener’s question: “They say he stole her.”","why":"A frame that lets the film answer the objection (“abduction”) with Rukmini’s choice.","turn":"The bard says: “She wrote the letter.”","story":"A fire at night and a small group around it. A listener asks the bard the thing he has heard: that Krishna stole a king’s daughter. The bard looks into the fire. “That is what they say,” he says. “They do not say that she wrote to him first.” The listener opens his mouth to ask, and the bard starts the story. The fire fades into a morning in Kuṇḍina.","gen":["Folk tale","Mythological epic","Mystery"]},{"c":"S-407","src":"E06-02","t":"Songs in the hall","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Śṛṅgāra","pov":"Rukmini","pl":"Bhīṣmaka’s palace","k":"Spoken of, direct","sum":"Visitors sing of Krishna’s qualities, beauty and valour. Rukmini, listening at the edge of the hall, decides he is the right husband. Elsewhere he judges her the right wife.","why":"The first and most important source of her image of him; the film’s inciting wish.","turn":"She decides.","story":"Visitors sing in her father’s hall. The first sings of his valour, the second of the gods he has met, the third of his beauty. Rukmini listens from the gallery with a hand on the rail. They disagree about his face, but the same man runs through all three songs. When the last singer stops, she realises she has made up her mind. She does not move. In another city, someone has made up his.","gen":["Romance","Musical/lyrical","Mythological epic"]},{"c":"S-164","src":"E06-03","t":"The hall decides","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"2–3","mid":2.5,"rasa":"Karuṇa","pov":"Rukmini","pl":"Palace hall","k":"Spoken of, direct (hostile)","sum":"Rukmī, hostile to Krishna, blocks the family’s inclination and arranges the match with Śiśupāla. Bhīṣmaka, who is inclined to Krishna, yields out of love for his son. Rukmini is overridden.","why":"The inciting incident: her choice is cancelled by the person who should protect her.","turn":"Her father gives way.","story":"Rukmī brings the news of the match in front of the whole household. He has settled it with Śiśupāla’s father. Rukmini says she has other wishes. Rukmī says what he thinks of the cowherd she means. She looks at her father. Bhīṣmaka looks down. He loves his son, and she sees it. Rukmī goes on talking. She does not cry. The scene ends on her silence.","gen":["Family drama","Political drama","Tragedy"]},{"c":"S-958","src":"E06-04","t":"Ink","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"3","mid":3,"rasa":"Śṛṅgāra","pov":"Rukmini","pl":"Rukmini’s quarters","k":"Addressed directly in the letter","sum":"Distressed, Rukmini sends a trusted brāhmaṇa to Krishna. She writes the letter: I have chosen you; no sensible maiden would choose another; if you do not come I will give up my life; come in secret; the plan is the temple procession. She seals it and gives it to him.","why":"Her first act and the film’s first turning point: an irreversible, active choice that carries the plan.","turn":"She seals it and gives it away.","story":"She sits down at night and takes out the ink. She has been taught how to write letters to kings. She writes to one. Every sentence costs her. She says she has chosen him. She says no sensible girl would choose another. She names the day and describes how it may be done. She says that if he does not come she will give up her life and try again in the next. She seals it, sends for the Brahmin and puts it in his hands.","gen":["Romance","Drama","Thriller"]},{"c":"S-354","src":"E06-05","t":"The Brahmin’s ride","carrier":false,"ev":6,"evn":"Abduction","cat":"A","tier":3,"mins":"2","mid":2,"rasa":"Vīra","pov":"The Brahmin","pl":"The road from Kuṇḍina to Dvārakā","k":"Not present","sum":"The Brahmin carries the letter on a long road: a guard post, a river crossing, a pursuer sent by Rukmī. Each is a small test; he thinks the letter is heavier than gold.","why":"Action with a plain man as the hero; the carrier as protagonist of the middle.","turn":"He crosses the river with the letter dry.","story":"The Brahmin leaves before dawn with the letter in his clothes. At a guard post, a soldier asks his business, and the Brahmin says something about a pilgrimage. A river is up and the ferryman refuses to cross until the Brahmin pays him double. A rider appears on the road behind him. He walks faster, then slower, and the rider goes by. The Brahmin takes the letter out at the next village and checks that it is dry.","gen":["Adventure","Thriller","Road movie"]},{"c":"S-705","src":"E06-06","t":"The Brahmin at Dvārakā","carrier":true,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"3","mid":3,"rasa":"Śṛṅgāra","pov":"The Brahmin","pl":"Dvārakā","k":"Hands","sum":"The Brahmin is received, honoured and fed. Krishna massages his feet and asks about his welfare, his duties, his king, and offers help. The Brahmin tells him everything and reads the letter. He asks Krishna to decide promptly.","why":"The honest portrait of a man who massages a messenger’s feet; the only eyewitness account before the temple.","turn":"Krishna reads the letter and smiles.","story":"The Brahmin is brought into a hall and sits down. Someone washes his feet, and it is not a servant. Hands: warm, careful. A voice asks about his journey, about his duties, whether his king protects his people, and whether he needs anything. The Brahmin, who has been rehearsing a speech for days, forgets it. He takes out the letter and reads it aloud. When he finishes, he asks the Lord to decide quickly.","gen":["Spiritual drama","Romance","Mythological epic"]},{"c":"S-793","src":"E06-07","t":"The night ride","carrier":false,"ev":6,"evn":"Abduction","cat":"A","tier":3,"mins":"2","mid":2,"rasa":"Vīra","pov":"The Brahmin or Dāruka","pl":"The road from Ānarta to Vidarbha, one night","k":"Shadow or sound","sum":"Krishna hears the wedding time, orders his chariot; Dāruka brings it. He and the Brahmin ride from Ānarta to Vidarbha in a single night: dark road, hooves, dawn light.","why":"Suspense without sight; the unseen man is on his way.","turn":"Dawn breaks on the plain of Vidarbha.","story":"He reads the time of the wedding, calls for the chariot and does not wait to be asked twice. Dāruka brings it. The Brahmin climbs in. They leave in the dark. The road goes under the wheels, the stars turn over, and the horses do not slow. Somewhere in the night the Brahmin closes his eyes. When he opens them there is a grey line in the east, and the plain of Vidarbha.","gen":["Adventure","Thriller","Mythological epic"]},{"c":"S-108","src":"E06-08","t":"The bride is made ready","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Karuṇa","pov":"Rukmini","pl":"Palace; women’s quarters","k":"Not present","sum":"Bhīṣmaka prepares for Śiśupāla’s wedding. The city is cleaned and decorated, rituals performed, gifts given. Rukmini is bathed and adorned: ritual as imprisonment.","why":"Suffocation: she is dressed for a wedding she does not want.","turn":"She hides something in a fold of the dress.","story":"The city is cleaned and hung with flowers. Priests chant. Gifts are given. In the women’s quarters Rukmini is bathed, dressed and adorned until she can barely move. Bangles close on her wrists. Each ornament is a fastening. A maid holds up a mirror. She looks at the stranger in it, and slips something into a fold of the dress.","gen":["Family drama","Gothic-like","Romance"]},{"c":"S-741","src":"E06-09","t":"The kings gather and swear","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":4,"mins":"2","mid":2,"rasa":"Bhayānaka","pov":"Rukmini","pl":"Kuṇḍina’s hall and streets","k":"Spoken of, direct (hostile)","sum":"Damaghoṣa arrives with an army; Jarasandha, Śālva, Dantavakra, Vidūratha, Pauṇḍraka and thousands of kings come as Śiśupāla’s allies and vow to fight Krishna if he steals the bride.","why":"A city on the edge of a massacre; the coalition of kings made visible; the Earth’s burden at Kuṇḍina.","turn":"The vow is sworn aloud.","story":"The kings arrive in a long column. Damaghoṣa comes with an army, then Jarasandha, then Śālva, Dantavakra, Vidūratha and Pauṇḍraka, each with an escort. In the hall they give the vow together, and then separately: if Krishna comes to steal her, we will fight him. Rukmini hears about it from a window. She counts the banners. There are too many to count.","gen":["Political drama","War","Thriller"]},{"c":"S-121","src":"E06-10","t":"Balarama arrives","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"1","mid":1,"rasa":"Vīra","pov":"Balarama","pl":"The road to Kuṇḍina","k":"Spoken of, indirect","sum":"Balarama, fearing conflict and out of love for his brother, hurries to Kuṇḍina with a large army.","why":"A brother’s love sends an army before he is asked.","turn":"He gives the order to march.","story":"Balarama is not asked. He hears the kings are gathering and that his brother has gone alone, and he gathers an army. He leaves at once with a large force. On the road he is silent. A captain asks if there is trouble. He says there will be. The army marches on through the afternoon.","gen":["War","Family drama","Adventure"]},{"c":"S-922","src":"E06-11","t":"The waiting","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"2–3","mid":2.5,"rasa":"Bhayānaka","pov":"Rukmini","pl":"Rukmini’s quarters","k":"Not present","sum":"The hour is near. Krishna and the Brahmin have not come. She imagines reasons, including the displeasure of Brahmā or Śiva, and consoles herself that the time has not yet passed.","why":"The low point: hope turning to dread.","turn":"She prays to the very gods she fears.","story":"The hour is near, and the Brahmin has not returned. Rukmini sits in her room dressed for the wedding and waits. She imagines that he never arrived, that the letter was refused, that the gods are angry with her, that she asked too much. She goes through every reason in order. The lamp burns lower. A maid brings food and takes it away again. She starts to pray to the gods she is afraid of.","gen":["Drama","Suspense","Romance"]},{"c":"S-430","src":"E06-12","t":"Omens and the smile","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"3","mid":3,"rasa":"Śṛṅgāra (with Hāsya)","pov":"Rukmini","pl":"Rukmini’s quarters","k":"Spoken of, direct","sum":"Her left eye, arm and thigh twitch: a good sign. The Brahmin walks in smiling, joyful, with Krishna’s message and promise.","why":"Dread breaks; the answer to her letter arrives as a report.","turn":"He walks in smiling before he speaks.","story":"Her left eye twitches, then her arm, then her thigh. She is not sure whether to trust it. A moment later the door opens and the Brahmin comes in, smiling. He does not say anything for a moment, and it is enough. Then he cannot stop. He tells her what he saw: the city in the sea, the gold gates, the lamps. He tells her that the man himself washed his feet. He says the man told him he could not sleep either. Rukmini laughs, and then cries.","gen":["Romance","Comedy of manners","Drama"]},{"c":"S-896","src":"E06-13","t":"Bhīṣmaka receives the guests","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"1–2","mid":1.5,"rasa":"Karuṇa","pov":"Bhīṣmaka","pl":"The palace gate","k":"Spoken of, indirect","sum":"Rukmini bows to the Brahmin. Bhīṣmaka receives Krishna and Balarama with honour and hosts the other kings by rank.","why":"The father’s quiet sorrow and hospitality; the family’s divided loyalty.","turn":"He greets Krishna.","story":"At the gate of the palace Bhīṣmaka waits for two arrivals. He has sent his steward ahead, and he goes down himself. His face tells the story: he is relieved, afraid and grateful at once. The guests arrive; the camera is on him. He bows. He leads them in by the right hand, and the crowd closes behind. He knows what he has done, and what it will cost him.","gen":["Family drama","Political drama","Mythological epic"]},{"c":"S-944","src":"E06-14","t":"The city’s wish","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Karuṇa","pov":"Rukmini","pl":"Kuṇḍina’s streets","k":"Spoken of, direct","sum":"The citizens gaze at Krishna and wish Rukmini may marry him, offering their merit.","why":"A whole city offers its merit for a bride’s choice; public hope she can hear.","turn":"A woman lifts a garland toward her window.","story":"In the street below her window the citizens are looking at someone she cannot see. They talk quietly. A woman holds up a garland. An old man says he would give his merit if she could marry him. A child says the same thing, a little louder. The street takes it up in murmurs. Rukmini, behind the screen, hears it all, and does not look.","gen":["Folk tale","Romance","Drama"]},{"c":"S-420","src":"E06-15","t":"The guarded procession","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":4,"mins":"2–3","mid":2.5,"rasa":"Śṛṅgāra","pov":"Rukmini","pl":"The road from the palace to Ambikā’s temple","k":"Spoken of, indirect","sum":"Rukmini leaves the palace for the Ambikā temple, guarded and accompanied by her mothers, friends, musicians and bards amid drums, conches and horns. A ring of soldiers surrounds her.","why":"Escape through ceremony: the plan begins as a pageant.","turn":"She steps over the temple threshold.","story":"She leaves the palace for the temple with a ring of soldiers around her. Her mothers walk ahead, her friends behind. Musicians play, conches sound, bards sing the old stories under their breath, and one of them, softly, sings the one about the goddess who passed every claimant. The soldiers watch the road for any sign of him. She looks straight ahead. The temple door is at the end.","gen":["Drama","Thriller","Mythological epic"]},{"c":"S-802","src":"E06-16","t":"The prayer to Ambikā","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Śānta","pov":"Rukmini","pl":"The temple of Ambikā","k":"Spoken of (prayer)","sum":"She washes, enters, is guided by brāhmaṇa women in worship, prays that Krishna become her husband, and receives blessings and prasāda. The temple wall behind her holds the panels of the Churning.","why":"A silent request at the shrine of the goddess who held Śiva’s poison; she asks for nothing but him.","turn":"She lifts her eyes from the idol.","story":"She washes, enters, and kneels in front of the goddess. The temple women guide her through the worship. She asks for what she came to ask. She does not ask to be saved. She asks to be able to bear whatever she has chosen. The goddess’s eyes are painted, and her hands are open. Behind her on the wall is the panel with the poison and the throat. She takes the blessings and the food and stands.","gen":["Spiritual drama","Romance","Mythological epic"]},{"c":"S-279","src":"E06-17","t":"Breaking her silence","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Vīra","pov":"Rukmini","pl":"The temple door and the forecourt","k":"Not present","sum":"She breaks her vow of silence and walks out, led by a maidservant, among the assembled kings, who are stunned by her.","why":"Her voice, her public act; the first step of the climax.","turn":"She speaks.","story":"She comes out of the temple door with her friends behind her. A maid takes her hand. She breaks her vow of silence and says something no one hears. Then she walks, slowly, into the forecourt, among the kings. They have been waiting for the bride to pass. They stop talking. One of them drops a cup. She walks past them as if they were furniture.","gen":["Drama","Romance","Mythological epic"]},{"c":"S-449","src":"E06-18","t":"First sight","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":5,"mins":"1–2","mid":1.5,"rasa":"Śṛṅgāra, Adbhuta","pov":"Rukmini","pl":"The forecourt of the temple","k":"Face (first)","sum":"She advances shyly, glancing at the kings. She sees Krishna and is eager to mount his chariot.","why":"Recognition at last; the moment the whole film delays; reversal and recognition in one beat.","turn":"Her eyes find him.","story":"She walks across the stones with her eyes down. Then she lifts them, and sees him. The camera is hers. He is standing in a chariot at the edge of the forecourt. He is not any of the songs, and all of them. She sees why the singers could not agree: each had caught him in a different light. Now there is only this one. The blue light, withheld all film, arrives. No one says his name.","gen":["Romance","Spiritual drama","Mythological epic"]},{"c":"S-615","src":"E06-19","t":"The lift","carrier":false,"ev":6,"evn":"Abduction","cat":"A","tier":4,"mins":"1","mid":1,"rasa":"Vīra","pov":"Rukmini","pl":"The forecourt","k":"Hands, face","sum":"He seizes her before his enemies and lifts her onto the chariot. She has chosen it: she goes willingly.","why":"Seizing and choosing at once: she chooses to be taken. The film’s theme in an act.","turn":"Her foot leaves the ground.","story":"He does not wait for her to climb. He takes her in his arms in front of every king and sets her beside him. The chariot jolts. Her foot is already on the board. Dāruka’s hands are on the reins. For half a second no one understands what has happened. She turns and looks at the faces behind her, and does not look back at the temple.","gen":["Romance","Action","Mythological epic"]},{"c":"S-413","src":"E06-20","t":"Through the ring of kings","carrier":false,"ev":6,"evn":"Abduction","cat":"A","tier":5,"mins":"1–2","mid":1.5,"rasa":"Vīra","pov":"Rukmini","pl":"The forecourt and the road","k":"Shadow or sound","sum":"He drives off through the ring of kings with Balarama leading, like a lion taking its prey from jackals. The conch sounds.","why":"Release of energy after the lift; the kings’ humiliation made visible.","turn":"The ring breaks.","story":"The chariot goes through the ring of kings like a lion through jackals. Balarama’s men open the way in front. The conch sounds, long and clear. The kings draw swords too late. Rukmini holds the rail and does not look down. The road opens in front of them. Behind her, a hundred horses turn at once.","gen":["Action","Adventure","Mythological epic"]},{"c":"S-190","src":"E06-21","t":"The coalition’s lament","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"1","mid":1,"rasa":"Raudra","pov":"Śiśupāla","pl":"The forecourt","k":"Spoken of, direct (hostile)","sum":"Jarasandha and the others cannot bear it. They lament that “mere cowherds” took their honour. Śiśupāla stands in the groom’s clothes.","why":"The kings’ humiliation; a rare scene from the losers’ side.","turn":"Śiśupāla looks at his empty hands.","story":"The kings stand where the chariot was. Jarasandha says they have been robbed by cowherds. Dantavakra swears. Śālva looks at his own hands. In the middle of them stands Śiśupāla in his groom’s clothes with the garland still on his neck. He looks at the empty ground where the bride walked. No one says anything to him.","gen":["Political drama","Comedy of manners","Tragedy"]},{"c":"S-753","src":"E06-22","t":"The pursuit and the Yadava defence","carrier":false,"ev":6,"evn":"Abduction","cat":"A","tier":5,"mins":"2–3","mid":2.5,"rasa":"Bhayānaka","pov":"Rukmini","pl":"The road and the plain","k":"Spoken of, direct (voice only)","sum":"The enraged kings arm and chase. The Yadava commanders turn to face them. Arrows fall; Rukmini fears for her husband’s army. Krishna’s voice reassures her: your side will soon destroy them. Gada, Saṅkarṣaṇa and others strike down horses, elephants and chariots.","why":"The first test of her choice: she fears for the people who came for her.","turn":"The Yadava line holds.","story":"The kings arm and chase. Behind the chariot the Yādava commanders turn and face them. Arrows fall like rain. Rukmini sees them land and thinks, for the first time, of the men who are dying for her. Beside her, a voice says, quietly, that her side will soon destroy them. She looks. Behind them, horses go down, elephants turn, and the chase breaks into pieces.","gen":["Action","War","Romance"]},{"c":"S-905","src":"E06-23","t":"Jarasandha consoles Śiśupāla","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":2,"mins":"2","mid":2,"rasa":"Śānta","pov":"Jarasandha","pl":"The roadside after the rout","k":"Spoken of, indirect","sum":"Jarasandha sees his side destroyed and withdraws. He consoles the dejected Śiśupāla: victory and defeat are governed by time and fate; the kings will prevail when time turns. They go home.","why":"Philosophy as a way of saving face; the coalition’s habit of consoling itself.","turn":"Śiśupāla accepts the consolation.","story":"The kings come off the field in pieces. Jarasandha finds Śiśupāla standing with his hands empty. He talks to him as to a son. Victory and defeat, he says, belong to time and fate. Time turns, and when it does, we will win. Śiśupāla listens and nods. The kings go home. The camera stays on the road a moment after they have gone.","gen":["Political drama","Tragedy","Mythological epic"]},{"c":"S-697","src":"E06-24","t":"Rukmī’s oath","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Raudra","pov":"Rukmī","pl":"The roadside","k":"Spoken of, direct (hostile)","sum":"Rukmī, unable to bear it, pursues with a division and vows before the kings not to re-enter Kuṇḍina until he has killed Krishna and recovered his sister.","why":"A public vow that locks him out of his own home; the personal opponent’s peak.","turn":"He swears.","story":"Rukmī cannot bear it. He turns on his horse in front of the kings and swears that he will not enter Kuṇḍina again until he has killed the cowherd and brought his sister back. The kings watch. He gathers one division and goes after the chariot alone. Behind him, nobody tries to stop him.","gen":["Tragedy","War","Family drama"]},{"c":"S-713","src":"E06-25","t":"The duel","carrier":false,"ev":6,"evn":"Abduction","cat":"A","tier":5,"mins":"3","mid":3,"rasa":"Bhayānaka","pov":"Rukmini","pl":"The road; the plain","k":"Effect, face","sum":"Rukmī attacks. Krishna breaks each of his bows, destroys his weapons and shield. Rukmī leaps down with a sword; Krishna cuts it to pieces and readies his own to kill him. Rukmini watches the two men she loves try to kill each other.","why":"Brother against husband; the longest scene where Krishna acts.","turn":"The sword is raised.","story":"Rukmī catches up. He attacks, and Krishna breaks his bow. He takes another, and it breaks. He takes a third. Weapon after weapon, shield after shield, until Rukmī leaps down with a sword in his hand. Krishna cuts it to pieces. He turns his own sword. Rukmini, in the chariot, watches the two men she loves move toward the end.","gen":["Action","Tragedy","Thriller"]},{"c":"S-703","src":"E06-26","t":"The plea","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":4,"mins":"2","mid":2,"rasa":"Karuṇa","pov":"Rukmini","pl":"The plain","k":"Face","sum":"Rukmini falls at Krishna’s feet and begs for her brother’s life. He stops.","why":"Her second decisive act: on her knees at the feet of the man who has just saved her. Mercy won.","turn":"He lowers the sword.","story":"She goes to her knees. Nothing in her had planned it. She puts her arms around his feet and asks for her brother’s life. The sword is above her. The world is still. She does not look up. Then the blade comes down, empty, and her husband lowers it. Rukmini’s head is still bowed. She does not move for a long time.","gen":["Drama","Tragedy","Spiritual drama"]},{"c":"S-950","src":"E06-27","t":"The shaving","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"1–2","mid":1.5,"rasa":"Karuṇa","pov":"Rukmini","pl":"The plain","k":"Face","sum":"Krishna binds Rukmī with cloth and shaves part of his hair and moustache. Mercy and humiliation in the same stroke. Rukmini looks away.","why":"The cost of mercy: the brother lives but is shamed.","turn":"The razor.","story":"He binds Rukmī with a strip of cloth and cuts away half his moustache and half his hair. It is mercy and it is humiliation, in one gesture. Rukmī does not struggle. Rukmini looks away. The cut hair falls on the road. The wind takes some of it.","gen":["Drama","Tragedy","Dark comedy"]},{"c":"S-569","src":"E06-28","t":"Balarama’s rebuke","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":2,"mins":"1–2","mid":1.5,"rasa":"Raudra","pov":"Rukmini","pl":"The plain","k":"Spoken of, direct","sum":"Balarama frees Rukmī and rebukes Krishna: this is not worthy of our family.","why":"Two brothers in moral disagreement in front of the bride; Balarama’s two loyalties.","turn":"Krishna does not answer.","story":"Balarama arrives with his army and sees what has been done. He frees Rukmī and turns to his brother. This is not worthy of us, he says. It was not a matter for shame. Krishna does not answer. Rukmini stands between them and says nothing. The wind moves the cut hair along the road.","gen":["Family drama","Drama","Mythological epic"]},{"c":"S-866","src":"E06-29","t":"Balarama consoles her","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Śānta","pov":"Rukmini","pl":"The plain","k":"Spoken of, direct","sum":"Balarama consoles Rukmini: people bear their own joy and sorrow; the self is not the body; a warrior’s duties can be harsh. She calms.","why":"A brother-in-law becomes a teacher in a moment of grief; the first time someone close to Krishna speaks of him as a person.","turn":"She wipes her face.","story":"Balarama sits down beside Rukmini on the ground. He tells her that each person bears their own joy and their own sorrow. He tells her that the self is not the body. He says a warrior’s duties can be harsh, and that her brother has met his. He does not tell her it will not hurt. She listens, wipes her face with the end of her veil, and nods.","gen":["Spiritual drama","Family drama","Drama"]},{"c":"S-191","src":"E06-30","t":"Rukmī’s exile","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"1","mid":1,"rasa":"Karuṇa","pov":"Rukmī","pl":"A river plain; Bhojakaṭa","k":"Spoken of, indirect","sum":"Humiliated, Rukmī builds the city of Bhojakaṭa and will not return to Kuṇḍina.","why":"A proud man builds a city so he need not go home; the cost.","turn":"The first wall rises.","story":"Rukmī does not go home. He has sworn, and he keeps his word. On a river plain far from Kuṇḍina he sets a stake in the ground and has a wall built round it. The first walls go up. Workers lay stone. A city is made of an oath. He stands on the rampart in the evening and looks toward home.","gen":["Tragedy","Historical drama","Drama"]},{"c":"S-435","src":"E06-31","t":"Garlands, cloth and a crossing","carrier":false,"ev":6,"evn":"Abduction","cat":"D","tier":3,"mins":"1–2","mid":1.5,"rasa":"Śānta","pov":"The flower vendor","pl":"Kuṇḍina; the river","k":"Not present","sum":"The flower vendor’s garlands are used for a different bride. The weaver’s wedding cloth is carried away on a chariot. The ferryman takes a Yadava soldier across the river and no one else.","why":"World-welfare proof for Event 06: a coerced alliance does not bind two kingdoms to war; markets return.","turn":"A bride at another house wears the vendor’s garlands.","story":"The wedding is off and the flower vendor finds her garlands used for another bride at another door. The weaver’s wedding cloth, woven for a day that did not come, rides out on the back of a chariot. The ferryman takes one Yādava soldier across the river and refuses everyone else. Three small stories in a single morning. None of them know who took the bride. All of them are glad.","gen":["Folk tale","Drama","Comedy of manners"]},{"c":"S-565","src":"E07-01","t":"The cut: from the road to the city","carrier":false,"ev":7,"evn":"Final episode","cat":"D","tier":2,"mins":"0–1","mid":0.5,"rasa":"Śānta","pov":"Rukmini","pl":"The road to Dvārakā","k":"Not present","sum":"The text says Krishna marries her according to Vedic rites and takes her to Dvārakā. The film shows none of it. A cut goes from the road, after Balarama’s consolation, to the city, with the ceremony left as a gap.","why":"Keeps the project rule: no marriage on screen, nothing after.","turn":"The sea appears at the edge of the road.","story":"The road. Balarama’s consolation is over, and the chariot goes on. The text says that rites were done, and the film shows none of them. A cut: the wheels, the dust, a gap in the hills, and a line of light where the land ends. Somewhere in that gap a marriage has happened, and we are not shown it. The sea comes into view at the edge of the road.","gen":["Romance","Road movie","Mythological epic"]},{"c":"S-735","src":"E07-02","t":"First sight of the sea","carrier":false,"ev":7,"evn":"Final episode","cat":"D","tier":4,"mins":"1","mid":1,"rasa":"Adbhuta","pov":"Rukmini","pl":"The shore at Dvārakā","k":"Not present","sum":"Rukmini, who has lived inland, sees the ocean for the first time from the chariot, with a city rising from the water. She compares it with what she imagined.","why":"A second first sight: the sea, answering the stories; the first reversal of expectation.","turn":"She sees the gold gate.","story":"She has never seen the sea. From the chariot it comes first as a line, then as a wideness that does not end, then as a gold gate standing in the water. It is not the city of the songs. It is more, and it is smaller. She holds the rail. The wind pulls at her veil. She does not say anything. She is aware that he is beside her, and that the sea has her whole attention.","gen":["Romance","Spectacle/wonder","Mythological epic"]},{"c":"S-460","src":"E07-03","t":"The city at its doors","carrier":false,"ev":7,"evn":"Final episode","cat":"D","tier":5,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"Rukmini","pl":"The streets of Dvārakā","k":"Effect","sum":"Dvārakā is decorated; guests from many clans rejoice; citizens offer jewelled gifts; doorways have lamps; flowers on the streets. The vendor, water-carrier, potter, goatherd, farmer and fisher family appear, each in a doorway. A cow lies down in the street. The wall is clean.","why":"The ledger closes: the world’s gains seen at once.","turn":"The water-carrier raises a hand beside a clean wall.","story":"The city has come out into the street. Doors are hung with lamps. Flowers lie on the ground. The vendor from Kuṇḍina stands at a corner with her basket, the water-carrier beside a clean wall, the potter at his wheel, the goatherd with his goats, the farmer with his cow, and the fisher family on the quay. Each lifts a hand. Citizens give gifts. The chariot goes through them slowly. In one wide shot, every one of them is in a doorway.","gen":["Folk tale","Mythological epic","Musical/lyrical"]},{"c":"S-334","src":"E07-04","t":"The lamp","carrier":false,"ev":7,"evn":"Final episode","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Śṛṅgāra","pov":"Rukmini","pl":"Rukmini’s new room","k":"Hands","sum":"Her lamp from Kuṇḍina, carried in her hands; a matching lamp already lit in Dvārakā. She sets hers beside it.","why":"The answer to the letter; the twin-lamps motif.","turn":"She sees the second lamp already lit.","story":"In her new room she takes the lamp she carried from Kuṇḍina out of her bag. She has kept it through all of it. She puts it down on a ledge and sees that another lamp is already burning there, the same shape. A hand has lit it. She stands a long time. She lights her own and sets it beside the first.","gen":["Romance","Art-house","Drama"]},{"c":"S-547","src":"E07-05","t":"The empty place","carrier":false,"ev":7,"evn":"Final episode","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Karuṇa","pov":"Rukmini","pl":"The hall of Dvārakā","k":"Not present","sum":"In the middle of the joy, a place is laid for a brother who will not come. A thread to Bhojakaṭa.","why":"The cost of the day: Rukmī’s absence.","turn":"She notices the empty place.","story":"In the middle of the feast a place is laid for someone. A small cup, a plate, a space at the end of the table. Nobody sits there. The talk goes on. Rukmini sees the place and then looks at the door. She does not say anything. Beside her, someone sees her look, and sets the place a little straighter. The meal goes on.","gen":["Family drama","Tragedy","Art-house"]},{"c":"S-285","src":"E07-06","t":"The song","carrier":false,"ev":7,"evn":"Final episode","cat":"D","tier":3,"mins":"1","mid":1,"rasa":"Śṛṅgāra","pov":"Rukmini","pl":"A courtyard in Dvārakā","k":"Spoken of, direct","sum":"A bard sings the story of the abduction, as the text says it was sung through the land. It is her side of the story. The kings hear it.","why":"The story becomes the song; the bard closes his frame.","turn":"The bard includes her letter.","story":"In a courtyard a bard begins to sing. It is the story of a girl in Vidarbha who heard of a man, and wrote to him, and walked out of a temple. He sings it from her side, which no one has ever done. Among the listeners are kings who came to the wedding as friends of the other side. They listen. At the end, the bard looks across the courtyard. She is there, and he bows.","gen":["Musical/lyrical","Folk tale","Romance"]},{"c":"S-559","src":"E07-07","t":"What he says, and does not say","carrier":false,"ev":7,"evn":"Final episode","cat":"D","tier":3,"mins":"1","mid":1,"rasa":"Śṛṅgāra","pov":"Rukmini","pl":"A terrace by the sea","k":"Face","sum":"A line or a silence: his reply to her letter, or her telling him what she saw at the temple (the reverse of the letter). One of the two speaks.","why":"The film’s last exchange; she lights him now.","turn":"One of them speaks.","story":"On a terrace by the sea, the two of them. One of them has to speak. If it is he, he answers her letter. If it is she, she tells him what she saw at the temple. The evening is almost over. A line, or a silence, and the film chooses one. The sea is loud behind them. She looks at him for the first time as a man and not a story.","gen":["Romance","Drama","Art-house"]},{"c":"S-709","src":"E07-08","t":"Together at the edge of the sea","carrier":false,"ev":7,"evn":"Final episode","cat":"D","tier":3,"mins":"1","mid":1,"rasa":"Śṛṅgāra","pov":"Rukmini","pl":"The shore at Dvārakā","k":"Face","sum":"The two stand side by side, in profile or from behind, with Rukmini the visual centre. The image is held a little longer than any shot of Krishna in the film.","why":"The last image: two people in one frame after a film in which one has barely been seen.","turn":"The held shot.","story":"The two of them stand side by side at the edge of the sea, in profile or from behind. The light is long and low. Rukmini is the centre of the frame. She does not look at him. For the first time in the film there is no one else in the frame. The shot is held a little longer than any shot of him has been held. Then the film ends.","gen":["Romance","Mythological epic","Art-house"]},{"c":"S-446","src":"E08-01","t":"The marked child","carrier":false,"ev":8,"evn":"Backstories","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Bhayānaka","pov":"Śiśupāla’s mother","pl":"The palace of Chedi","k":"Spoken of, indirect","sum":"An infant is born with three eyes and four arms. A heavenly voice says the marks will vanish when the child is placed on the lap of the one who will cause his death.","why":"Gives the rival’s life a prophecy; the invisible countdown.","turn":"The voice speaks.","story":"A child is born in the palace of Chedi, and the room goes quiet. He has three eyes and four arms. The queen looks at him and the midwives step back. A voice from the sky speaks: the extra arms and the third eye will fall away when he is placed on the lap of the one who will cause his death. The king and queen listen. No one asks the voice who that will be.","gen":["Horror","Mythological epic","Tragedy"]},{"c":"S-807","src":"E08-02","t":"The mother’s terror","carrier":false,"ev":8,"evn":"Backstories","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Bhayānaka","pov":"Śiśupāla’s mother","pl":"The palace","k":"Hands","sum":"Krishna visits and takes the infant on his lap; the extra arms and eye vanish. The mother realises that the one who restored her child may also be the one destined to kill him.","why":"Recognition tinged with horror; the first meeting of Krishna and Śiśupāla.","turn":"The marks vanish.","story":"Krishna comes to the palace on a visit. The mother puts the child on his lap, because she has been told to. The extra arms and the eye vanish. She holds her breath. The child is just a child. She understands, all at once, that the man who made her son whole is the man who will end him. The scene ends on her face, not on his.","gen":["Tragedy","Horror","Mythological epic"]},{"c":"S-208","src":"E08-03","t":"The hundred offences","carrier":false,"ev":8,"evn":"Backstories","cat":"D","tier":2,"mins":"2","mid":2,"rasa":"Karuṇa","pov":"Śiśupāla’s mother","pl":"The palace","k":"Spoken of, direct","sum":"The mother begs Krishna to spare her son. Krishna promises to tolerate one hundred offences.","why":"The film’s clock; a bargain made with the one who will take her son.","turn":"Krishna agrees.","story":"She asks him to spare her son. He is kind and says he will pardon his faults. She asks how many. He says a hundred. She nods, and does not tell her son. The camera is on her. The number goes into the film like a clock that starts ticking and cannot be heard.","gen":["Drama","Mythological epic","Thriller"]},{"c":"S-329","src":"E08-04","t":"Jaya and Vijaya’s curse","carrier":false,"ev":8,"evn":"Backstories","cat":"D","tier":4,"mins":"2","mid":2,"rasa":"Karuṇa","pov":"Jaya and Vijaya","pl":"Vaikuṇṭha","k":"Not present","sum":"The four Kumāras visit Vaikuṇṭha and are stopped by the gatekeepers Jaya and Vijaya. They curse them to be born in the world. Viṣṇu gives them a choice: seven births as devotees or three births as enemies. They choose three.","why":"A cosmic curse behind Śiśupāla’s life, mirroring Durvāsā’s curse.","turn":"They choose three births as enemies.","story":"At the gate of Vaikuṇṭha two guards stop four sages. The sages are children in appearance and ancient in fact. Jaya and Vijaya say no one may enter. The sages curse them to be born in the world below. The Lord himself comes to the gate, and the guards fall at his feet. They can have seven births as his friends, or three as his enemies. They choose three, because they cannot bear to be away from him longer.","gen":["Mythological epic","Fantasy","Tragedy"]},{"c":"S-946","src":"E08-05","t":"The lost bride","carrier":false,"ev":8,"evn":"Backstories","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Raudra","pov":"Śiśupāla","pl":"Kuṇḍina","k":"Spoken of, direct (hostile)","sum":"Śiśupāla, in his groom’s clothes, finds the bride gone. His hostility hardens.","why":"The rival’s wound; his humiliation as a reason for later hatred.","turn":"He realises she left willingly.","story":"In groom’s clothes with a garland on his neck, Śiśupāla waits at the temple. He has been told a bride will come. The forecourt is empty. He turns to someone and asks. They tell him. He looks at the road, and then at his own hands. He understands that she went willingly. His face changes slowly, and what takes its place is not grief.","gen":["Tragedy","Drama","Political drama"]},{"c":"S-128","src":"E08-06","t":"Balarama’s two loyalties","carrier":false,"ev":8,"evn":"Backstories","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Raudra","pov":"Balarama","pl":"The plain; Dvārakā","k":"Spoken of, direct","sum":"A man who defends his brother with an army and rebukes him for the shaving. Two loyalties in one man.","why":"Deepens Balarama’s role beyond E06-28; a possible second beat.","turn":"He chooses justice for Rukmī.","story":"Balarama has defended his brother with an army, and he is not silent. He tells him the shaving was not worthy. He says it again more quietly. Then he turns to the army and tells them to stand down. He keeps both loyalties and does not pretend they are one. The scene ends on his back as he walks away.","gen":["Family drama","Drama","Mythological epic"]},{"c":"S-218","src":"E08-07","t":"Rukmī’s overreach","carrier":false,"ev":8,"evn":"Backstories","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Raudra","pov":"Rukmī","pl":"Kuṇḍina; the road","k":"Spoken of, direct (hostile)","sum":"Control, vow and ruin as a single arc: a brother who arranges a match, swears an oath, loses a duel and builds a city so he need not go home.","why":"The personal opponent’s arc in one scene; a possible single-scene summary.","turn":"He swears the oath.","story":"Rukmī arranges a match. He swears an oath. He loses a duel. He builds a city. Four short images: a hall in which his voice is the loudest, a roadside where he swears, a road where he falls, a plain where he lays the first stone. The man does not change between them. The only thing that changes is how much he has left.","gen":["Tragedy","Political drama","Drama"]}];
const TE={"sc":{"S-230":{"t":"పూలమాల, శాపం","sum":"దుర్వాసుడనే మహర్షి ఇంద్రునికి ఒక పూలమాల ఇస్తాడు. ఆలోచనల్లో మునిగిన ఇంద్రుడు దాన్ని తన ఏనుగు ఐరావతం మెడలో వేస్తాడు. ఆ ఏనుగు దాన్ని నేలకు విసిరి తొక్కేస్తుంది. దేవతలు సంపదను కోల్పోవాలని దుర్వాసుడు శపిస్తాడు.","why":"పౌరాణిక కథా చట్రాన్ని ఒక చిన్న నిర్లక్ష్యంతో ప్రారంభిస్తుంది. ఆ నిర్లక్ష్యమే మహా విపత్తుగా మారుతుంది; గర్వం, దాని మూల్యం.","turn":"ఏనుగు మాలను జార విడుస్తుంది, అది నలిగిపోతుంది.","story":"ఇంద్రుని సభ పూర్తి కాంతితో వెలిగిపోతోంది: బంగారం, ముత్యాలు, సంగీతం, ప్రతి రంగూ దాని అత్యంత ప్రకాశంలో ఉంది. దుర్వాసుడు తొందర లేకుండా లోపలికి వస్తాడు, బహుమతిగా ఇవ్వడానికి ఒక మాల తెచ్చి. సగం వింటూ ఉన్న ఇంద్రుడు చూడకుండానే దాన్ని అందుకుని ఐరావతం తలపై వేస్తాడు. తెల్లని ఆ మహా ఏనుగు దాన్ని విదిలించగా, మాల దాని కాలి కింద పడుతుంది. సభ నిశ్శబ్దమవుతుంది. దుర్వాసుడు నలిగిన పూలను చూస్తాడు, ఆ తరువాత ఇంద్రుని చూస్తాడు; తాను ఏం చేశాడో ఇంద్రునికి ఇంకా అర్థం కాలేదు. మహర్షి ఒకే వాక్యం పలుకుతాడు, అదే శాపం, వెలుగు గుండా నడిచి వెళ్లిపోతాడు. దృశ్యం నేలపై పడ్డ పూలపై ముగుస్తుంది."},"S-144":{"t":"దేవతల పతనం","sum":"స్వర్గం నుంచి సిరిసంపదలు ఇంకిపోతాయి. కవచాల నుంచి, సభ నుంచి రంగులు వెలిసిపోతాయి; దేవతల బలం క్షీణిస్తుంది. అసురులు వారిని ముంచెత్తుతారు, దేవతలు శరణార్థులై పారిపోతారు.","why":"సహాయం కోరే లోకాన్ని ఏర్పరుస్తుంది: బలవంతులు యాచకులవుతారు, గర్వానికి మూల్యం చెల్లిస్తారు.","turn":"ఇంద్రుని వజ్రాయుధం పనిచేయదు; దేవతలు పరుగెత్తుతారు.","story":"శాపం పనిచేయడం మొదలవుతుంది. మొదట జెండాల నుంచి రంగు పోతుంది, తరువాత కవచాల నుంచి, ఆ తరువాత ముఖాల నుంచి. దాంతో పాటు దేవతల బలం కూడా క్షీణిస్తుంది; ఇంద్రుని వజ్రాయుధం రెపరెపలాడి ఆరిపోతుంది. అసురులు అంచుల నుంచి లోపలికి వస్తారు, ఇప్పుడు దేవతల కన్నా ప్రకాశవంతంగా. దేవతలు పరుగెత్తుతారు. కొందరు పడిపోయినవారికి సాయం చేయడానికి ఆగుతారు; చాలామంది ఆగరు. చివరి దృశ్యం బూడిదరంగులో మారిన సభ: నేలపై ఇంకా నలిగిన మాల పూలు, అక్కడి నుంచి బయటకు నడుస్తున్న దేవతల పొడవైన వరుస."},"S-607":{"t":"బ్రహ్మకు విన్నపం, భగవంతుని సూచన","sum":"దేవతలు బ్రహ్మ వద్దకు వెళ్తారు, ఆయన వారిని విష్ణువు వద్దకు తీసుకెళ్తాడు. ఒక స్వరం ఇలా బదులిస్తుంది: శత్రువులతో సంధి చేసుకుని అమృతం కోసం క్షీరసాగరాన్ని మథించండి; మిగిలినది భగవంతుడే ఏర్పాటు చేస్తాడు.","why":"పథకాన్ని, చిత్రం యొక్క వ్యాకరణ పాఠాన్ని అందిస్తుంది: భగవంతుడు ఇతరుల ద్వారా పనిచేస్తాడు, ఎప్పుడూ ఆ గదిలో ఉండడు.","turn":"ఆ స్వరం సారాంశంగా ఇలా చెబుతుంది: “మీరు చేయండి, మీరు పట్టుకోలేనిదాన్ని నేను పట్టుకుంటాను.”","story":"దేవతలు బ్రహ్మ వద్దకు వెళ్తారు, ఆయన వారిని ఆకాశం మీదుగా క్షీరసాగర తీరానికి తీసుకెళ్తాడు. నీరు నిశ్చలంగా, తెల్లగా ఉంటుంది. వారు మోకరిల్లుతారు. ఏదీ కనిపించదు. నీటి ఉపరితలంపై ఒక కాంతి కదులుతుంది, ఒక స్వరం పలుకుతుంది, అది బ్రహ్మకు మాత్రమే స్పష్టంగా వినిపిస్తుంది. ఆయన ఇంద్రుని వైపు తిరిగి దాన్ని చెబుతాడు: శత్రువులతో శాంతి చేసుకోండి, అమృతం కోసం ఈ సముద్రాన్ని మథించండి, మిగిలినది మీ కోసం భద్రంగా ఉంటుంది. దేవతలు ఒకరినొకరు చూసుకుంటారు. వారు వినాలనుకున్నది ఇది కాదు. కెమెరా వారి ముఖాలపైనే నిలుస్తుంది."},"S-127":{"t":"అవమానకరమైన పొత్తు","sum":"గర్వంతో, నిస్సహాయతతో ఉన్న దేవతలు బలి వద్దకు, అసురుల వద్దకు వెళ్లి కలిసి సముద్రాన్ని మథించాలని ప్రతిపాదిస్తారు. ఇరువర్గాలూ తమ తమ ఉద్దేశాలను దాచుకుంటాయి: దేవతలు అమృతం తమకే కావాలనుకుంటారు, అసురులు సమాన వాటా ఆశిస్తారు.","why":"నిలవలేని శత్రువుల ఒప్పందం; “లాక్కోవడం అంటే నిలబెట్టుకోవడం కాదు” అనే ఇతివృత్తానికి బీజం వేస్తుంది.","turn":"ఇంద్రుడు సహాయం అడగడానికి బలికి వంగి నమస్కరిస్తాడు.","story":"ఇంద్రుడు శాంతి పతాకంతో బలి వద్దకు వెళ్తాడు. రెండు సభలు తటస్థ ప్రదేశంలో కలుస్తాయి. ఇరువర్గాలూ ఒకరి చేతులను ఒకరు గమనిస్తారు. తాను చెప్పాలనుకోని మాటను ఇంద్రుడు చెబుతాడు: వారికి ఒకరి అవసరం ఒకరికి ఉంది. బలి వింటాడు. దేవతలు ఏం కోరుతున్నారో ఆయనకు సరిగ్గా తెలుసు, అయినా తన వాటాను తీసుకోవాలనే అనుకుంటాడు. ఒక పాత్ర అందరి చేతుల్లో తిరుగుతుంది. ఎవరూ తాగరు. ఇరువర్గాలూ ఒప్పుకుంటాయి, తాము అవతలి వారిని మోసం చేశామని ప్రతి వర్గం నమ్ముతుంది."},"S-686":{"t":"పర్వతం మునుగుతుంది; కూర్మం పైకెత్తుతుంది","sum":"మందర పర్వతాన్ని తీరానికి తెచ్చి కవ్వంగా వాడతారు. అది మునిగిపోతుంది. రెండు సైన్యాలు నీటి వైపు చూస్తూ నిలుస్తాయి. పర్వతం మళ్లీ పైకి లేస్తుంది, దాని కింద ఒక భారీ వంపు తిరిగిన వీపు మాత్రమే ప్రేక్షకులకు కనిపిస్తుంది: కూర్మం, తాబేలు.","why":"కనబడని ఆధారానికి చిత్రంలోని స్పష్టమైన ప్రతిరూపం: భగవంతుడు అన్నింటి కింద భూభాగంగా ఉండడం.","turn":"పర్వతం కింద ఏదో పైకి వస్తుంది.","story":"పర్వతాన్ని తీరానికి తెచ్చి, కవ్వంగా సముద్రంలో నిలువుగా నిలబెడతారు. అది మునగడం మొదలవుతుంది. తాడు కిందికి లాగుతున్న కొద్దీ, రెండు సైన్యాలు నిశ్చేష్టంగా చూస్తూ ఉంటాయి. చాలాసేపు నీరు తప్ప మరేమీ ఉండదు. తరువాత, దాని కింద ఉన్న ఒక పెద్ద వంపు తిరిగిన దానిపై అది నెమ్మదిగా పైకి లేస్తుంది. చిప్పలా, గాడులుగా, తడిగా ఉన్న ఒక వీపు పర్వతాన్ని పైకెత్తుతుంది. ఎవరూ మాట్లాడరు. సైన్యాలు తాడును మళ్లీ అందుకుంటాయి."},"S-499":{"t":"మహా మథనం","sum":"వాసుకి తోక వైపు దేవతలు, తల వైపు అసురులు పట్టుకుంటారు. వంతుల వారీగా లాగుతారు; పర్వతం గిరగిర తిరుగుతుంది, సముద్రం కల్లోలమవుతుంది, సర్పం అగ్నిని, పొగను వదులుతుంది. చేతులకు బొబ్బలు వస్తాయి, బలం తగ్గుతుంది, కనిపించని ఏదో ఇరువర్గాలకూ శక్తినిస్తుంది.","why":"సహనమే కార్యం; పురాణం యొక్క సుదీర్ఘ మధ్య భాగం; పంచుకున్న శ్రమ, కానీ దాని ఫలం పంచుకోబడదు.","turn":"ఎవరికీ కనపడని చెయ్యి ఎత్తినట్లు పర్వతం తిరుగుతూనే ఉంటుంది.","story":"దేవతలు తోకను, అసురులు తలను పట్టుకుంటారు. వంతుల వారీగా లాగుతారు. భగవంతుని వీపుపై పర్వతం తిరుగుతుంది, దాంతో పాటు సముద్రమూ తిరుగుతుంది. సర్పం పొగ కక్కుతుంది. చేతులకు బొబ్బలెక్కుతాయి, వీపులు వంగుతాయి, పళ్లు బిగుసుకుంటాయి. ఒక లయ ఏర్పడుతుంది: లాగడం, వదలడం, లాగడం. ప్రతి శ్రమా కనిపిస్తుంది, కానీ పర్వతం పడిపోకుండా ఏది ఆపుతోందో ఎవరికీ కనిపించదు. అమృతపు తెల్లని నురగ ఒక చుక్క పైకి వస్తుంది, తరువాత మరొకటి, సముద్రం మబ్బుగా మారడం మొదలవుతుంది. ఇరువర్గాలూ అలసిపోతాయి. ఎవరూ వదలరు."},"S-999":{"t":"హాలాహలం పైకి వస్తుంది","sum":"మథనం హాలాహల విషాన్ని పైకి తెస్తుంది. అది నల్లని పొగలా నీటిపై వ్యాపిస్తుంది. ప్రాణులు భయంతో పారిపోతాయి; చేపలు చనిపోతాయి; తీరంలోని జాలరి పిల్ల నీటి నుంచి వెనక్కి తగ్గుతుంది. బ్రహ్మ, దేవతలు శివుని పిలుస్తారు.","why":"ఫలానికి ముందు మూల్యం వస్తుంది: కానుకకు ముందే విషం.","turn":"ఒకే ఒక జాలరి పిల్ల నీటి అంచున అలాగే నిలిచి ఉంటుంది.","story":"మథనం అమృతం కాని ఏదో ఒకదాన్ని పైకి తెస్తుంది. పాలవంటి తెల్లని నీటిపై ఒక నల్లని మరక వ్యాపిస్తుంది. అది మనిషి పరుగెత్తగలిగే వేగం కన్నా వేగంగా కదులుతుంది. చేపలు తెల్లబడి తేలుతాయి. దేవతలు, అసురులు తాడును వదిలి తీరం వెంట పారిపోతారు. నీటి అంచున ఒక జాలరి పిల్ల తాను ఉన్న చోటే నిలిచి, ఆ చీకటి వైపు ఒక చేతిని చాపుతుంది. బ్రహ్మ శివుని పిలుస్తాడు. మరెవరూ దాని వైపు కదలరు."},"S-761":{"t":"శివుడు విషాన్ని తాగుతాడు","sum":"శివుడు విషం వైపు నడిచి, దాన్ని దోసిలిలో పట్టి తాగుతాడు. పార్వతి చెయ్యి ఆయన కంఠాన్ని అక్కడే పట్టి ఆపుతుంది, ఆయన కంఠం నీలమవుతుంది. దేవతలు, అసురులు మౌనంగా నిలుస్తారు. మథనం మళ్లీ మొదలవుతుంది.","why":"తనలో ఇముడ్చుకోవడం అనే మొదటి మహా కార్యం: అందరూ బతకడానికి ఒక్కరు హానిలోకి నడుస్తారు. తరువాత కృష్ణుడు, రుక్మిణి చేసే కార్యాలకు ప్రతిబింబం.","turn":"పార్వతి చెయ్యి ఆయన కంఠాన్ని బిగిస్తుంది.","story":"అందరూ దాని నుంచి పారిపోతుంటే శివుడు విషం వైపు నడుస్తాడు. ఆయన మోకరిల్లి, ఒక చేత్తో దోసిలి పట్టి దాన్ని ఎత్తుతాడు. తాగుతాడు. పార్వతి చెయ్యి ఆయన కంఠం వద్దకు లేచి, పట్టుకుని ఉంటుంది. అక్కడి చర్మం నీలమవుతుంది. చాలాసేపు మరేదీ కదలదు. తరువాత నీరు కొద్దికొద్దిగా తేటపడడం మొదలవుతుంది. జాలరి పిల్ల అది చూస్తుంది. ఆమె వెనుక ఎవరో మళ్లీ తాడును లాగడం మొదలుపెడతారు."},"S-938":{"t":"సంపదలు పైకి వస్తాయి","sum":"విషం నిలువరించబడ్డాక సంపదలు పైకి వస్తాయి: కామధేనువు సురభి, గుర్రం ఉచ్చైఃశ్రవం, ఏనుగు ఐరావతం, కౌస్తుభ మణి, పారిజాత వృక్షం, అప్సరసలు. ప్రతి ఒక్కటీ ఎవరో ఒకరు తీసుకుంటారు. మణి భగవంతునికి చేరుతుంది, ఆ చెయ్యి ఎవరికీ కనిపించకపోయినా.","why":"అద్భుతం, అత్యాశ కలిసిన దృశ్యం; ప్రతి దావా ఆ దావా చేసినవారు ఎలాంటివారో చూపిస్తుంది. పారిజాత వృక్షానికి బీజం వేస్తుంది.","turn":"మణిని కనిపించని చెయ్యి తీసుకుంటుంది, ఎవరూ అభ్యంతరం చెప్పరు.","story":"విషాన్ని నిలువరించాక సముద్రం కానుకలు ఇస్తుంది. ఒక ఆవు పైకి వస్తుంది, తరువాత తెల్ల గుర్రం, తరువాత ఐరావతం లాంటి ఏనుగు, తరువాత సూర్యకాంతిని పట్టే మణి. పూలు అప్పటికే విరిసిన ఒక చెట్టు పైకి వస్తుంది. నురగ నుంచి అప్సరసలు అడుగు పెడతారు. దేవతలు, అసురులు వాటిని తమవిగా చేసుకుంటారు. ఫ్రేమ్ అంచున ఉన్న ఒక చెయ్యి మణిని తీసుకుంటుంది, ఎవరూ అభ్యంతరం చెప్పరు. అది ఎవరి చెయ్యో ఎవరూ ప్రస్తావించరు."},"S-337":{"t":"లక్ష్మి ఎంచుకుంటుంది","sum":"లక్ష్మి చేతిలో పూలమాలతో సముద్రం నుంచి ఉద్భవిస్తుంది. దేవతలు, మునులు, అసురులు ఎదురు చూస్తారు; తమనే ఎంచుకుంటుందని ప్రతి ఒక్కరికీ నమ్మకం. ఆమె ప్రతి ఒక్కరినీ చూసి దాటి వెళ్తుంది. చివరికి ముందుకు అడుగు వేయని వ్యక్తి వద్దకు నడిచి, మాలను ఆయనకు వేస్తుంది; ఆయన ఆమెను శాశ్వతంగా తన హృదయానికి హత్తుకుంటాడు. అసురులు ఖాళీ చేతులతో మిగులుతారు.","why":"రుక్మిణి ఎంపికకు పౌరాణిక ప్రతిబింబం; ఇతివృత్తం ఒకే చిత్రంలో: ఆమె ఎంచుకుంటుంది, ఆమెను ఎవరూ తీసుకుపోరు.","turn":"ఆమె ప్రతి అభ్యర్థినీ దాటి, అడగని వ్యక్తి వద్దకు వెళ్తుంది.","story":"లక్ష్మి చేతుల్లో మాలతో సముద్రం నుంచి లేస్తుంది. దేవతలు, అసురులు ఒక పొడవైన అర్ధచంద్రాకారంలో నిలుస్తారు, అది తానే అవుతాడని ప్రతి ఒక్కరికీ ఖచ్చితమైన నమ్మకం. ఆమె వరుస వెంట నడుస్తుంది. ప్రతి ముఖాన్ని ఒక్క క్షణం చూసి ముందుకు సాగుతుంది. బలవంతులను, గర్విష్టులను, అందగాళ్లను దాటి వెళ్తుంది. వరుస చివర, ముందుకు అడుగు వేయని వ్యక్తి ఎదుట ఆమె ఆగి, మాలను ఆయనకు వేస్తుంది. దృశ్యం ఒక భుజంపై మాల సర్దుకోవడం మాత్రమే కనిపించేలా కత్తిరించబడుతుంది. ఆమె వెనుక, వరుస నిశ్శబ్దమవుతుంది."},"S-756":{"t":"తిరస్కరించబడిన అసురులు","sum":"లక్ష్మి దాటి వెళ్లిన చోటే అసురులు నిలబడి ఉంటారు. బలి, అతని సేనానులు తిరస్కారాన్ని అనుభవిస్తారు. మద్యదేవత వారుణి సముద్రం నుంచి పైకి వస్తుంది, విష్ణువు ఓదార్పుగా ఆమెను అసురులకు ఇస్తాడు. వారు స్వీకరిస్తారు.","why":"తిరస్కరించబడిన వర్గాన్ని మనుషులుగా చూపిస్తుంది; పొత్తును విరిచే ఆగ్రహానికి పునాది వేస్తుంది.","turn":"వారు వారుణిని తీసుకుని కోపాన్ని మింగేస్తారు.","story":"లక్ష్మి దాటి వెళ్లిన చోటే అసురులు నిలబడి ఉంటారు. బలి, అతని సేనానులు ముఖాలను నిశ్చలంగా ఉంచుకుంటారు. వరుస కదులుతుంది, ఎవరో నవ్వుతారు. మద్యదేవత సముద్రం నుంచి లేస్తుంది, భగవంతుని అనుమతి తెర వెనుక నుంచి వస్తుంది. అసురులు ఆమెను స్వీకరిస్తారు. పాత్రను అందుకుని తమ కోపాన్ని మింగేస్తారు. తాము ఏం పోగొట్టుకున్నారో వారికి సరిగ్గా తెలుసు."},"S-444":{"t":"ధన్వంతరి, కుండను లాక్కోవడం","sum":"ధన్వంతరి అమృత కలశంతో సముద్రం నుంచి పైకి వస్తాడు. అసురులు ఒక్కసారిగా దాన్ని లాక్కుంటారు. ముందు ఎవరు తాగాలి అని వారిలో వారే పోట్లాడుకోవడం మొదలుపెడతారు.","why":"బహుమతి చేతికి రాగానే విజేతలు ఒకరిపై ఒకరు తిరగబడతారు, అత్యాశ: “లాక్కోవడం అంటే నిలబెట్టుకోవడం కాదు.”","turn":"కుండ చేతులు మారుతుంది, వలయం విరిగిపోతుంది.","story":"ధన్వంతరి ఒక కుండను పట్టుకుని నీటి నుంచి పైకి వస్తాడు, ఆయన ఒక్క మాట అనకముందే అసురులు దాని వైపు దూసుకెళ్తారు. పిడికిళ్లు పిడులను పట్టుకుంటాయి. కుండ ఒకరి నుంచి ఒకరికి చేతులు మారుతుంది. తానే ముందు చూశానని ఎవరో అరుస్తారు. మరొకరు దెబ్బతో బదులిస్తారు. మథనమంతా నిలిచిన వలయం విరిగిపోతుంది. దేవతలు అంచు నుంచి కదలకుండా చూస్తూ ఉంటారు."},"S-722":{"t":"మోహిని మోసం","sum":"ఒక అందమైన స్త్రీ ప్రత్యక్షమవుతుంది. పరవశులైన అసురులు అమృతాన్ని పంచమని ఆమెను కోరతారు. ఆమె రెండు వర్గాలను వేరు చేసి ముందుగా దేవతలకు వడ్డిస్తుంది. అసురులు చాలా ఆలస్యంగా గ్రహిస్తారు.","why":"దొంగతనం కథకు దగ్గరగా ఉన్న మోసపు సన్నివేశం; నైతిక బూడిదరంగు: సరైన పక్షానికి ఒక ఉపాయం ద్వారా సేవ జరుగుతుంది.","turn":"గరిటె దేవతల వైపు వెళ్తుంది.","story":"ఒక స్త్రీ సభలోకి నడిచి వస్తుంది, అసురులు తాము దేని గురించి వాదిస్తున్నారో మరచిపోతారు. అమృతాన్ని న్యాయంగా పంచమని వారు ఆమెను అడుగుతారు. ఆమె చిరునవ్వు నవ్వి, రెండు వర్గాలను రెండు వరుసలుగా వేరు చేసి వడ్డించడం మొదలుపెడుతుంది. మొదటి గరిటె దేవతలకు. తరువాత రెండోది. కుండ దాదాపు ఖాళీ అయిందని అసురులు గ్రహించే వరకూ ఇంకా ఆమె ముఖాన్నే చూస్తూ ఉంటారు."},"S-653":{"t":"రాహువు బయటపడతాడు","sum":"రాహువు దేవతలా మారువేషం వేసుకుని తాగడానికి వరుసలో కూర్చుంటాడు. సూర్యచంద్రులు అతన్ని గుర్తించి కేకలు వేస్తారు. సుదర్శన చక్రం మెరుస్తుంది; అతని తల తెగిపోతుంది, కానీ అమృతం తాకినందువల్ల అది బతికే ఉంటుంది.","why":"ద్రోహి, వెలుపల ఉండడానికి నిరాకరణ, బతికి ఉన్న తల. ఒక చిన్న, పదునైన తలకిందులు.","turn":"సూర్యచంద్రులు చూపిస్తారు.","story":"దేవతల వరుసలో ఒక ముఖం సరిగ్గా లేదు. సూర్యచంద్రులు దాన్ని మొదట చూస్తారు. వారు చూపిస్తూ కేకలు వేస్తారు. వరుసను ఒక కాంతి రేఖ దాటి వెళ్తుంది. నకిలీ దేవుని తల శరీరాన్ని వీడుతుంది, కానీ తల చనిపోదు. అది దొర్లుతుంది, కళ్లు కొడుతుంది, వారిని చూస్తూనే ఉంటుంది. దాని వెనుక శరీరం కూలుతుంది. అమృతం అప్పటికే గొంతు వరకు చేరింది."},"S-658":{"t":"దేవాసుర యుద్ధం","sum":"పొత్తు కూలిపోతుంది; అసురులు దాడి చేస్తారు. బలి మాయలతో వారిని నడిపిస్తాడు; ఇంద్రుడు వజ్రాయుధంతో దేవతలను నడిపిస్తాడు. ఆయుధాలు, మాయలు యుద్ధభూమిని నింపుతాయి. దేవతలు యుద్ధాన్ని తిప్పి స్వర్గాన్ని తిరిగి పొందుతారు.","why":"విశ్వస్థాయి యాక్షన్ ఘట్టం; శత్రువుల ఒప్పందం యొక్క మూల్యాన్ని చూపిస్తుంది; స్వర్గాన్ని తిరిగి ఇస్తుంది.","turn":"వజ్రాయుధం యుద్ధభూమిని మలుపు తిప్పుతుంది.","story":"పొత్తు ముగుస్తుంది. అసురులు మొదట మాయలతో దెబ్బ కొడతారు: అగ్ని కాని అగ్ని, కొడితే మాయమయ్యే సైన్యాలు. బలి ముందు వరుసలో నడిపిస్తాడు. ఇంద్రుడు వజ్రాయుధంతో బదులిస్తాడు, యుద్ధభూమి మెరుస్తుంది. కాసేపు దేవతలు నేల కోల్పోతారు. తరువాత అమృత బలం పట్టుకుంటుంది, వారు వేసే ప్రతి దెబ్బా నిజమవుతుంది. వరుస మలుపు తిరుగుతుంది. యుద్ధభూమి అంతటా జెండా జెండాగా రంగు తిరిగి వస్తుంది. దేవతలు స్వర్గానికి తిరిగి వెళ్తారు, దానికి మళ్లీ వెలుగు వచ్చింది."},"S-765":{"t":"మోహిని ముందు శివుడు","sum":"మోహిని గురించి విన్న శివుడు ఆమెను చూడాలని కోరతాడు. ఆమె అడవిలో ప్రత్యక్షమవుతుంది; ఆయన విభ్రాంతి చెంది వెంటపడతాడు, తరువాత ఆ రూపం వెనుక ఉన్న శక్తిని గుర్తించి విముక్తి పొందుతాడు.","why":"జ్ఞానులు కూడా అద్భుతానికి లోనవుతారు; విభ్రాంతి తరువాత గుర్తింపు; చిత్రంలో వెల్లడయ్యే రహస్యానికి ఐచ్ఛిక ప్రతిధ్వని.","turn":"ఆ రూపం వెనుక ఉన్న శక్తిని ఆయన గుర్తిస్తాడు.","story":"అసురులను మోసం చేసిన ఆ రూపం గురించి శివుడు విని, దాన్ని చూడాలని కోరతాడు. మోహిని ఒక అడవిలో ప్రత్యక్షమవుతుంది, ఆమె కోసం ఆగిపోయినట్లు కనిపించే కాంతిలో. ఆయన చూస్తాడు, దేవతలలో అత్యంత జ్ఞాని ఆలోచించడం మానేస్తాడు. చెట్ల మధ్య ఆమె వెంట నడుస్తాడు. ఆమె నవ్వుతూ పరుగెడుతుంది, ఆయన వెంట పరుగెడతాడు. చివరికి ఇది ఎవరి శక్తో ఆయనకు అర్థమవుతుంది. ఆగి, గుర్తించి, విముక్తి పొందుతాడు. చాలాసేపు నిశ్చలంగా నిలబడి, తరువాత ఆయన కూడా నవ్వుతాడు."},"S-490":{"t":"తీరంలో జాలరి కుటుంబం","sum":"ఒక జాలరి కుటుంబం నీటి పక్కనే బతుకుతుంది. విషాన్ని నిలువరించాక, ఒక పిల్ల సముద్రంలో చెయ్యి ముంచి శుభ్రంగా బయటకు తీస్తుంది. తరువాత ఒక వల వెండి చేపలతో నిండి వస్తుంది. కారణం ఆ కుటుంబానికి తెలియదు; ఫలితంతోనే వారు బతుకుతారు.","why":"మొదటి ఘట్టానికి లోక క్షేమ రుజువు; కారణం తెలియకుండానే మేలు పొందే సామాన్యురాలు.","turn":"పిల్ల చెయ్యి శుభ్రంగా బయటకు వస్తుంది.","story":"తీరంలో ఒక జాలరి కుటుంబం వలలు సరిచేస్తూ ఉంది. కొన్ని రోజులుగా సముద్రం వింతగా ఉంది. ఒక పిల్ల నీటి అంచున మోకరిల్లి చెయ్యి ముంచుతుంది. దాన్ని బయటకు తీసి చూస్తుంది: అది శుభ్రంగా ఉంది. ఆమె తన తల్లికి ఆ చేతిని చూపిస్తుంది. తరువాత సంధ్యవేళ, వల వెండిలా మెరిసే చేపలతో నిండి వస్తుంది. కారణం ఆ కుటుంబానికి తెలియదు. తాము బతికే ఉన్నారని, నీరు మళ్లీ తమదైందని మాత్రం తెలుసు."},"S-788":{"t":"అంబికా ఆలయంలో కుడ్యచిత్రం","sum":"ఒక పిల్ల, లేదా పెళ్లికి కొన్ని రోజుల ముందు రుక్మిణి, అంబికా ఆలయంలో చిత్రించిన గోడను పరిశీలిస్తుంది. ఫలకాలు మథనాన్ని చూపుతాయి: పర్వతం, సర్పం, విషం, శివుని కంఠం వద్ద దేవి చెయ్యి, లక్ష్మి ఎంచుకోవడం. ఒక ప్రశ్నకు పూజారి బదులిస్తాడు. లక్ష్మి ఎంచుకునే ఫలకం వద్ద రుక్మిణి ఆగిపోతుంది.","why":"మథనాన్ని రుక్మిణి ప్రపంచంలోకి తెస్తుంది; ఆమె తరువాత ప్రార్థించే ఆలయానికి బీజం వేస్తుంది.","turn":"ఎంపిక ఫలకం వద్ద ఆమె ఆగిపోతుంది.","story":"అంబికా ఆలయంలో రుక్మిణి ఒక చిత్రించిన గోడ ముందు ఆగుతుంది. ఒక పూజారి ఊడుస్తున్నాడు. ఫలకాల్లో పర్వతం, సర్పం, నల్లని వరద, ఒక దేవుని కంఠం వద్ద దేవి చెయ్యి, పెళ్లికొడుకుల వరుస వెంట నడుస్తున్న మాల పట్టుకున్న దేవి ఉన్నాయి. దేవి ఎవరిని ఎంచుకుందో రుక్మిణి అడుగుతుంది. పూజారి చెబుతాడు. చివరి ఫలకం వద్ద ఆమె చాలాసేపు నిలిచి, వరుస చివర ఉన్న చిత్రరూపాన్ని ఒక వేలితో తాకుతుంది."},"S-392":{"t":"పెళ్లి ముందు రోజు సూతుని గానం (వాహిక)","sum":"పెళ్లికి ముందు రాజభవనంలోని కళాకారుల్లో ఒక బంటు కవి, తాము అసురులేనని గ్రహించని రాజుల సభకు మథనాన్ని గానం చేస్తాడు. అంతఃపుర గ్యాలరీ అంచున ఉన్న రుక్మిణి, ప్రతి అభ్యర్థినీ దాటి వెళ్లిన దేవి భాగాన్ని వింటుంది.","why":"మథనాన్ని రాజులకు, రుక్మిణికి ఒకేసారి అందిస్తుంది; రాజులు చూడలేని వ్యంగ్యాన్ని ప్రేక్షకులు చూస్తారు.","turn":"ఆ రాజులు అసురులేనని రుక్మిణి గ్రహిస్తుంది.","story":"పెళ్లికి ముందు రోజు రాత్రి, సభలో ఒక బంటు కవి పాడుతాడు. రాజులు తింటూ తాగుతూ సగం వింటూ ఉన్నారు. అతను మథనాన్ని పాడతాడు: వైభవం కోల్పోయిన దేవతలు, శత్రువులైన మిత్రులు, విషం, మాల పట్టుకున్న దేవి. అభ్యర్థుల వరుస గురించి, ఆమె ఎంచుకున్న ఒక్కరి గురించి పాడతాడు. అది దేవతల గురించి అనుకుని రాజులు చప్పట్లు కొడతారు. పైన గ్యాలరీలో ఉన్న రుక్మిణి వారిని చూసి అసురులను చూస్తుంది."},"S-919":{"t":"భారం కవాతు","sum":"గర్విష్ఠులైన రాజుల సైన్యాలు పొలాల మీదుగా, గ్రామాల మీదుగా కవాతు చేస్తాయి. పంటలు నలిగిపోతాయి, బావులు కలుషితమవుతాయి, పశువులను తీసుకుపోతారు. ఒక సైన్యపు నీడ బరువు కింద ఒక ఆవు తడబడి మోకాళ్లపై కూలుతుంది.","why":"చిత్రంలో బాధ యొక్క మొదటి దృశ్యాన్ని, ఈ కథకు ఒక రక్షకుడు ఎందుకు కావాలో ఆ కారణాన్ని ఇస్తుంది.","turn":"ఆవు కూలిపోతుంది.","story":"గర్విష్ఠులైన రాజుల సైన్యాలు ఒక దేశాన్ని దాటుతాయి. రథాలు యవల పంటను చదును చేస్తాయి, సైనికులు స్త్రీల విసుర్రాళ్లను కూడా లాక్కెళ్తారు. బావులు కలుషితమవుతాయి, ధాన్యాగారాలు ఖాళీ అవుతాయి, ఊరి తర్వాత ఊరు తమ గుమ్మాల నుంచి చూస్తూ ఉంటుంది. ఆ బరువు కింద ఎక్కడో ఒక ఆవు తడబడి మోకాళ్లపై కూలుతుంది. కవాతు చేసే వరుస అడుగు తప్పదు. అది ఆమెను చుట్టి వెళ్తుంది."},"S-687":{"t":"భూదేవి బ్రహ్మ వద్దకు వెళ్తుంది","sum":"భూదేవి కన్నీరు కారుస్తున్న ఆవు రూపంలో బ్రహ్మ వద్దకు వచ్చి తన బాధను చెప్పుకుంటుంది: గర్విష్ఠులైన రాజులు మరీ ఎక్కువయ్యారు, బరువు మరీ ఎక్కువైంది.","why":"మొత్తం సంఘటనల వరుసను ప్రేరేపించే విన్నపం; సహాయం కోసం రోదిస్తున్న లోకం.","turn":"బ్రహ్మ ఆమెను భగవంతుని వద్దకు తీసుకెళ్లడానికి లేస్తాడు.","story":"భూదేవి ఆవు రూపంలో ఏడుస్తూ బ్రహ్మ వద్దకు వస్తుంది. ఆమె అంతా ఒకేసారి చెప్పలేదు. రాజులు చాలామంది, చాలా గర్విష్ఠులు, చాలా బరువైనవారు. బ్రహ్మ ఆమె తలపై చెయ్యి ఉంచుతాడు. ఆమె తల ఎత్తి చూస్తుంది. ఆయన లేస్తాడు, దారి చూపమని ఎవరూ అడగనవసరం లేదు."},"S-509":{"t":"తీరం, స్తోత్రం","sum":"బ్రహ్మ, శివుడు, దేవతలు భూదేవిని అదే క్షీరసాగర తీరానికి తీసుకెళ్లి, పురుషసూక్తంతో విష్ణువును ఆరాధిస్తారు. నీరు నిశ్చలంగా ఉంటుంది. బ్రహ్మ సమాధిలోకి వెళ్తాడు.","why":"మథనంతో ప్రతిధ్వనిస్తుంది; ఈ చిత్రంలో విన్నపాల స్థలం తీరమే.","turn":"బ్రహ్మ సమాధి మొదలవుతుంది.","story":"బ్రహ్మ, శివుడు, దేవతలు, భూదేవి క్షీరసాగర తీరానికి వస్తారు. సముద్రం చదునుగా, తెల్లగా, నిశ్శబ్దంగా ఉంటుంది. వారు భగవంతుని స్తోత్రం మొదలుపెడతారు. అది పైకి లేస్తుంది, పెరుగుతుంది, తరువాత శూన్యంలోకి మసకబారుతుంది. బ్రహ్మ కళ్లు మూసుకుంటాయి. ఆయన కదలడు. నీళ్లు ఊపిరి బిగబట్టుకుంటాయి."},"S-561":{"t":"ఆకాశవాణి","sum":"సమాధిలో బ్రహ్మకు ఆకాశం నుంచి ఒక స్వరం వినిపిస్తుంది. ఆయన దాన్ని చెబుతాడు: భూదేవి బాధ భగవంతునికి ముందే తెలుసు. దేవతలు యదు వంశంలో జన్మించాలి; ఆయన వసుదేవుని కుమారుడిగా వచ్చి తన కాల శక్తితో భూభారాన్ని తగ్గిస్తాడు.","why":"చిత్రం యొక్క వాగ్దానం: మనిషి రాకముందే సమాధానం వస్తుంది. కనబడని ఆధారం అనే వ్యాకరణానికి అత్యంత స్పష్టమైన ఉదాహరణ.","turn":"బ్రహ్మ కళ్లు తెరిచి ఆ స్వరాన్ని పునరావృతం చేస్తాడు.","story":"సమాధిలో బ్రహ్మకు ఆకాశం నుంచి ఒక స్వరం వినిపిస్తుంది. ఆయన నెమ్మదిగా కళ్లు తెరిచి, ఇప్పుడే కంఠస్థం చేసినదాన్ని చెబుతున్నట్లు మాట్లాడతాడు. భూదేవి బాధ భగవంతునికి ముందే తెలుసు. దేవతలు యదు వంశంలో జన్మించాలి. ఆయన స్వయంగా వసుదేవుని కుమారుడిగా ప్రత్యక్షమై, తన కాల శక్తి ద్వారా భూభారాన్ని తగ్గిస్తాడు. దేవతలు పైకి చూస్తారు. చూడటానికి ఏమీ లేదు, అయినా వారు నమస్కరిస్తారు."},"S-269":{"t":"జన్మల నియామకం","sum":"బ్రహ్మ దేవతలకు చెబుతాడు: యదువుల్లో జన్మించండి; భగవంతుడు వసుదేవుని కుమారుడవుతాడు; అనంతుడు మొదట ఆయన అన్నగా వస్తాడు; యోగమాయ ఆయన పనిని నెరవేర్చడానికి ప్రత్యక్షమవుతుంది. దేవతల భార్యలు ఆయనతో ఉండడానికి జన్మిస్తారు.","why":"పాత్రలను ఏర్పరుస్తుంది: బలరాముడు (అనంతుడు), కనిపించని హస్తం (యోగమాయ).","turn":"ప్రతి దేవుడు తన నియామకాన్ని స్వీకరించడానికి వంగి నమస్కరిస్తాడు.","story":"ఇది ఎలా జరుగుతుందో బ్రహ్మ దేవతలకు చెబుతాడు. వారు యదు వంశంలో జన్మిస్తారు. అనంతుడు మొదట అన్నగా వస్తాడు. భగవంతుని మాయాశక్తి ఆయన పనిని నెరవేరుస్తుంది. దేవతల భార్యలు ఆయనతో ఉండడానికి జన్మిస్తారు. ఒక్కొక్క దేవుడు తన నియామకాన్ని స్వీకరించడానికి వంగుతాడు. ఈ దృశ్యం నిశ్శబ్దంగా, దాదాపు పరిపాలనా తరహాలో ఉంటుంది. ఒక వాగ్దానం దస్త్రంలో చేర్చబడుతున్నట్లు అనిపిస్తుంది."},"S-981":{"t":"మథుర యదు రాజధాని అవుతుంది","sum":"బ్రహ్మ తన నివాసానికి తిరిగి వెళ్తాడు. శూరసేనుడు మథుర నుంచి పాలిస్తాడు, అది యదువుల రాజధాని అవుతుంది. వేదిక సిద్ధమవుతుంది.","why":"మూడవ ఘట్టానికి వంతెన; ముట్టడి చేయబడే నగరాన్ని ఏర్పరుస్తుంది.","turn":"నగరపు నిశ్శబ్దం కింద ఎక్కడో దూరంగా ఒక డప్పు మోగుతుంది.","story":"బ్రహ్మ ఇంటికి వెళ్తాడు. మథురలో శూరసేనుడు ప్రశాంతమైన సభ నుంచి పాలిస్తాడు. నగరం తన రోజును గడుపుతుంది: బండ్లు, నీళ్లు, ఒక గంట. ఆ నిశ్శబ్దం లోపల ఎక్కడో ఒక డప్పు మోగుతుంది. ఏదో రాబోతోందని ప్రేక్షకులకు ఇప్పుడే చెప్పబడింది, అది రాబోయేది ఈ స్థలానికే."},"S-427":{"t":"రైతు, అతని ఆవు","sum":"ఒక రైతు, అతని ఆవు సైన్యాలు వాడే దారి పక్కన ఒక పొలం దున్నుతారు. ఒక చిత్రంలో నేల తొక్కబడి ఉంటుంది; చివరి చిత్రంలో ఆవు సాలులో పడుకుంటుంది, నాగలి శుభ్రమైన మట్టిని తిప్పుతుంది.","why":"రెండవ ఘట్టానికి లోక క్షేమ రుజువు; భారం నేల స్థాయిలో తొలగిపోవడం.","turn":"ఆవు సాలులో పడుకుంటుంది.","story":"ఒక రైతు, అతని ఆవు సైన్యాలు వాడే దారి పక్కన ఒక కాడి దున్నుతారు. మొదటి దృశ్యంలో నేల తొక్కబడి ఉంటుంది, ఆవు కుంటుతూ ఉంటుంది. కాలం గడుస్తుంది. చివరి దృశ్యంలో ఆవు సాలులో పడుకుని విశ్రాంతి తీసుకుంటుంది, నాగలి శుభ్రమైన మట్టిని తిప్పుతుంది. దారి ఎందుకు నిశ్శబ్దమైందో తెలియక రైతు పొలం అంచున కూర్చుంటాడు."},"S-206":{"t":"కదలని ఆవు (వాహిక)","sum":"ఒక సైన్యం వీధి గుండా వెళ్తుంది. ఒక ఆవు దారిలో ఆగి కదలదు. సైనికులు ఆమెను తిడతారు; ఒక ముసలావిడ ఏడ్చిన భూదేవి కథ చెబుతుంది. ఇంటికి వెళ్తున్న రుక్మిణి అది విని ఆగిపోతుంది.","why":"రెండవ ఘట్టాన్ని రుక్మిణి ప్రపంచంలోకి తెస్తుంది, ఆమె చూడగలిగే చిత్రం ద్వారా, వినగలిగే కథ ద్వారా.","turn":"రుక్మిణి నడవడం ఆపి వింటుంది.","story":"కుండిన వీధిలో సైనికుల వరుస వస్తుంది. ఒక ఆవు రోడ్డు మధ్యలో ఆగి కదలదు. సైనికులు ఆమెను తిట్టి తోస్తారు. ఇంటికి వెళ్తున్న రుక్మిణి నెమ్మదిస్తుంది. పక్కనున్న ఒక ముసలావిడ నెమ్మదిగా అంటుంది, “తెలుసా, ఆమె భూదేవి.” అని. ఏడుపు, ఆ స్వరం, ఆ వాగ్దానం ఆమె చెబుతుంది. సైనికులు ఆమెను చుట్టి వెళ్లిపోయిన చాలాసేపటి వరకూ రుక్మిణి నిశ్చలంగా నిలబడి ఉంటుంది."},"S-612":{"t":"“పుట్టకముందే కోరబడినవాడు” (వాహిక)","sum":"అతిథులు రాజభవనంలో కృష్ణుని స్తుతిస్తూ పాడతారు; అతని సౌందర్యంతో కాకుండా, అతను వచ్చిన కారణంతో ప్రారంభిస్తారు: భూదేవి ఏడ్చింది, ఒక స్వరం బదులిచ్చింది, ఒక బిడ్డ వాగ్దానం చేయబడ్డాడు. సభ అంచున రుక్మిణి వింటుంది.","why":"అతని గురించి మొదటి పాటలను స్తుతి నుంచి కారణం ఉన్న కథగా మారుస్తుంది; రెండవ ఘట్టం చిత్రంలోని మొదటి కృష్ణ ప్రస్తావనలో కలుస్తుంది.","turn":"ఒక అతిథి, భూదేవి అతని కోసం ఏడ్చిందని అంటాడు.","story":"అతిథులు రాజభవనంలో పాడతారు. మొదటివాడు కృష్ణుని ముఖంతో కాకుండా, అతను వచ్చిన కారణంతో మొదలుపెడతాడు. భూదేవి ఏడ్చింది, ఒక స్వరం బదులిచ్చింది, ఒక బిడ్డ వాగ్దానం చేయబడ్డాడు అంటాడు. తరువాతి గాయకుడు గోపాలురను జోడిస్తాడు, మూడవవాడు సౌందర్యాన్ని. సభ అంచున ఉన్న రుక్మిణి, ముగ్గురూ ఏడుపుతోనే మొదలుపెట్టారని గమనిస్తుంది. ఇంకా వినాలని నిర్ణయించుకుంటుంది."},"S-478":{"t":"వితంతువులు తిరిగి వస్తారు","sum":"కంసుని వితంతువులైన అస్తి, ప్రాప్తి తమ తండ్రి జరాసంధుని వద్దకు తిరిగి వచ్చి తమ భర్త ఎలా చనిపోయాడో చెబుతారు. అతని దుఃఖం ఆగ్రహంగా మారి, యాదవులను నాశనం చేయాలని నిర్ణయించుకుంటాడు.","why":"విరోధికి మానవ స్వభావం గల ఒక కారణాన్ని ఇస్తుంది; నష్టం నుంచి పుట్టిన ఆగ్రహం.","turn":"అతను లేచి సైన్యాన్ని పిలుస్తాడు.","story":"తెల్లని వస్త్రాల్లో ఇద్దరు వితంతువులు జరాసంధుని సభలోకి వచ్చి సింహాసనం ముందు నిలుస్తారు. వారు ఏడవరు. తమ భర్త కంసునికి ఏం జరిగిందో, ఎవరు చేశారో చెబుతారు. రాజు చాలా నిశ్చలంగా కూర్చుంటాడు. తరువాత అతని చెయ్యి సింహాసనపు చేతిపై బిగుసుకుంటుంది, సైన్యాన్ని పిలుస్తాడు. వాక్యం ముగియకముందే సభికులు కదులుతారు."},"S-610":{"t":"ద్వారం వద్ద ఇరవై మూడు అక్షౌహిణులు","sum":"ఇరవై మూడు అక్షౌహిణులు మథురను చుట్టుముడతాయి. గోడపై నీళ్లు మోసే వ్యక్తి ప్రతి దిక్కులోనూ గుడారాలు, జెండాలు, పొగ చూస్తాడు. మొదటి సుద్ద గుర్తు ఈ రోజునే వేయబడుతుంది.","why":"సామాన్యుని కంటితో స్థాయిని, భయాన్ని చూపిస్తుంది; ముట్టడి ఒక దృశ్య వాస్తవంగా.","turn":"సైన్యపు వరుస దిగంతం వరకూ మూసుకుంటుంది.","story":"సైన్యం దశలవారీగా వస్తుంది. మొదట ఒక దుమ్ము రేఖ, తరువాత గుడారాలు, తరువాత జెండాలు, తరువాత మంటల దేశం. మథుర గోడపై ఉన్న నీళ్లు మోసే వ్యక్తి తన బొక్కెనను కింద పెట్టి లెక్కపెట్టి, వదిలేస్తాడు. సాయంత్రానికి దిగంతమంతా నిండిపోతుంది. ఇంకేమీ చేయడానికి లేక, అతను గోడపై మొదటి సుద్ద గుర్తును వేస్తాడు."},"S-844":{"t":"అతన్ని విడిచిపెట్టాలనే నిర్ణయం","sum":"కృష్ణుడు పరిస్థితిని ఆలోచిస్తాడు. సైన్యాన్ని నాశనం చేసి జరాసంధుని బతికించాలి, అప్పుడు అతను మరిన్ని సైన్యాలను పోగు చేస్తాడు, భూభారం మరింతగా తన చేతికి వస్తుంది. ఆయన బలరామునికి సారాంశంగా ఇదే చెబుతాడు; బలరామునికి పూర్తిగా అర్థం కాదు.","why":"వ్యూహంగా కరుణ; కృష్ణుని పద్ధతికి చిత్రంలో అత్యంత స్పష్టమైన ప్రకటన; రెండవ ఘట్టంతో ముడిపడి ఉంది.","turn":"బలరాముడు ఒప్పుకోకపోయినా మౌనంగా కూర్చుంటాడు.","story":"ఒక మంత్రాంగ గదిలో కృష్ణుని స్వరం పథకాన్ని వివరిస్తుంది: సైన్యాన్ని విరగ్గొట్టండి, కానీ రాజును బతికించండి. జరాసంధుడు మరొకదాన్ని, మరొకదాన్ని సమకూరుస్తాడు, ప్రతి దానితో భూభారంలో మరింత భాగం అందుబాటులోకి వస్తుంది. బలరాముడు కఠినమైన ముఖంతో వింటాడు. గ్రామాలను కాల్చేవాడిని ఇంటికి నడిచి వెళ్లనివ్వడం ఎందుకో ఆయనకు అర్థం కాదు. ఒప్పుకోకుండానే కూర్చుంటాడు. దృశ్యం ఆయన మౌనంపై ముగుస్తుంది."},"S-972":{"t":"ఆకాశ రథాలు, శంఖం","sum":"సారథులు, ఆయుధాలతో కూడిన రెండు తేజోమయ రథాలు ఆకాశం నుంచి దిగుతాయి. కృష్ణుడు, బలరాముడు చిన్న బృందంతో బయలుదేరుతారు. శంఖం మోగుతుంది, ఏదీ కనిపించకముందే శత్రువులు వణుకుతారు.","why":"శుద్ధ ప్రభావం: చూపుకు ముందు శబ్దం; కనబడని వీరుని మొదటి దృశ్యవైభవం.","turn":"శంఖం మోగుతుంది, ముందు వరుస వెనక్కి తగ్గుతుంది.","story":"రెండు రథాలు వెలుగు స్తంభంలో ఆకాశం నుంచి దిగుతాయి. అవి మథుర వెలుపల మైదానంలో నిలుస్తాయి. ఇద్దరు మనుషులు వాటిలోకి ఎక్కుతారు. ద్వారం తెరుచుకుంటుంది, చిన్న బృందం బయలుదేరుతుంది. శంఖం పొడవుగా, స్పష్టంగా మోగుతుంది, మరేదీ జరగకముందే జరాసంధుని సైన్యపు ముందు వరుస వెనక్కి తగ్గుతుంది."},"S-907":{"t":"వెక్కిరింత, జవాబు","sum":"జరాసంధుడు కృష్ణుని బాలుడని ఎగతాళి చేసి, బలరాముని సవాలు చేస్తాడు. ఒక స్వరం బదులిస్తుంది: వీరులు గొప్పలు చెప్పుకోరు, చేతలతో చూపుతారు.","why":"శత్రువు తిరస్కారం ద్వారా కృష్ణుని చిత్రణ; ప్రేక్షకులు గౌరవంగా చదివే ప్రత్యర్థి అవమానం.","turn":"జవాబు ప్రశాంతంగా వచ్చి అతని నోరు మూయిస్తుంది.","story":"జరాసంధుడు ముందుకు స్వారీ చేసి మైదానం అంతటా వినిపించేలా పిలుస్తాడు. నాగలి వెనుక దాక్కునే పిల్లవాడిని ఎగతాళి చేసి, బలరామునికి నిజమైన పోరాటాన్ని ప్రతిపాదిస్తాడు. మైదానం మీదుగా ఒక నెమ్మది స్వరంతో జవాబు వస్తుంది: వీరులు గొప్పలు చెప్పుకోరు, చేతలు చేస్తారు. జరాసంధుడు నవ్వుతాడు, ఆ నవ్వు మధ్యలోనే ఆగిపోతుంది. అతని వెనుక మరెవరూ నవ్వడం లేదు."},"S-804":{"t":"గోడ నుంచి చూసిన యుద్ధం","sum":"శత్రువు రెండు రథాలను చుట్టుముడుతుంది. రథాలు శత్రువు వెనుక మాయమైనప్పుడు గోడపై ఉన్న స్త్రీలు చూసి మూర్ఛపోతారు. బాణాలు ఏనుగులను, గుర్రాలను, రథాలను నాశనం చేస్తాయి; నాగలి కాల్బలాన్ని ఊడ్చేస్తుంది. స్త్రీలు మేల్కొని మైదానంలో శత్రువు లేకపోవడం చూస్తారు.","why":"కృష్ణుని దృశ్యవైభవంగా కాక, ప్రభావంగా యుద్ధం: కెమెరా స్త్రీలపైనే ఉంటుంది.","turn":"వారు శుభ్రమైన మైదానానికి మేల్కొంటారు.","story":"శత్రువు రెండు రథాలను చుట్టుముడుతుంది. మథుర గోడపై స్త్రీలు, రథాలు దుమ్ము వెనుక, మనుషుల వెనుక మాయమవడం చూస్తారు. ఒక్కొక్కరుగా మూర్ఛపోతారు. మైదానంలో బాణాలు ఏనుగుల మీద, గుర్రాల మీద, రథాల మీద పడతాయి; నాగలి కాల్బలాన్ని పక్కకు ఊడ్చేస్తుంది. స్త్రీలు మేల్కొనేసరికి దుమ్ము పలుచబడుతూ ఉంటుంది, మైదానంలో శత్రువు లేదు. రథాలు ఎక్
