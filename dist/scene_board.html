<title>Scene Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a bin of unplaced scenes on the left, a horizontally scrolling board of sequences on the right; the board's left-to-right, top-to-bottom order is the story order. */
:root{
  --bg:#e9edf1; --panel:#f6f8fa; --card:#ffffff; --ink:#18212b; --mut:#566472; --line:#d0d8e0; --line2:#e1e7ec;
  --drama:#256a8c; --drama-bg:#dcecf4; --action:#bd3f24; --action-bg:#f8e1da; --focus:#18212b; --btn:#18212b; --btn-ink:#f6f8fa;
  --ok:#2c7a4b;
  --f-display:'Bricolage Grotesque','Noto Sans Telugu','Segoe UI',system-ui,sans-serif; --f-body:'IBM Plex Sans','Noto Sans Telugu','Segoe UI',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151b; --panel:#171e26; --card:#1e2731; --ink:#e5ebf1; --mut:#93a2b1; --line:#2d3945; --line2:#26313b;
  --drama:#7bbbdc; --drama-bg:#1b3442; --action:#f09273; --action-bg:#43241c; --focus:#e5ebf1; --btn:#e5ebf1; --btn-ink:#10151b; --ok:#6cc58d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --panel:#171e26; --card:#1e2731; --ink:#e5ebf1; --mut:#93a2b1; --line:#2d3945; --line2:#26313b;
  --drama:#7bbbdc; --drama-bg:#1b3442; --action:#f09273; --action-bg:#43241c; --focus:#e5ebf1; --btn:#e5ebf1; --btn-ink:#10151b; --ok:#6cc58d; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body.te .ttl,body.te .cname,body.te #drawer h3,body.te #drawer p,body.te .kv dd,body.te .tags span,body.te .cnote,body.te .boardtabs button,body.te .bname,body.te #bdesc{line-height:1.6;letter-spacing:0}
.langseg button{padding:5px 11px}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:10px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-weight:500}

/* header */
header{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end;justify-content:space-between}
h1{font:700 22px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12.5px;margin-top:3px}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end}
.stat{display:flex;flex-direction:column;min-width:0}
.stat b{font:600 17px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;font-weight:500}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.warn{border-color:var(--action);color:var(--action)}
#status{font-size:12px;color:var(--mut);min-width:0}
#status.ok{color:var(--ok)}

/* board tabs */
.boardtabs{display:flex;flex-wrap:wrap;gap:6px}
.boardtabs button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 11px;font-weight:500;max-width:30ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.boardtabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.boardtabs .plus{border-style:dashed;color:var(--mut);background:none}
.bname{flex:1;min-width:0;border:1px solid transparent;background:none;font:700 15px var(--f-display);padding:2px 5px;border-radius:5px;margin-left:-5px}
.bname:hover,.bname:focus{border-color:var(--line);background:var(--card)}

/* rhythm strip */
.rhythm{display:flex;align-items:center;gap:12px;min-width:0}
.rhythm .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);white-space:nowrap}
#strip{flex:1;display:flex;gap:2px;height:22px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px;overflow:hidden}
#strip i{display:block;border-radius:2px;min-width:3px;cursor:pointer}
#strip i.D{background:var(--drama)} #strip i.A{background:var(--action)}
#strip i.gap{background:none;min-width:8px;flex:0 0 8px;cursor:default;border-left:1px solid var(--line)}
#strip .none{font-size:12px;color:var(--mut);padding:0 6px;align-self:center}
.runs{font-size:12px;color:var(--mut);white-space:nowrap}

/* panes */
.tabs{display:none;gap:6px}
.tabs button{flex:1;padding:7px;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(290px,350px) 1fr;gap:12px}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.phead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.phead h2{margin:0;font:700 15px/1.2 var(--f-display);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.phead h2 small{font:500 12px var(--f-body);color:var(--mut)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters input,.filters select{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 8px;min-width:0}
.filters input{flex:1 1 120px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:5px 9px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
#bin{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px}
.empty{color:var(--mut);font-size:13px;padding:14px 8px;text-align:center;border:1px dashed var(--line);border-radius:8px}

/* cards */
.card{position:relative;display:flex;gap:9px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--drama);border-radius:7px;padding:8px 9px 8px 8px;cursor:grab;touch-action:manipulation;min-width:0}
.card[data-cat="A"]{border-left-color:var(--action)}
.card:hover{border-color:var(--mut);border-left-color:inherit}
.card.ghost{opacity:.35}
.card.chosen{box-shadow:0 6px 18px rgba(0,0,0,.22)}
.pos{flex:0 0 auto;min-width:30px;font:600 18px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);padding-top:1px}
.cb{flex:1;min-width:0}
.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.code{font:600 12px var(--f-mono);color:var(--mut);letter-spacing:.02em}
.chip{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--drama-bg);color:var(--drama)}
.card[data-cat="A"] .chip{background:var(--action-bg);color:var(--action)}
.ttl{font-weight:600;line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--mut);margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 8px}
.dots{display:inline-flex;gap:2px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--mut)}
.add{flex:0 0 auto;align-self:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:6px;width:26px;height:26px;line-height:1;font-size:16px;padding:0}
.add:hover{background:var(--btn);color:var(--btn-ink)}

/* board */
#boardwrap{flex:1;min-height:0;overflow:auto;padding:10px}
#board{display:flex;gap:10px;align-items:flex-start;min-height:100%}
.col{flex:0 0 272px;max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;max-height:100%}
.col.ghost{opacity:.4}
.chead{display:flex;align-items:center;gap:6px;padding:8px 8px 6px}
.grip{cursor:grab;color:var(--mut);padding:2px 4px;user-select:none;font-size:15px;line-height:1;touch-action:none}
.cname{flex:1;min-width:0;border:1px solid transparent;background:none;font:700 14px var(--f-display);padding:3px 5px;border-radius:5px}
.cname:hover,.cname:focus{border-color:var(--line);background:var(--card)}
.cinfo{font-size:11.5px;color:var(--mut);padding:0 12px 6px;font-variant-numeric:tabular-nums}
.xbtn{border:0;background:none;color:var(--mut);font-size:16px;line-height:1;padding:3px 6px;border-radius:5px}
.xbtn:hover{color:var(--action);background:var(--action-bg)}
.cards{display:flex;flex-direction:column;gap:6px;padding:0 8px 8px;min-height:60px;overflow-y:auto}
.cards:empty::before{content:var(--drop,"Drop scenes here");display:block;color:var(--mut);font-size:12.5px;text-align:center;padding:16px 6px;border:1px dashed var(--line);border-radius:7px}
.newcol{flex:0 0 200px;border:1px dashed var(--mut);background:none;border-radius:9px;padding:14px;color:var(--mut);font-weight:500}
.newcol:hover{color:var(--ink);border-color:var(--ink)}

/* the scene workspace */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
#drawer{position:fixed;inset:0;z-index:21;background:var(--bg);overflow-y:auto}
#drawer[hidden]{display:none}
.sbar{position:sticky;top:0;z-index:4;display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.grow{flex:1 1 auto}
.sheet{max-width:1000px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(90px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h1{font:700 26px/1.2 var(--f-display);margin:0;overflow-wrap:anywhere}
.sect{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.sect.first{border-top:0;margin-top:10px;padding-top:0}
.sect>h3,.sect summary h3{font:600 11px var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--mut);margin:0}
.sect h4{margin:10px 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.sect h5{margin:0 0 4px;font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.sect p{margin:0;max-width:72ch}
.scgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--mut)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tags span{border:1px solid var(--line);border-radius:12px;padding:1px 9px;font-size:12px;background:var(--card)}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acts select,.orow select{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 8px;max-width:100%}
.orow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.olab{font-size:12px;color:var(--mut);min-width:84px}
.btn.ap.on{border-color:var(--ok);color:var(--ok)}
/* shots */
.shotlist{display:flex;flex-direction:column;gap:12px}
.shotcard{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:11px 12px;display:flex;flex-direction:column;gap:9px}
.shotcard.apd{border-color:var(--ok)}
.shhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shhead .n{font:600 13px var(--f-mono);color:var(--ink)}
.shhead .st{font:600 10.5px var(--f-mono);letter-spacing:.06em;color:var(--drama);background:var(--drama-bg);border-radius:4px;padding:1px 6px}
.shtext{font-size:14.5px;line-height:1.5;margin:0;overflow-wrap:anywhere}
.shotgrid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.shotgrid .acts .btn{padding:4px 9px;font-size:12.5px}
.shotgrid .acts{gap:5px;margin-top:7px}
.shotimg{display:grid;place-items:center;aspect-ratio:16/9;border:1px dashed var(--line);border-radius:8px;background:var(--bg);color:var(--mut);font-size:12.5px;text-align:center;padding:8px;cursor:pointer;overflow:hidden}
.shotimg.over{border-color:var(--ink);background:var(--line2);color:var(--ink)}
.shotimg.has{border-style:solid;padding:0;cursor:default}
.shotimg img{width:100%;height:100%;object-fit:cover;display:block}
/* image strip */
.imgcol{min-width:0}
.thumbs{display:flex;flex-wrap:wrap;gap:7px}
.thumb{position:relative;width:86px;height:56px;padding:0;border:2px solid var(--line);border-radius:7px;overflow:hidden;background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .tn{position:absolute;left:3px;bottom:3px;font:600 10px var(--f-mono);background:rgba(0,0,0,.6);color:#fff;border-radius:3px;padding:0 4px}
.thumb.sel{border-color:var(--ink)}
.thumb.best{border-color:var(--ok)}
.thumb.bad{opacity:.55}
.hint{border-left:2px solid var(--line);padding-left:9px}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
.verdict{font-size:12.5px;margin-top:7px;line-height:1.45}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--action)}
.verdict .sub{color:var(--mut);margin-top:2px}
.mjcol{min-width:0}
.sform{display:flex;flex-direction:column;gap:6px}
.sform input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 7px;width:100%}
#drawer textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:8px;resize:vertical;min-height:60px;font:13.5px/1.45 var(--f-body)}
/* versions */
.vrows{display:flex;flex-direction:column;gap:6px}
.vrow{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--card)}
.vrow[aria-pressed="true"]{border-color:var(--ink)}
.vrow b{display:block;font-size:13.5px}
.vrow span{font-size:12px;color:var(--mut)}
.seqlist{display:flex;flex-direction:column;gap:6px}
details.hsect summary{cursor:pointer;list-style:none}
details.hsect summary::-webkit-details-marker{display:none}
details.hsect summary h3::after{content:" ▸";color:var(--mut)}
details.hsect[open] summary h3::after{content:" ▾"}
ins{background:rgba(44,122,75,.2);text-decoration:none;border-radius:3px}
del{background:var(--action-bg);color:var(--action);border-radius:3px}
.dfield{margin-bottom:9px}
.dfield h5{margin:0 0 2px}
.dfield div{font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
details.srcd{border-top:1px solid var(--line);padding-top:9px;margin-top:12px}
details.srcd summary{cursor:pointer;font:600 11px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
details.srcd .sbody{font-size:13px;margin-top:6px;line-height:1.55}
details.srcd a{color:var(--drama)}
.rimg{max-width:320px;margin:7px 0 2px}
.rimg img{width:100%;border:1px solid var(--line);border-radius:7px;display:block}
#toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:7px 14px;border-radius:7px;font-size:13px;z-index:30;max-width:90%}
/* ---------- mobile view ---------- */
.more,.fold{display:none}
body[data-view="mobile"]{overflow:auto;height:auto;min-height:100%;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));gap:8px}
body[data-view="mobile"] html,body[data-view="mobile"]{height:auto}
body[data-view="mobile"] h1{font-size:19px}
body[data-view="mobile"] header{gap:7px 14px;align-items:flex-start}
body[data-view="mobile"] header>div:first-child{flex:1 1 100%}
body[data-view="mobile"] .sub{font-size:12px}
body[data-view="mobile"] .stats{gap:4px 16px;order:3}
body[data-view="mobile"] .stat b{font-size:15px}
body[data-view="mobile"] .tools{width:100%;gap:6px}
body[data-view="mobile"] .tools .btn,body[data-view="mobile"] .seg button{padding:8px 11px}
body[data-view="mobile"] .boardtabs button{padding:8px 12px;max-width:46vw}
body[data-view="mobile"] .rhythm .lab,body[data-view="mobile"] .runs{display:none}
body[data-view="mobile"] #strip{height:18px}
body[data-view="mobile"] .tabs{display:flex;position:sticky;top:0;z-index:12;background:var(--bg);padding:6px 0}
body[data-view="mobile"] .tabs button{padding:10px}
body[data-view="mobile"] main{display:block;min-height:0}
body[data-view="mobile"] main[data-tab="bin"] #pane-board,body[data-view="mobile"] main[data-tab="board"] #pane-bin{display:none}
body[data-view="mobile"] .pane{height:auto;overflow:visible}
body[data-view="mobile"] .phead{position:sticky;top:46px;z-index:8;background:var(--panel)}
body[data-view="mobile"] .filters input{flex:1 1 100%}
body[data-view="mobile"] .filters select{flex:1 1 46%}
body[data-view="mobile"] #bin{overflow:visible;gap:8px}
body[data-view="mobile"] #boardwrap{overflow:visible;padding:8px}
body[data-view="mobile"] #board{display:block;min-height:0}
body[data-view="mobile"] .col{flex:none;width:100%;max-width:none;max-height:none;margin-bottom:10px}
body[data-view="mobile"] .cards{overflow:visible;gap:8px}
body[data-view="mobile"] .col.folded .cards,body[data-view="mobile"] .col.folded .cnote{display:none}
body[data-view="mobile"] .col.folded{background:var(--panel)}
body[data-view="mobile"] .newcol{width:100%;flex:none;padding:16px}
body[data-view="mobile"] .grip{display:none}
body[data-view="mobile"] .fold{display:block;border:0;background:none;color:var(--mut);font-size:13px;line-height:1;padding:5px 6px;border-radius:5px}
body[data-view="mobile"] .chead{padding:9px 8px 7px;gap:3px}
body[data-view="mobile"] .ebtn,body[data-view="mobile"] .xbtn{padding:6px 7px;font-size:15px}
body[data-view="mobile"] .card{padding:11px 10px;cursor:default}
body[data-view="mobile"] .ttl{font-size:15px}
body[data-view="mobile"] .meta{font-size:12.5px}
body[data-view="mobile"] .pos{font-size:17px;min-width:26px}
body[data-view="mobile"] .add{width:34px;height:34px;font-size:18px}
body[data-view="mobile"] .more{display:block;flex:0 0 auto;align-self:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:6px;width:34px;height:34px;line-height:1;font-size:15px;padding:0;color:var(--mut)}
body[data-view="mobile"] .card .cb{padding-right:2px}
body[data-view="mobile"] .scgrid,body[data-view="mobile"] .shotgrid{grid-template-columns:1fr}
body[data-view="mobile"] .sheet{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
body[data-view="mobile"] .sheet h1{font-size:21px}
body[data-view="mobile"] .olab{min-width:0;flex:1 1 100%}
body[data-view="mobile"] .mjbox{font-size:12px}
body[data-view="mobile"] .acts .btn,body[data-view="mobile"] .acts select{padding:8px 11px}
body[data-view="mobile"] .ebtn{padding:6px 8px;font-size:15px}
body[data-view="mobile"] #ctx{min-width:min(280px,86vw);max-width:92vw}
body[data-view="mobile"] #ctx button{padding:10px 11px;font-size:14px}
body[data-view="mobile"] #ctx .ch{padding:7px 11px 4px}
body[data-view="mobile"] .rwrap{padding:18px 14px calc(70px + env(safe-area-inset-bottom,0px))}
body[data-view="mobile"] .rwrap h1{font-size:23px}
body[data-view="mobile"] .rbar{padding:9px 14px}
body[data-view="mobile"] #drawer p,body[data-view="mobile"] .shtext,body[data-view="mobile"] .dfield div{font-size:15px;line-height:1.55}
body[data-view="mobile"] .kv{font-size:13.5px}
body[data-view="mobile"] .sect h4{font-size:11.5px}
body[data-view="mobile"] .rsc p,body[data-view="mobile"] .rshots li{font-size:15px;line-height:1.55}
body[data-view="mobile"] #peek{display:none}
/* approval */
.apchip{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ok);border:1px solid var(--ok);border-radius:4px;padding:0 5px;white-space:nowrap}
.apmark{color:var(--ok);font-weight:700;font-size:13px;padding:0 2px}
.card.apd{border-left-color:var(--ok)!important;background:linear-gradient(90deg,rgba(44,122,75,.07),transparent 40%),var(--card)}
.card.apd .add{opacity:.5}
.col.apd{border-color:var(--ok)}
.col.apd .chead{background:linear-gradient(90deg,rgba(44,122,75,.1),transparent)}
.shot.apd{border-color:var(--ok)}
.apb{color:var(--mut)}
.apb.on{color:var(--ok)}
.lockmsg{border:1px solid var(--ok);border-radius:8px;padding:9px 11px;font-size:13px;color:var(--ink);background:rgba(44,122,75,.08)}
.opt{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:7px}
.opt h4{margin:0;font:600 11px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.opt p.sub{margin:0}
.opt .acts .btn[disabled],.seg button[disabled]{opacity:.45;cursor:not-allowed}
.mjbox{font:12.5px/1.5 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;margin-top:5px;overflow-wrap:anywhere;white-space:pre-wrap}
/* context menu */
#ctx{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:4px;min-width:200px;max-width:270px}
#ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 9px;border-radius:6px;font-size:13px}
#ctx button:hover{background:var(--line2)}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
#ctx .ch{font-size:11px;color:var(--mut);padding:5px 9px 3px;letter-spacing:.05em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ctx input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 8px}
/* hover preview */
#peek{position:fixed;z-index:35;width:min(370px,92vw);max-height:70vh;overflow:hidden;background:var(--card);border:1px solid var(--mut);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.3);padding:11px 13px;font-size:13px;line-height:1.5;pointer-events:none}
#peek h4{margin:0 0 3px;font:700 15px/1.25 var(--f-display)}
#peek .pm{font-size:11.5px;color:var(--mut);margin-bottom:7px;display:flex;gap:9px;flex-wrap:wrap}
#peek p{margin:0 0 7px}
#peek .pl{font:600 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
/* read-through */
#read{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto}
.rbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:10px 16px}
.rwrap{max-width:76ch;margin:0 auto;padding:26px 18px 90px}
.rwrap h1{font:700 27px/1.15 var(--f-display);margin:0 0 6px}
.rwrap .rdesc{color:var(--mut);margin-bottom:8px}
.rwrap .rstat{color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums}
.rseq{margin:28px 0 8px;border-top:1px solid var(--line);padding-top:15px}
.rseq h2{font:700 19px/1.25 var(--f-display);margin:0}
.rseq .rnote{color:var(--mut);font-size:13px;margin-top:4px;white-space:pre-wrap}
.rsc{margin:16px 0 0}
.rsc .rh{font:600 11.5px var(--f-mono);color:var(--mut);display:flex;gap:10px;flex-wrap:wrap}
.rsc h3{font:700 16px/1.3 var(--f-display);margin:2px 0 5px}
.rsc p{margin:0 0 6px;max-width:68ch}
.rsc .rcg{color:var(--mut)}
.rshots{margin:7px 0 0;padding:2px 0 2px 11px;list-style:none;border-left:2px solid var(--line)}
.rshots li{font-size:13px;margin-bottom:4px}
.rshots b{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;color:var(--mut)}
@media print{
  body>*{display:none!important}
  body.reading{background:#fff;color:#000;height:auto;display:block;padding:0}
  body.reading #read{display:block!important;position:static;overflow:visible;background:#fff}
  .rbar{display:none!important}
  .rwrap{max-width:none;padding:0}
  .rsc,.rseq{break-inside:avoid;page-break-inside:avoid}
  .rshots{border-left:1px solid #999}
  .rimg{max-width:70mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ---------- data ---------- */
const SCENES=[{"c":"S-230","src":"E01-01","t":"The garland and the curse","carrier":false,"ev":1,"evn":"Churning","cat":"D","tier":3,"mins":"1–2","mid":1.5,"rasa":"Raudra","pov":"Indra","pl":"Indra’s court, heaven","k":"Not present","sum":"Durvāsā, a sage, offers Indra a garland. Indra, preoccupied, drapes it on his elephant Airāvata, who tosses it to the ground and tramples it. Durvāsā curses the gods to lose their prosperity.","why":"Opens the mythic frame with a small act of carelessness that becomes a catastrophe; pride and its price.","turn":"The elephant drops the garland and it is crushed.","story":"Indra’s court at full radiance: gold, pearl, music, every colour at its brightest. Durvāsā enters, unhurried, with a garland he means as a gift. Indra, half listening, takes it without looking and drapes it over Airāvata’s head. The great white elephant shakes it off and the garland falls under his foot. The court goes quiet. Durvāsā looks at the crushed flowers, then at Indra, who has still not understood what he has done. The sage speaks one sentence, a curse, and walks out through the light. The shot ends on the flowers.","gen":["Mythological epic","Fantasy","Fable"]},{"c":"S-144","src":"E01-02","t":"The fall of the Devas","carrier":false,"ev":1,"evn":"Churning","cat":"D","tier":4,"mins":"1–2","mid":1.5,"rasa":"Karuṇa","pov":"Indra","pl":"Heaven; the field of battle; the gods’ flight","k":"Not present","sum":"Prosperity drains from heaven. Colour fades from armour and court; strength leaves the Devas. The Asuras overrun them and the Devas flee as suppliants.","why":"Sets up the world in need: the powerful become petitioners, the cost of pride.","turn":"Indra’s thunderbolt fails; the Devas run.","story":"The curse takes hold. Colour leaves the banners first, then the armour, then the faces. The Devas’ strength drains with it; Indra’s thunderbolt flickers and goes out. The Asuras come in from the edges, brighter than the gods now. The gods run. Some stop to help the fallen; most do not. The last image is the court, grey, with the garland’s crushed flowers still on the floor, and a long line of gods walking out of it.","gen":["Mythological epic","War","Tragedy"]},{"c":"S-607","src":"E01-03","t":"The petition to Brahmā and the Lord’s counsel","carrier":false,"ev":1,"evn":"Churning","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"Indra","pl":"Brahmā’s realm; the shore of the Ocean of Milk","k":"Spoken of, indirect (voice only)","sum":"The Devas go to Brahmā, who takes them to Viṣṇu. A voice answers: make an alliance with your enemies and churn the Ocean of Milk for amṛta; the Lord will arrange the rest.","why":"Delivers the plan and the film’s grammar lesson: the Lord acts through others and is never in the room.","turn":"The voice says, in effect, “you will do it, and I will hold what you cannot.”","story":"The Devas go to Brahmā, who takes them across the sky to the shore of the Ocean of Milk. The water is still and white. They kneel. Nothing appears. A light moves across the surface, a voice speaks, and Brahmā alone hears it clearly. He turns to Indra and passes it on: make peace with your enemies, churn this ocean for nectar, and the rest will be held for you. The Devas look at one another. It is not what they wanted to hear. The camera stays on their faces.","gen":["Mythological epic","Spiritual drama","Political drama"]},{"c":"S-127","src":"E01-04","t":"The humiliating alliance","carrier":false,"ev":1,"evn":"Churning","cat":"D","tier":2,"mins":"2","mid":2,"rasa":"Vīra","pov":"Indra","pl":"Asura camp; neutral ground","k":"Spoken of, indirect","sum":"The Devas, proud and desperate, approach Bali and the Asuras and propose to churn the ocean together. Each side hides its own motive: the Devas want the nectar for themselves, the Asuras expect an equal share.","why":"A pact of rivals that cannot hold; seeds the “seizing is not holding” theme.","turn":"Indra bows to ask Bali for help.","story":"Indra goes to Bali under a flag of truce. The two courts meet on neutral ground. Each side watches the other’s hands. Indra says the thing he did not want to say: they need each other. Bali listens. He knows exactly what the gods want and means to take his share anyway. A cup is passed. No one drinks. Both sides agree, each believing they have fooled the other.","gen":["Political drama","Mythological epic","Thriller"]},{"c":"S-686","src":"E01-05","t":"The mountain sinks; Kūrma lifts it","carrier":false,"ev":1,"evn":"Churning","cat":"A","tier":5,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"The Devas and Asuras (shared)","pl":"The shore and the Ocean of Milk","k":"Effect","sum":"Mandara is carried to the shore and used as the churning rod. It sinks. The two armies stare at the water. The mountain rises again, and the audience sees only a vast curved back beneath it: Kūrma, the tortoise.","why":"The film’s clearest image of the unseen support: the Lord as landform under everything.","turn":"Something rises under the mountain.","story":"The mountain is brought to the shore and set upright in the ocean as the churning rod. It begins to sink. The two armies stare as it goes down under their rope. For a long moment there is only water. Then it rises, slowly, on something vast and curved beneath it. A shell-like back, ridged and wet, lifts the mountain clear. No one speaks. The armies pick up the rope.","gen":["Mythological epic","Disaster","Spectacle/wonder"]},{"c":"S-499","src":"E01-06","t":"The great churning","carrier":false,"ev":1,"evn":"Churning","cat":"A","tier":5,"mins":"2","mid":2,"rasa":"Vīra","pov":"The Devas at the tail","pl":"The Ocean of Milk","k":"Effect","sum":"The Devas hold the tail and the Asuras the head of Vāsuki. They pull in turn; the mountain spins, the sea convulses, the serpent breathes fire and smoke. Hands blister, strength fails, and something unseen empowers both sides.","why":"Endurance as action; the long middle of the myth; the shared labour whose prize will not be shared.","turn":"The mountain keeps turning, as if lifted by a hand no one sees.","story":"The Devas hold the tail, the Asuras the head. They pull in turn. The mountain spins on the Lord’s back and the ocean turns with it. The serpent coughs smoke. Hands blister, backs bend, teeth set. A rhythm builds: pull, release, pull. Every strain is visible and no one sees what keeps the mountain from falling. A drop of nectar-white foam rises, and then another, and the sea begins to cloud. Both sides are exhausted. Neither lets go.","gen":["Mythological epic","Adventure","Survival drama"]},{"c":"S-999","src":"E01-07","t":"Hālāhala rises","carrier":false,"ev":1,"evn":"Churning","cat":"A","tier":4,"mins":"1–2","mid":1.5,"rasa":"Bhayānaka","pov":"The shore-watcher (fisher family) and the Devas","pl":"The Ocean of Milk","k":"Not present","sum":"The churning brings up the poison Hālāhala. It spreads on the water like black smoke. Beings flee in panic; fish die; the fisher child on the shore backs away from the water. Brahmā and the Devas call to Śiva.","why":"The cost of the prize arrives first: before the gift, the poison.","turn":"A single fisher child stays at the water’s edge.","story":"The churning brings something up that is not nectar. A black stain spreads over the milk-white water. It moves faster than a man can run. Fish turn white and float. The Devas and Asuras drop the rope and flee along the shore. At the edge of the water, a fisher child stays where she is, one hand held out toward the dark. Brahmā calls to Śiva. No one else moves toward it.","gen":["Disaster","Horror","Mythological epic"]},{"c":"S-761","src":"E01-08","t":"Śiva drinks the poison","carrier":false,"ev":1,"evn":"Churning","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Karuṇa","pov":"Pārvatī or the fisher child","pl":"The shore of the Ocean of Milk","k":"Not present","sum":"Śiva walks toward the poison, cups it in his hand and drinks. Pārvatī’s hand rises to his throat to hold it there, and his throat turns blue. The Devas and Asuras stand silent. The churning resumes.","why":"The first great act of absorption: one person walks into the harm so everyone else can live. Mirrors later acts by Krishna and Rukmini.","turn":"Pārvatī’s hand closes on his throat.","story":"Śiva walks toward the poison while everyone else runs from it. He kneels, cups it in one hand and lifts it. He drinks. Pārvatī’s hand rises to his throat, and holds. The skin there turns blue. For a long moment nothing else moves. Then the water begins to clear, a little at a time. The fisher child sees it. Behind her, someone starts to pull the rope again.","gen":["Spiritual drama","Mythological epic","Drama"]},{"c":"S-938","src":"E01-09","t":"The treasures rise","carrier":false,"ev":1,"evn":"Churning","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"The Devas and Asuras","pl":"The Ocean of Milk","k":"Hands","sum":"With the poison held, the treasures rise: Surabhi the cow, the horse Uccaiḥśravā, the elephant Airāvata, the Kaustubha jewel, the Pārijāta tree, the Apsarās. Each is claimed. The jewel goes to the Lord, though no one sees the hand.","why":"A scene of wonder and greed; each claim shows who the claimant is. Plants the Pārijāta tree.","turn":"The jewel is taken by an unseen hand and no one protests.","story":"With the poison held, the sea gives gifts. A cow rises, then a white horse, then an elephant like Airāvata, then a jewel that catches the sun. A tree comes up with flowers already open. Apsarās step from the foam. The Devas and Asuras claim them. A hand at the edge of the frame takes the jewel and no one objects. Nobody remarks on whose hand it was.","gen":["Mythological epic","Fantasy","Wonder/spectacle"]},{"c":"S-337","src":"E01-10","t":"Lakṣmī chooses","carrier":false,"ev":1,"evn":"Churning","cat":"D","tier":3,"mins":"2–3","mid":2.5,"rasa":"Śṛṅgāra","pov":"Lakṣmī","pl":"The shore; the assembled claimants","k":"Hands","sum":"Lakṣmī emerges from the ocean with a garland. Gods, sages and Asuras stand ready, each certain she will choose them. She looks at each and passes on. At the end she walks to the one who has not stepped forward and places the garland on him; he holds her to his chest for good. The Asuras are left empty-handed.","why":"The mythic mirror of Rukmini’s choice; the theme in one image: she chooses, she is not taken.","turn":"She passes every claimant and goes to the one who did not ask.","story":"Lakṣmī rises from the sea with a garland in her hands. The gods and the Asuras stand in a long arc, each sure it will be him. She walks along the line. She looks at each face for a moment and moves on. She passes the powerful and the proud and the handsome. At the end of the line she stops in front of the one who has not stepped forward, and she places the garland on him. The shot cuts so that we see only the garland settle on a shoulder. Behind her, the line goes quiet.","gen":["Romance","Mythological epic","Drama"]},{"c":"S-756","src":"E01-11","t":"The Asuras refused","carrier":false,"ev":1,"evn":"Churning","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Raudra","pov":"Bali","pl":"The shore","k":"Spoken of, indirect","sum":"The Asuras stand where Lakṣmī passed them. Bali and his captains feel the refusal. Vāruṇī, the wine goddess, rises from the sea and Viṣṇu gives her to the Asuras as a consolation. They accept her.","why":"Shows the rejected side as human; sets up the rage that will break the alliance.","turn":"They take Vāruṇī and swallow their anger.","story":"The Asuras stand where Lakṣmī passed them. Bali and his captains keep their faces still. The line shifts, and someone laughs. The wine goddess rises from the sea, and the Lord’s permission comes from offstage. The Asuras accept her. They take the cup and swallow their anger. They know exactly what they have lost.","gen":["Drama","Political drama","Mythological epic"]},{"c":"S-444","src":"E01-12","t":"Dhanvantari and the seizure of the pot","carrier":false,"ev":1,"evn":"Churning","cat":"A","tier":3,"mins":"1–2","mid":1.5,"rasa":"Raudra","pov":"Dhanvantari, then the Asuras","pl":"The shore","k":"Not present","sum":"Dhanvantari rises from the ocean carrying the pot of amṛta. The Asuras seize it in a rush. They begin to fight each other over who drinks first.","why":"Greed turns winners against each other the moment they hold the prize: “seizing is not holding”.","turn":"The pot passes between hands and the circle breaks.","story":"Dhanvantari rises from the water holding a pot, and the Asuras go for it before he can say a word. Hands close on the handles. The pot passes from one to the next. Someone shouts that he saw it first. Someone else answers with a blow. The circle that held for the whole churning breaks. The gods watch from the edge, unmoving.","gen":["Caper/heist","Drama","Mythological epic"]},{"c":"S-722","src":"E01-13","t":"Mohinī’s deception","carrier":false,"ev":1,"evn":"Churning","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"The Asuras, then the Devas","pl":"The shore; the assembly","k":"Hands","sum":"A beautiful woman appears. The Asuras, captivated, ask her to distribute the nectar. She separates the two sides and serves the Devas first. The Asuras realise too late.","why":"A deception sequence closer to a heist; moral grey: the right side is served by a trick.","turn":"The ladle goes to the Devas’ side.","story":"A woman walks into the assembly and the Asuras forget what they were arguing about. They ask her to share the nectar fairly. She smiles, separates the two sides into two lines, and begins to serve. The first ladle goes to the Devas. Then the second. The Asuras are still looking at her face when they realise the pot is nearly empty.","gen":["Caper/heist","Mythological epic","Comedy of manners"]},{"c":"S-653","src":"E01-14","t":"Rāhu exposed","carrier":false,"ev":1,"evn":"Churning","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Bhayānaka","pov":"Sūrya and Candra","pl":"The Devas’ line","k":"Effect","sum":"Rāhu disguises himself as a Deva and sits in the line to drink. The sun and moon recognise him and cry out. The Sudarśana disc flashes; his head is cut off but survives, because the nectar has touched it.","why":"A traitor, a refusal to be shut out, and a head that survives. A short sharp reversal.","turn":"Sūrya and Candra point.","story":"In the line of Devas, one face is not quite right. The sun and the moon see it first. They point and cry out. A flash of light crosses the line. The false god’s head leaves his body, and the head does not die. It rolls, blinks, and keeps looking at them. Behind it the body falls. The nectar has already reached the throat.","gen":["Thriller","Horror","Mythological epic"]},{"c":"S-658","src":"E01-15","t":"The Deva–Asura war","carrier":false,"ev":1,"evn":"Churning","cat":"A","tier":5,"mins":"2","mid":2,"rasa":"Vīra","pov":"Indra","pl":"The battlefield between heaven and ocean","k":"Not present","sum":"The alliance collapses; the Asuras attack. Bali leads them with illusions; Indra leads the Devas with the thunderbolt. Weapons and magic fill the field. The Devas turn the war and regain heaven.","why":"The cosmic action set-piece; shows the cost of a pact of rivals; gives heaven back.","turn":"The thunderbolt turns the field.","story":"The alliance ends. The Asuras strike first with illusions: fire that is not fire, armies that vanish when struck. Bali leads from the front. Indra answers with the thunderbolt, and the field flashes. For a while the Devas lose ground. Then nectar-strength takes hold, and every blow they land is real. The line turns. Colour comes back across the field, banner by banner. The Devas return to heaven, which has its light again.","gen":["War","Mythological epic","Fantasy"]},{"c":"S-765","src":"E01-16","t":"Śiva before Mohinī","carrier":false,"ev":1,"evn":"Churning","cat":"D","tier":3,"mins":"1–2","mid":1.5,"rasa":"Adbhuta","pov":"Śiva","pl":"A forest","k":"Hands","sum":"Śiva, having heard of Mohinī, asks to see her. She appears in the forest; he is bewildered and pursues, then recognises the power behind the form and is released.","why":"Even the wise are undone by wonder; recognition after bewilderment; an optional echo of the film’s reveal.","turn":"He recognises the power behind the form.","story":"Śiva has heard of the form that deceived the Asuras and asks to see it. Mohinī appears in a forest, in a light that seems to hold still for her. He looks, and the wisest of the gods stops thinking. He follows her between the trees. She runs, laughing, and he runs after. At the end of it he understands whose power this was. He stops, recognises it and is released. He stands still for a long moment, and then he laughs too.","gen":["Romance","Comedy","Mythological epic"]},{"c":"S-490","src":"E01-17","t":"The fisher family on the shore","carrier":false,"ev":1,"evn":"Churning","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Śānta","pov":"The fisher child","pl":"The shore of the Ocean of Milk","k":"Not present","sum":"A fisher family lives by the water. A child dips a hand into the sea and brings it up clean after the poison is held. Later a net comes up full of silver. The family does not know why; they live by the result.","why":"World-welfare proof for Event 01; the person who benefits without knowing the cause.","turn":"The child’s hand comes out clean.","story":"On the shore a fisher family mends nets. The sea has been strange for days. A child kneels at the water’s edge and dips a hand in. She lifts it out and looks: it is clean. She holds it up to her mother. Later, at dusk, the net comes up full of fish that shine like silver. The family does not know why. They know that they are alive, and that the water is theirs again.","gen":["Folk tale","Drama","Spiritual drama"]},{"c":"S-788","src":"E01-18","t":"The mural at Ambikā’s temple","carrier":true,"ev":1,"evn":"Churning","cat":"D","tier":3,"mins":"2–3","mid":2.5,"rasa":"Adbhuta","pov":"Rukmini","pl":"Ambikā’s temple at Kuṇḍina; childhood or the eve of the wedding","k":"Spoken of, indirect","sum":"A girl, or Rukmini a few days before the wedding, studies a painted wall at the temple of Ambikā. Panels show the Churning: the mountain, the serpent, the poison, the goddess’s hand at Śiva’s throat, Lakṣmī choosing. A priest answers a question. Rukmini stops at the panel where Lakṣmī chooses.","why":"Delivers the Manthana into Rukmini’s world and plants the temple where she will later pray.","turn":"She stops at the panel of the choosing.","story":"In the temple of Ambikā, Rukmini stops in front of a painted wall. A priest has been sweeping. The panels show a mountain, a serpent, a dark flood, a goddess’s hand at a god’s throat, and a goddess with a garland walking along a line of suitors. Rukmini asks who the goddess chose. The priest tells her. She stays at the last panel a long time, then touches the painted figure at the end of the line with one finger.","gen":["Romance","Spiritual drama","Mythological epic"]},{"c":"S-392","src":"E01-19","t":"The bard’s recital on the eve of the wedding","carrier":true,"ev":1,"evn":"Churning","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Hāsya (irony)","pov":"Rukmini","pl":"Kuṇḍina’s hall; evening","k":"Spoken of, indirect","sum":"A bard, among the entertainers at the palace before the wedding, recites the Churning to a hall of kings who do not notice they are the Asuras. Rukmini, at the edge of the women’s gallery, hears the part about the goddess who passed every claimant.","why":"Delivers the Manthana to the kings and Rukmini together; the audience sees the irony the kings do not.","turn":"Rukmini realises the kings are the Asuras.","story":"On the eve of the wedding, a bard sings in the hall. The kings are eating and drinking and half listening. He sings the Churning: the gods who lost their glory, the allies who were enemies, the poison, the goddess with the garland. He sings of the line of claimants and of the one she chose. The kings applaud, because they think it is about the gods. Rukmini, in the gallery above, watches them and sees the Asuras.","gen":["Political drama","Musical/lyrical","Satire"]},{"c":"S-919","src":"E02-01","t":"The march of the burden","carrier":false,"ev":2,"evn":"Earth’s burden","cat":"D","tier":4,"mins":"1–2","mid":1.5,"rasa":"Karuṇa","pov":"The Earth (as a cow)","pl":"Fields and roads across a kingdom","k":"Not present","sum":"Armies of arrogant kings tramp across fields and villages. Crops are crushed, wells fouled, animals taken. A cow stumbles under the weight of an army’s shadow and goes down on her knees.","why":"Gives the film its first image of suffering and the reason the story needs a saviour.","turn":"The cow falls.","story":"Armies of arrogant kings cross a country. Chariots flatten the barley and the soldiers drag women’s grindstones along with them. Wells are fouled and granaries emptied, and village after village watches from its doorway. Somewhere under the weight of it all, a cow stumbles and goes down on her knees. The line of marching men does not break step. It goes around her.","gen":["Mythological epic","Drama","Disaster"]},{"c":"S-687","src":"E02-02","t":"The Earth goes to Brahmā","carrier":false,"ev":2,"evn":"Earth’s burden","cat":"D","tier":3,"mins":"1–2","mid":1.5,"rasa":"Karuṇa","pov":"The Earth (as a cow)","pl":"Brahmā’s realm","k":"Not present","sum":"The Earth, in the form of a tearful cow, comes to Brahmā and tells him her suffering: too many arrogant kings, too much weight.","why":"The plea that triggers the whole chain of events; a world crying for help.","turn":"Brahmā rises to take her to the Lord.","story":"The Earth comes to Brahmā as a cow, weeping. She cannot say it all at once. The kings are too many, too proud and too heavy. Brahmā puts a hand on her head. She looks up. He rises, and he does not need to be asked to lead the way.","gen":["Fantasy","Mythological epic","Drama"]},{"c":"S-509","src":"E02-03","t":"The shore and the hymn","carrier":false,"ev":2,"evn":"Earth’s burden","cat":"D","tier":2,"mins":"1–2","mid":1.5,"rasa":"Śānta","pov":"Brahmā","pl":"The shore of the Ocean of Milk","k":"Spoken of, indirect","sum":"Brahmā, Śiva and the Devas take the Earth to the shore of the same Ocean of Milk and worship Viṣṇu with the Puruṣa-sūkta hymn. The water is still. Brahmā goes into trance.","why":"Rhymes with the Manthana; the shore is the film’s place of petitions.","turn":"Brahmā’s trance begins.","story":"Brahmā, Śiva, the Devas and the Earth come to the shore of the Ocean of Milk. The sea is flat, white and silent. They begin the hymn to the Lord. It rises, grows, and then fades to nothing. Brahmā’s eyes close. He does not move. The waters hold their breath.","gen":["Spiritual drama","Mythological epic","Art-house/meditative"]},{"c":"S-561","src":"E02-04","t":"The voice from the sky","carrier":false,"ev":2,"evn":"Earth’s burden","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"Brahmā","pl":"The shore","k":"Spoken of, indirect (voice only)","sum":"In trance Brahmā hears a voice from the sky. He relays it: the Lord already knows the Earth’s distress. The Devas are to take birth among the Yadus; he himself will come as Vasudeva’s son and lighten the Earth’s load by his own power of time.","why":"The film’s promise: the answer arrives before the man. The cleanest example of the unseen-support grammar.","turn":"Brahmā opens his eyes and repeats the voice.","story":"In trance, Brahmā hears a voice from the sky. He opens his eyes slowly and speaks as if repeating something he has just learned by heart. The Lord already knows the Earth’s distress. The Devas are to take birth among the Yadus. He himself will appear as Vasudeva’s son, and lighten the Earth’s load through his own power of time. The Devas look up. There is nothing to see, and they bow anyway.","gen":["Mythological epic","Spiritual drama","Prophecy drama"]},{"c":"S-269","src":"E02-05","t":"The births are assigned","carrier":false,"ev":2,"evn":"Earth’s burden","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Adbhuta","pov":"Brahmā","pl":"The shore","k":"Spoken of, indirect","sum":"Brahmā tells the Devas: be born among the Yadus; the Lord will be Vasudeva’s son; Ananta will come first as his elder brother; Yogamāyā will appear to carry out his work. The Devas’ wives will be born to be with him.","why":"Lays the cast: Balarama (Ananta) and the hidden hand (Yogamāyā).","turn":"Each Deva bows to take the assignment.","story":"Brahmā tells the Devas how it will be. They will be born among the Yadus. Ananta will come first, as the elder brother. The Lord’s power of illusion will carry out his work. The Devas’ wives will be born to be with him. One by one, the Devas bow to take their assignment. The scene is quiet and almost administrative. It feels like a promise being filed.","gen":["Mythological epic","Political drama","Prophecy drama"]},{"c":"S-981","src":"E02-06","t":"Mathurā becomes the Yadu capital","carrier":false,"ev":2,"evn":"Earth’s burden","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Śānta","pov":"Śūrasena","pl":"Brahmā’s abode; Mathurā","k":"Not present","sum":"Brahmā returns to his abode. Śūrasena rules from Mathurā, which becomes the Yadu capital. The stage is set.","why":"A bridge to Event 03; sets the city that will be besieged.","turn":"A distant drum under the city’s quiet.","story":"Brahmā goes home. In Mathurā, Śūrasena rules from a quiet court. The city goes about its day: carts, water, a bell. A drum sounds somewhere inside the quiet. The audience has just been told something is coming, and this is the place it will come to.","gen":["Mythological epic","Historical drama","Slice of life"]},{"c":"S-427","src":"E02-07","t":"The farmer and his cow","carrier":false,"ev":2,"evn":"Earth’s burden","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Śānta","pov":"The farmer","pl":"A field outside Kuṇḍina","k":"Not present","sum":"A farmer and his cow plough a strip beside a road armies use. In one image the ground is trampled; in the last the cow lies down in the furrow and the plough turns clean soil.","why":"World-welfare proof for Event 02; the burden lifted at ground level.","turn":"The cow lies down in the furrow.","story":"A farmer and his cow plough a strip beside the road that armies use. In the first shot the ground is trampled and the cow limps. Time passes. In the last, the cow lies down in the furrow, rests, and the plough turns clean soil. The farmer sits at the field’s edge and does not know why the road has gone quiet.","gen":["Folk tale","Drama","Spiritual drama"]},{"c":"S-206","src":"E02-08","t":"The cow that will not move","carrier":true,"ev":2,"evn":"Earth’s burden","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Karuṇa","pov":"Rukmini","pl":"A street in Kuṇḍina","k":"Spoken of, indirect","sum":"An army passes through a street. A cow stops in the road and will not move. The soldiers curse her; an old woman says the story of the Earth who wept. Rukmini, on her way home, hears it and stops.","why":"Delivers Event 02 into Rukmini’s world through an image she can see and a story she can hear.","turn":"Rukmini stops walking and listens.","story":"A column of soldiers comes through a street in Kuṇḍina. A cow stops in the middle of the road and will not move. The soldiers curse her and push. Rukmini, on her way home, slows. An old woman beside her says quietly, “She is the Earth, you know.” And she tells it: the weeping, the voice, the promise. Rukmini stands still long after the soldiers have gone around.","gen":["Folk tale","Drama","Mythological epic"]},{"c":"S-612","src":"E02-09","t":"“Asked for, before he was born”","carrier":true,"ev":2,"evn":"Earth’s burden","cat":"D","tier":2,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"Rukmini","pl":"Bhīṣmaka’s palace","k":"Spoken of, direct","sum":"Visitors sing Krishna’s praises in the palace and begin, not with his beauty, but with the reason: the Earth wept, a voice answered, a child was promised. Rukmini listens at the edge of the hall.","why":"Turns the first “songs about him” from praise into a story with a cause; Event 02 lands in the first Krishna scene of the film.","turn":"One visitor says the Earth wept for him.","story":"Visitors sing in the palace. The first begins not with Krishna’s face but with the reason he came. The Earth wept, he says, and a voice answered. A child was promised. The next singer adds the cowherds, the third the beauty. Rukmini, at the edge of the hall, notices that all three start with the weeping. She decides to hear more.","gen":["Musical/lyrical","Romance","Mythological epic"]},{"c":"S-478","src":"E03-01","t":"The widows return","carrier":false,"ev":3,"evn":"Jarasandha","cat":"D","tier":2,"mins":"2","mid":2,"rasa":"Raudra","pov":"Jarasandha","pl":"Jarasandha’s palace, Magadha","k":"Spoken of, direct (hostile)","sum":"Asti and Prāpti, Kaṁsa’s widows, come home to their father Jarasandha and tell him how their husband died. His grief becomes rage and he resolves to destroy the Yādavas.","why":"Gives the antagonist a human grievance; rage born of loss.","turn":"He stands and calls for the army.","story":"Two widows in white come into Jarasandha’s hall and stand before the throne. They do not weep. They say what happened to their husband Kaṁsa and who did it. The king sits very still. Then his hand closes on the arm of the throne, and he calls for the army. Courtiers move before he finishes the sentence.","gen":["Political drama","Tragedy","War"]},{"c":"S-610","src":"E03-02","t":"Twenty-three divisions at the gate","carrier":false,"ev":3,"evn":"Jarasandha","cat":"A","tier":4,"mins":"1–2","mid":1.5,"rasa":"Bhayānaka","pov":"The water-carrier of Mathurā","pl":"Mathurā’s walls","k":"Not present","sum":"Twenty-three akṣauhiṇīs surround Mathurā. The water-carrier on the wall sees tents, banners and smoke to every horizon. The first chalk mark will be made on this day.","why":"Scale and dread from the ordinary person’s eye; the siege as a visual fact.","turn":"The army’s line closes to the horizon.","story":"The army arrives in stages. First a line of dust, then tents, then banners, then a country of fires. The water-carrier on Mathurā’s wall puts down his bucket and counts, and gives up. By evening the horizon is full. He makes a first chalk mark on the wall, because there is nothing else to do.","gen":["War","Thriller","Mythological epic"]},{"c":"S-844","src":"E03-03","t":"The decision to spare him","carrier":false,"ev":3,"evn":"Jarasandha","cat":"D","tier":2,"mins":"2","mid":2,"rasa":"Śānta","pov":"Balarama","pl":"Mathurā; a council","k":"Spoken of, direct","sum":"Krishna considers the situation. He will destroy the army but leave Jarasandha alive so that he gathers more armies, bringing more of the Earth’s burden into his hands. He says so, in effect, to Balarama; Balarama does not fully understand.","why":"Mercy as strategy; the film’s clearest statement of Krishna’s method; links to Event 02.","turn":"Balarama sits down, unconvinced but silent.","story":"In a council room, Krishna’s voice lays out the plan: break the army, but leave the king alive. Jarasandha will raise another and another, and each will bring more of the Earth’s weight within reach. Balarama listens with a hard face. He does not see why a man who burns villages should be allowed to walk home. He sits down without agreeing. The scene ends on his silence.","gen":["Political drama","War","Spiritual drama"]},{"c":"S-972","src":"E03-04","t":"The sky-chariots and the conch","carrier":false,"ev":3,"evn":"Jarasandha","cat":"A","tier":4,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"The women of Mathurā","pl":"Mathurā’s gate and the plain","k":"Shadow or sound","sum":"Two radiant chariots, with drivers and weapons, descend from the sky. Krishna and Balarama ride out with a small contingent. The conch sounds, and the enemy trembles before anything is seen.","why":"Pure effect: the sound before the sight; the first spectacle of the unseen hero.","turn":"The conch sounds and the front line steps back.","story":"Two chariots drop from the sky in a column of light. They land on the plain outside Mathurā. Two men step up into them. The gate opens and a small column rides out. A conch sounds, long and clear, and the front line of Jarasandha’s army steps back before anything else has happened.","gen":["Mythological epic","War","Spectacle/wonder"]},{"c":"S-907","src":"E03-05","t":"The taunt and the answer","carrier":false,"ev":3,"evn":"Jarasandha","cat":"D","tier":2,"mins":"1–2","mid":1.5,"rasa":"Raudra","pov":"Jarasandha","pl":"The plain before the walls","k":"Spoken of, direct (hostile)","sum":"Jarasandha mocks Krishna as a boy and challenges Balarama. A voice answers: heroes show their courage in action, not in boasting.","why":"A portrait of Krishna through his enemy’s contempt; the rival’s disdain that the audience reads as respect.","turn":"The reply is calm and shuts him up.","story":"Jarasandha rides forward and calls across the field. He mocks the boy who hides behind a plough and offers Balarama a real fight. The answer comes back over the field in a quiet voice: heroes do not boast, they act. Jarasandha laughs, and the laugh stops short. Behind him, no one else is laughing.","gen":["War","Political drama","Mythological epic"]},{"c":"S-804","src":"E03-06","t":"The battle seen from the wall","carrier":false,"ev":3,"evn":"Jarasandha","cat":"A","tier":5,"mins":"3","mid":3,"rasa":"Vīra","pov":"The women of Mathurā","pl":"The walls of Mathurā; the plain","k":"Effect","sum":"The enemy surrounds the two chariots. The women on the wall watch and faint when the chariots vanish behind the enemy. Arrows destroy elephants, horses and chariots; the plough sweeps the infantry. The women wake to see the field empty of the enemy.","why":"The battle as effect, not as spectacle of Krishna: the camera stays on the women.","turn":"They wake to a cleared field.","story":"The enemy closes on the two chariots. On the wall of Mathurā the women watch as the chariots disappear behind dust and men. One by one they faint. On the field, arrows fall on elephants and horses and chariots; the plough sweeps the footsoldiers aside. When the women wake the dust is thinning, and the plain is empty of the enemy. The chariots stand where they stood.","gen":["War","Mythological epic","Suspense"]},{"c":"S-342","src":"E03-07","t":"Jarasandha seized and freed","carrier":false,"ev":3,"evn":"Jarasandha","cat":"A","tier":2,"mins":"1–2","mid":1.5,"rasa":"Vīra","pov":"Balarama","pl":"The field","k":"Spoken of, indirect","sum":"Balarama seizes Jarasandha and begins to bind him. Krishna’s word stops him: not yet, there is a purpose. The king is released.","why":"A small fight with a large moral turn; Balarama’s impatience set against Krishna’s purpose.","turn":"Balarama’s hands open.","story":"Balarama has Jarasandha by the throat and a rope in his other hand. He starts to bind him. A hand rises at the edge of the frame, and a word follows. Balarama stops. He looks at the rope, then at the hand, and opens his fist. Jarasandha stumbles back and runs. Balarama watches him go with something close to disgust.","gen":["War","Drama","Mythological epic"]},{"c":"S-495","src":"E03-08","t":"The near-penance","carrier":false,"ev":3,"evn":"Jarasandha","cat":"D","tier":2,"mins":"1–2","mid":1.5,"rasa":"Karuṇa","pov":"Jarasandha","pl":"The road from Mathurā to Magadha","k":"Not present","sum":"Ashamed, Jarasandha resolves on penance. Other kings dissuade him: his defeat was fate, not failing. He turns back toward Magadha.","why":"A chance at change refused; the coalition’s habit of consoling itself instead of learning.","turn":"He allows himself to be talked out of it.","story":"Jarasandha rides home alone with a few commanders. He stops by a river and says he will give it all up and do penance. The other kings who have come with him object. This was fate, they say, not failing. The river runs on. He looks at his hands, and then he gets back on the horse.","gen":["Tragedy","Political drama","Road movie"]},{"c":"S-370","src":"E03-09","t":"Seventeen times","carrier":false,"ev":3,"evn":"Jarasandha","cat":"A","tier":4,"mins":"2","mid":2,"rasa":"Karuṇa","pov":"The water-carrier","pl":"The wall of Mathurā, across seasons","k":"Effect","sum":"A water-carrier chalks a mark on the wall after each siege. Each time the enemy comes in a new way: a night assault, a fire assault, an elephant charge, a flood. Each time it ends the same. The marks reach seventeen.","why":"Tragic repetition turned into a single image; an enemy who cannot learn.","turn":"The seventeenth mark is made, with no army to follow it.","story":"The water-carrier’s wall in Mathurā. A night assault comes with torches, and is gone by morning. He makes a mark. A fire assault, with burning carts. A mark. An elephant charge. A mark. Siege towers. A mark. A flood. A mark. Each time it ends the same way, and each time the king is let go. The wall grows seventeen strokes long. On the last the carrier steps back, and there is no army to follow it.","gen":["War","Mythological epic","Drama"]},{"c":"S-483","src":"E03-10","t":"The return and the spoils","carrier":false,"ev":3,"evn":"Jarasandha","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Hāsya (joy)","pov":"Ugrasena","pl":"Mathurā","k":"Hands","sum":"Krishna returns amid celebration and flowers. He gives the battlefield wealth to Ugrasena, the king, and takes none himself.","why":"Shows his lack of acquisitiveness and the city’s relief.","turn":"The king receives the wealth.","story":"Krishna’s chariot comes back through the gate and the city throws flowers. Ugrasena waits in the courtyard. A hand holds out the wealth of the field and the king receives it. Nothing else is taken. The crowd cheers, and a child runs to the wheels of the chariot and has to be pulled back. The hand has already gone.","gen":["Mythological epic","Drama","Folk tale"]},{"c":"S-470","src":"E03-11","t":"The chase on foot","carrier":false,"ev":3,"evn":"Jarasandha","cat":"A","tier":3,"mins":"2","mid":2,"rasa":"Vīra","pov":"Jarasandha","pl":"The road from Mathurā to the hills","k":"Shadow or sound","sum":"After the cave, Jarasandha returns with twenty-three divisions while the Yadavas carry wealth toward Dvārakā. Krishna and Balarama run on foot. Jarasandha pursues, laughing.","why":"The last chase; the brothers as fugitives; tonal reversal.","turn":"They leave the road and climb.","story":"Jarasandha returns with twenty-three divisions while the Yādavas carry wealth toward the sea. Two men leave the road and run. Behind them the king rides, laughing, with a host filling the road. The two men get smaller and the host does not. They turn off the plain and begin to climb.","gen":["Adventure","Thriller","Mythological epic"]},{"c":"S-231","src":"E03-12","t":"The burning hill","carrier":false,"ev":3,"evn":"Jarasandha","cat":"A","tier":5,"mins":"2","mid":2,"rasa":"Bhayānaka","pov":"Balarama","pl":"Mount Pravarṣaṇa","k":"Shadow or sound","sum":"The brothers climb Pravarṣaṇa. Jarasandha cannot find them and sets the hill on fire. Two brothers on a mountain on fire, with no army: the only time they are afraid.","why":"The two brothers’ lowest point; fear, not strategy.","turn":"They run out of ground.","story":"The hill is called Pravarṣaṇa. They go up it because there is no other way to go. The king below cannot find them and sets the hillside alight. Fire runs up through the trees. The two brothers climb above the smoke and run out of mountain. Balarama looks down. Krishna is a figure in the smoke with his back to the fire. For the first time in the film, they are afraid.","gen":["Survival drama","Thriller","Disaster"]},{"c":"S-247","src":"E03-13","t":"The leap and the false victory","carrier":false,"ev":3,"evn":"Jarasandha","cat":"A","tier":3,"mins":"1–2","mid":1.5,"rasa":"Adbhuta","pov":"Jarasandha","pl":"The burning peak; Jarasandha’s camp","k":"Effect","sum":"They leap from the burning peak and disappear. Jarasandha believes them dead and goes home to Magadha, satisfied.","why":"A false victory for the antagonist; the audience knows he is wrong.","turn":"He sees no bodies and accepts it.","story":"They jump. The shot follows one silhouette against the flames and stops before the ground. The fire rises. At the bottom, Jarasandha waits for bodies. He sees none. A commander tells him there is no sign of them in the ash. He decides he has won, and goes home. On the hill, the fire burns out.","gen":["Thriller","Mythological epic","Adventure"]},{"c":"S-663","src":"E03-14","t":"Rukmī admires Jarasandha","carrier":true,"ev":3,"evn":"Jarasandha","cat":"D","tier":2,"mins":"2","mid":2,"rasa":"Raudra","pov":"Rukmini","pl":"Bhīṣmaka’s palace","k":"Spoken of, direct (hostile)","sum":"Rukmī speaks of Jarasandha to his father and a visitor: the king who cannot be beaten, the army that rolls on. Rukmini, hearing from another room, understands the politics behind the match with Śiśupāla.","why":"Gives Rukmini the political side of the same tale: the kings’ pride in Jarasandha against her wonder at Krishna’s patience.","turn":"Rukmini understands her father will give way.","story":"In the next room, Rukmī is telling his father how big Jarasandha’s army is. He says it as if he were describing his own. The father listens. Rukmini, behind a screen, hears what he is not saying: that the match with Śiśupāla is a way of being on the right side of that army. She understands that her father will give way.","gen":["Political drama","Drama","Thriller"]},{"c":"S-378","src":"E03-15","t":"“Seventeen times”","carrier":true,"ev":3,"evn":"Jarasandha","cat":"D","tier":2,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"Rukmini","pl":"A market in Kuṇḍina","k":"Spoken of, direct","sum":"A soldier home from the north sits with a merchant and Rukmini, who stops to buy flowers. He says: seventeen times they beat him and let him go. She asks why. He cannot say.","why":"Delivers Event 03 as a mystery: the strange patience of the unseen man.","turn":"The soldier says “I do not know” and she smiles.","story":"In the Kuṇḍina market, a soldier back from the north is telling a merchant about the war. Seventeen times, he says, they beat him and let him go. Rukmini is buying flowers. She stops. “Why?” she asks. He cannot say. “I do not know,” he says. She smiles. The soldier does not know what he said that was funny.","gen":["Folk tale","Romance","Comedy of manners"]},{"c":"S-840","src":"E04-01","t":"Thirty million at the gate","carrier":false,"ev":4,"evn":"Dvārakā","cat":"D","tier":4,"mins":"1","mid":1,"rasa":"Bhayānaka","pov":"The water-carrier","pl":"Mathurā","k":"Not present","sum":"As the next round with Jarasandha approaches, a stranger army arrives: Kālayavana, with thirty million barbarian troops. Banners the water-carrier has never seen cover the plain.","why":"Raises the threat beyond the familiar; the two-front problem in one image.","turn":"The new banner appears on the horizon.","story":"The water-carrier is standing at the wall with a bucket when the horizon changes. The banners are not Jarasandha’s. They are a different colour and a different shape, and there are far more of them. Thirty million, someone says on the wall, and no one believes it until the plain is full. The carrier looks at his chalk marks. Then he looks at the new army, and puts the chalk away.","gen":["War","Thriller","Mythological epic"]},{"c":"S-660","src":"E04-02","t":"The two-front dilemma","carrier":false,"ev":4,"evn":"Dvārakā","cat":"D","tier":2,"mins":"2","mid":2,"rasa":"Bhayānaka","pov":"Balarama","pl":"The council room in Mathurā","k":"Spoken of, direct","sum":"Krishna and Balarama see danger from two sides: if Jarasandha comes while they fight Kālayavana, the people will be crushed between them. No option is safe.","why":"A council in which every choice costs someone; sets the cause for Dvārakā.","turn":"A map on the table shows the sea.","story":"The council meets again. There are two enemies and one city. If Jarasandha comes while they fight the Yavana, the people are caught between them. Krishna’s voice goes through the options. One by one, each is shown to fail. Balarama hits the table. A map on the table shows the coast, a small shape on the edge of it, and the sea. The voice stops there.","gen":["Political drama","War","Thriller"]},{"c":"S-619","src":"E04-03","t":"The decision to build","carrier":false,"ev":4,"evn":"Dvārakā","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Adbhuta","pov":"Balarama","pl":"The shore at Ānarta","k":"Shadow or sound","sum":"They decide to build a fortress no enemy can enter, settle the family there, and then deal with Kālayavana. Krishna stands at the shore.","why":"The turn from defence to creation.","turn":"He points to the water.","story":"Krishna goes down to the shore at Ānarta. He stands at the edge of the water with his back to the camera. The wind moves his garment. He looks at the sea for a long time and then raises one hand, and points. The camera goes where the hand points: the sea, flat and empty.","gen":["Mythological epic","Spiritual drama","Western-like"]},{"c":"S-174","src":"E04-04","t":"The city rises from the sea","carrier":false,"ev":4,"evn":"Dvārakā","cat":"D","tier":5,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"The Yadava sailors","pl":"The sea off Ānarta","k":"Effect","sum":"A fortress twelve yojanas around rises from the ocean: gold gateways touching the sky, crystal terraces, jewelled houses, treasuries, stables, watchtowers, temples. Viśvakarmā’s craft shows in every line.","why":"The film’s great spectacle of wonder; the city that becomes the ending’s place.","turn":"The first gate rises from the water.","story":"The first gate rises from the water. Then a wall, then towers, then terraces of crystal and gold. The sea parts and settles around them. Treasuries, stables, watchtowers and temples come up as if they had always been there. The Yādava sailors on the shore stop what they are doing. A woman puts her hand to her mouth. It takes less than a minute, and no one saw anyone build it.","gen":["Mythological epic","Spectacle/wonder","Fantasy"]},{"c":"S-797","src":"E04-05","t":"The gods’ gifts","carrier":false,"ev":4,"evn":"Dvārakā","cat":"D","tier":3,"mins":"1","mid":1,"rasa":"Adbhuta","pov":"Indra","pl":"Dvārakā’s quay and hall","k":"Spoken of, indirect","sum":"Indra gives the Sudharmā hall and the Pārijāta tree; Varuṇa gives swift horses; Kubera his eight treasures. The wealth of the world comes to the sea and none of it is asked for.","why":"The world’s wealth returns to the one who does not seek it; the Pārijāta links back to the Manthana.","turn":"The tree takes root in the courtyard.","story":"The gods come to the new quay with gifts. Indra gives a great assembly hall and a tree in flower. Varuṇa leads out swift horses. Kubera sets down eight treasures and does not look at them. The tree takes root in the central court and its flowers open. They bow, in turn, to an empty seat. No one has asked for any of it.","gen":["Mythological epic","Fantasy","Ceremonial drama"]},{"c":"S-508","src":"E04-06","t":"The great move: waking in Dvārakā","carrier":false,"ev":4,"evn":"Dvārakā","cat":"D","tier":4,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"The potter","pl":"Mathurā; Dvārakā at dawn","k":"Effect","sum":"By yogic power all of Mathurā’s people are carried to Dvārakā in one move. They sleep in Mathurā and wake by the sea: children, cattle, carts, lamps.","why":"A mass-evacuation set-piece with no enemy; wonder and displacement at once.","turn":"A child laughs at the waves.","story":"The city of Mathurā sleeps. In its streets lamps burn low. Somewhere a baby cries and is hushed. A light moves across the roofs, and everything is gone. In Dvārakā at dawn, the people wake in the same beds and carts and arms, and the sound they hear is the sea. A child runs to the edge of the street and laughs at the waves.","gen":["Mythological epic","Fantasy","Wonder/spectacle"]},{"c":"S-719","src":"E04-07","t":"The lone walk from the gate","carrier":false,"ev":4,"evn":"Dvārakā","cat":"D","tier":2,"mins":"2","mid":2,"rasa":"Karuṇa","pov":"A gate guard","pl":"The gate of Dvārakā; the road","k":"Hands","sum":"Krishna, unarmed and wearing a lotus garland, walks out through the city gate while the people sleep in safety. A guard watches him go.","why":"The one man who goes out alone to absorb the threat; the image Rukmini carries of him.","turn":"The gate closes behind him.","story":"The city is asleep, and one man is not. He comes to the gate in a garland of lotuses. He carries no weapon. The guard sees him and does not know what to say. The man nods and goes out. A footprint is left in the dust. The gate closes. The guard stands there a long time.","gen":["Mythological epic","Spiritual drama","Western-like"]},{"c":"S-971","src":"E04-08","t":"The potter’s wheel by the waves","carrier":false,"ev":4,"evn":"Dvārakā","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Śānta","pov":"The potter","pl":"The new quay","k":"Not present","sum":"A potter whose wheel was moved to the new quay sets it by the waves and turns the first pot of the new city.","why":"World-welfare proof for Event 04: a people saved from a two-front war are settled.","turn":"The first pot is lifted.","story":"The potter’s wheel has been moved to the quay. He puts it where the wind comes off the water and spins it with his foot. He wets his hands, puts a ball of clay on the wheel and pulls. The first pot of the new city rises under his hands, rough and uneven. He sets it in the sun and the spray. A passer-by looks and walks on.","gen":["Folk tale","Drama","Spiritual drama"]},{"c":"S-163","src":"E04-09","t":"The sailors’ tale at the ferry","carrier":true,"ev":4,"evn":"Dvārakā","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Adbhuta","pov":"Rukmini","pl":"The river crossing near Kuṇḍina","k":"Spoken of, direct","sum":"A ferryman and two sailors from the coast argue about the city in the sea. One swears he has seen it; one says it is a story. Rukmini, crossing to visit a relative, listens from the back of the boat.","why":"Delivers Event 04 as a travellers’ quarrel; gives her an image of a place she has never seen.","turn":"One sailor describes the lamps lit all night.","story":"A ferry crosses the river near Kuṇḍina. Two sailors from the coast are arguing with the ferryman about a city in the sea. One has seen it, he says. The other says it is a story. The ferryman rows and listens. Rukmini sits at the back of the boat with a basket. One of the sailors describes the lamps that are lit all night along the wall. She does not say anything, but her eyes follow the water.","gen":["Folk tale","Adventure","Romance"]},{"c":"S-131","src":"E04-10","t":"Rukmini imagines the sea","carrier":true,"ev":4,"evn":"Dvārakā","cat":"D","tier":3,"mins":"2","mid":2,"rasa":"Śṛṅgāra","pov":"Rukmini","pl":"Rukmini’s room at night","k":"Not present","sum":"Rukmini has never seen the sea. A painted cloth or a sailor’s sketch shows the city. She traces the walls with her finger, then closes her eyes. The film shows what she imagines: a place as she needs it to be, not as it is.","why":"Gives the ending its comparison: what she imagined against what she finds (E07-02).","turn":"She makes her own picture.","story":"At night in her room, Rukmini unrolls a painted cloth a sailor left behind. It shows a city on the sea. She traces the walls with her finger, then closes her eyes. The film shows what she sees: a place that is half the cloth and half her wish. The sea in it is bigger than any sea. The lamps are warmer. She opens her eyes, and the room is small.","gen":["Romance","Fantasy","Art-house"]},{"c":"S-484","src":"E05-01","t":"Nārada’s marks","carrier":false,"ev":5,"evn":"Mucukunda","cat":"D","tier":2,"mins":"1–2","mid":1.5,"rasa":"Hāsya","pov":"Kālayavana","pl":"Kālayavana’s camp","k":"Spoken of, direct","sum":"Nārada, the mischievous messenger, tells Kālayavana how to know Vāsudeva by his marks: the garland, the mark on the chest, the dark skin. He leaves, smiling.","why":"A precise third-party description by an unreliable messenger; gives the audience a chart of marks without a face.","turn":"Kālayavana repeats the marks aloud.","story":"Nārada walks into Kālayavana’s camp as if he had been invited. He sits down and smiles. He says there is a man Kālayavana should know how to find, and he lists the marks: a garland of lotuses, a curl of hair on the chest, a certain dark colour of skin. He leaves before Kālayavana can ask who sent him. The Yavana repeats the list aloud to himself, as if learning a spell.","gen":["Comedy","Mythological epic","Thriller"]},{"c":"S-851","src":"E05-02","t":"Kālayavana sees the man on foot","carrier":false,"ev":5,"evn":"Mucukunda","cat":"D","tier":2,"mins":"1","mid":1,"rasa":"Vīra","pov":"Kālayavana","pl":"The road outside Mathurā","k":"Hands","sum":"A man walks out of the city, unarmed, wearing a lotus garland. Kālayavana sees the marks Nārada described and recognises him. He dismounts and decides to fight without weapons.","why":"The recognition that starts the chase.","turn":"He drops his weapon.","story":"A man comes out of the gate of Mathurā alone, unarmed, wearing a garland of lotuses. Kālayavana, on the plain, sees him and straightens. He checks the marks against what he was told, one by one. They match. He gets off his horse, takes off his sword and lets it fall. He means to fight with his hands.","gen":["Thriller","Mythological epic","Western-like"]},{"c":"S-937","src":"E05-03","t":"The unarmed chase","carrier":false,"ev":5,"evn":"Mucukunda","cat":"A","tier":4,"mins":"2–3","mid":2.5,"rasa":"Vīra","pov":"Kālayavana","pl":"Across the land to the mountains","k":"Shadow or sound","sum":"Krishna keeps just ahead of Kālayavana, always one step short, across fields and rivers to a mountain cave. Kālayavana taunts him as a coward. Krishna lets it be said.","why":"A chase where th
