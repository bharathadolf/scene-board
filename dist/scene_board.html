కడ నిలిచాయో అక్కడే ఉన్నాయి."},"S-342":{"t":"జరాసంధుని పట్టుకుని విడిచిపెట్టడం","sum":"బలరాముడు జరాసంధుని పట్టుకుని కట్టడం మొదలుపెడతాడు. కృష్ణుని మాట ఆయనను ఆపుతుంది: ఇప్పుడు కాదు, ఒక ప్రయోజనం ఉంది. రాజు విడుదల అవుతాడు.","why":"పెద్ద నైతిక మలుపుతో ఒక చిన్న పోరాటం; కృష్ణుని ప్రయోజనానికి ఎదురుగా బలరాముని ఆత్రుత.","turn":"బలరాముని చేతులు తెరుచుకుంటాయి.","story":"బలరాముడు జరాసంధుని గొంతు పట్టుకుని, మరో చేతిలో తాడు పట్టుకుని ఉంటాడు. అతన్ని కట్టడం మొదలుపెడతాడు. ఫ్రేమ్ అంచున ఒక చెయ్యి లేస్తుంది, ఒక మాట వస్తుంది. బలరాముడు ఆగుతాడు. తాడును చూసి, ఆ చేతిని చూసి, పిడికిలి తెరుస్తాడు. జరాసంధుడు తడబడుతూ వెనక్కి వెళ్లి పరుగెడతాడు. బలరాముడు అసహ్యానికి దగ్గరగా ఏదో భావంతో అతను వెళ్లడం చూస్తాడు."},"S-495":{"t":"దాదాపు తపస్సు","sum":"సిగ్గుతో జరాసంధుడు తపస్సు చేయాలని నిర్ణయించుకుంటాడు. ఇతర రాజులు అతన్ని వారిస్తారు: అతని ఓటమి విధి, వైఫల్యం కాదు. అతను మగధ వైపు తిరిగి వెళ్తాడు.","why":"మారే అవకాశం తిరస్కరించబడింది; నేర్చుకోకుండా తమను తాము ఓదార్చుకునే కూటమి అలవాటు.","turn":"వారు వారిస్తే అతను ఒప్పుకుంటాడు.","story":"జరాసంధుడు కొద్దిమంది సేనానులతో ఒంటరిగా ఇంటికి స్వారీ చేస్తాడు. ఒక నది వద్ద ఆగి, అన్నీ వదిలి తపస్సు చేస్తానంటాడు. అతనితో వచ్చిన ఇతర రాజులు అభ్యంతరం చెబుతారు. ఇది విధి, వైఫల్యం కాదు అంటారు. నది ప్రవహిస్తూనే ఉంటుంది. అతను తన చేతులను చూసుకుని, తరువాత మళ్లీ గుర్రం ఎక్కుతాడు."},"S-370":{"t":"పదిహేడు సార్లు","sum":"ప్రతి ముట్టడి తరువాత ఒక నీళ్లు మోసేవాడు గోడపై ఒక గుర్తు వేస్తాడు. ప్రతిసారీ శత్రువు కొత్త విధంగా వస్తాడు: రాత్రి దాడి, నిప్పు దాడి, ఏనుగుల దాడి, వరద. ప్రతిసారీ ముగింపు ఒకటే. గుర్తులు పదిహేడుకు చేరుతాయి.","why":"విషాదకరమైన పునరావృతం ఒకే చిత్రంలో; నేర్చుకోలేని శత్రువు.","turn":"పదిహేడవ గుర్తు వేయబడుతుంది, దాన్ని అనుసరించే సైన్యం ఉండదు.","story":"మథురలో నీళ్లు మోసేవాని గోడ. పంజాలతో రాత్రి దాడి వస్తుంది, ఉదయానికి మాయమవుతుంది. అతను ఒక గుర్తు వేస్తాడు. మండే బండ్లతో నిప్పు దాడి. ఒక గుర్తు. ఏనుగుల దాడి. ఒక గుర్తు. ముట్టడి గోపురాలు. ఒక గుర్తు. వరద. ఒక గుర్తు. ప్రతిసారీ ముగింపు ఒకేలా ఉంటుంది, ప్రతిసారీ రాజు వదిలివేయబడతాడు. గోడపై పదిహేడు గీతల పొడవు పెరుగుతుంది. చివరిదాని వద్ద ఆ మోసేవాడు వెనక్కి వస్తాడు, దాన్ని అనుసరించే సైన్యం లేదు."},"S-483":{"t":"తిరిగి రావడం, కొల్లగొట్టిన సంపద","sum":"కృష్ణుడు ఉత్సవాల మధ్య, పూల వర్షం మధ్య తిరిగి వస్తాడు. యుద్ధభూమి సంపదను రాజైన ఉగ్రసేనునికి ఇస్తాడు, తాను ఏదీ తీసుకోడు.","why":"ఆయన ఆశలేనితనాన్ని, నగరం యొక్క ఉపశమనాన్ని చూపిస్తుంది.","turn":"రాజు సంపదను స్వీకరిస్తాడు.","story":"కృష్ణుని రథం ద్వారం గుండా తిరిగి వస్తుంది, నగరం పూలు విసురుతుంది. ఉగ్రసేనుడు ముంగిలిలో ఎదురు చూస్తూ ఉంటాడు. ఒక చెయ్యి యుద్ధభూమి సంపదను అందిస్తుంది, రాజు స్వీకరిస్తాడు. మరేదీ తీసుకోబడదు. జనం ఉత్సాహంగా అరుస్తారు, ఒక పిల్లవాడు రథ చక్రాల దగ్గరకు పరుగెత్తి వెనక్కి లాగబడతాడు. ఆ చెయ్యి అప్పటికే వెళ్లిపోయింది."},"S-470":{"t":"కాలినడకన వెంటాడటం","sum":"గుహ తరువాత, యాదవులు సంపదను ద్వారక వైపు తీసుకెళ్తుండగా జరాసంధుడు ఇరవై మూడు అక్షౌహిణులతో తిరిగి వస్తాడు. కృష్ణుడు, బలరాముడు కాలినడకన పరుగెడతారు. జరాసంధుడు నవ్వుతూ వెంబడిస్తాడు.","why":"చివరి వేట; సోదరులు పరారీలో ఉన్నవారిగా; స్వరంలో తలకిందులు.","turn":"వారు దారిని వదిలి ఎక్కడం మొదలుపెడతారు.","story":"యాదవులు సంపదను సముద్రం వైపు తీసుకెళ్తుండగా జరాసంధుడు ఇరవై మూడు అక్షౌహిణులతో తిరిగి వస్తాడు. ఇద్దరు మనుషులు దారిని వదిలి పరుగెడతారు. వారి వెనుక రాజు నవ్వుతూ స్వారీ చేస్తాడు, దారిని నింపే సేనతో. ఇద్దరు మనుషులు చిన్నవవుతారు, సేన కాదు. వారు మైదానం నుంచి తిరిగి ఎక్కడం మొదలుపెడతారు."},"S-231":{"t":"మండుతున్న కొండ","sum":"సోదరులు ప్రవర్షణ కొండను ఎక్కుతారు. జరాసంధుడు వారిని కనుగొనలేక కొండకు నిప్పు పెడతాడు. సైన్యం లేకుండా మండుతున్న పర్వతంపై ఇద్దరు సోదరులు: వారు భయపడే ఏకైక సమయం.","why":"ఇద్దరు సోదరుల అత్యంత కష్టమైన స్థితి; వ్యూహం కాదు, భయం.","turn":"వారికి నేల మిగలదు.","story":"ఆ కొండ పేరు ప్రవర్షణ. మరో దారి లేనందున వారు దాన్ని ఎక్కుతారు. కింద ఉన్న రాజు వారిని కనుగొనలేక కొండపై నిప్పు పెడతాడు. చెట్ల గుండా మంట పైకి పాకుతుంది. ఇద్దరు సోదరులు పొగకు పైన ఎక్కుతారు, పర్వతం మిగలదు. బలరాముడు కిందకు చూస్తాడు. కృష్ణుడు మంటకు వెన్ను చూపుతూ పొగలో ఒక ఆకారంగా నిలుస్తాడు. చిత్రంలో మొదటిసారిగా వారు భయపడతారు."},"S-247":{"t":"దూకడం, తప్పుడు విజయం","sum":"వారు మండుతున్న శిఖరం నుంచి దూకి మాయమవుతారు. వారు చనిపోయారని జరాసంధుడు నమ్మి, తృప్తిగా మగధకు వెళ్తాడు.","why":"విరోధికి తప్పుడు విజయం; అతను తప్పని ప్రేక్షకులకు తెలుసు.","turn":"అతనికి శవాలు కనబడవు, అయినా ఒప్పుకుంటాడు.","story":"వారు దూకుతారు. దృశ్యం మంటల నేపథ్యంలో ఒక ఆకారాన్ని అనుసరించి, నేలకు చేరకముందే ఆగుతుంది. అగ్ని పైకి లేస్తుంది. కింద జరాసంధుడు శవాల కోసం ఎదురు చూస్తాడు. అతనికి ఏవీ కనబడవు. బూడిదలో వారి ఆనవాళ్లు లేవని ఒక సేనాని చెబుతాడు. తాను గెలిచానని అతను నిర్ణయించుకుని ఇంటికి వెళ్తాడు. కొండపై అగ్ని ఆరిపోతుంది."},"S-663":{"t":"జరాసంధుని మెచ్చుకునే రుక్మి (వాహిక)","sum":"రుక్మి తన తండ్రికి, ఒక అతిథికి జరాసంధుని గురించి చెబుతాడు: ఓడించలేని రాజు, ముందుకు సాగే సైన్యం. పక్క గదిలో వింటున్న రుక్మిణి, శిశుపాలునితో సంబంధం వెనుక ఉన్న రాజకీయాన్ని అర్థం చేసుకుంటుంది.","why":"అదే కథకు రాజకీయ వైపును రుక్మిణికి ఇస్తుంది: కృష్ణుని సహనంపై ఆమె ఆశ్చర్యానికి ఎదురుగా జరాసంధునిపై రాజుల గర్వం.","turn":"తన తండ్రి తల వంచుతాడని రుక్మిణి అర్థం చేసుకుంటుంది.","story":"పక్క గదిలో రుక్మి తన తండ్రికి జరాసంధుని సైన్యం ఎంత పెద్దదో చెబుతున్నాడు. అది తనదే అన్నట్లు చెబుతాడు. తండ్రి వింటాడు. తెర వెనుక ఉన్న రుక్మిణి, అతను చెప్పనిదాన్ని వింటుంది: శిశుపాలునితో సంబంధం ఆ సైన్యానికి సరైన వైపున ఉండే మార్గం. తన తండ్రి తల వంచుతాడని ఆమె అర్థం చేసుకుంటుంది."},"S-378":{"t":"“పదిహేడు సార్లు” (వాహిక)","sum":"ఉత్తరం నుంచి ఇంటికి వచ్చిన ఒక సైనికుడు ఒక వర్తకునితో, పూలు కొనడానికి ఆగిన రుక్మిణితో కూర్చుంటాడు. అతను చెబుతాడు: పదిహేడు సార్లు వారు అతన్ని ఓడించి వదిలేశారు. ఆమె ఎందుకు అని అడుగుతుంది. అతను చెప్పలేడు.","why":"మూడవ ఘట్టాన్ని ఒక రహస్యంగా అందిస్తుంది: కనబడని వ్యక్తి యొక్క విచిత్రమైన సహనం.","turn":"సైనికుడు “నాకు తెలియదు” అంటాడు, ఆమె చిరునవ్వు నవ్వుతుంది.","story":"కుండిన సంతలో ఉత్తరం నుంచి తిరిగి వచ్చిన ఒక సైనికుడు వర్తకునికి యుద్ధం గురించి చెబుతున్నాడు. పదిహేడు సార్లు, అంటాడు, వారు అతన్ని ఓడించి వదిలేశారు. రుక్మిణి పూలు కొంటోంది. ఆగుతుంది. “ఎందుకు?” అని అడుగుతుంది. అతను చెప్పలేడు. “నాకు తెలియదు,” అంటాడు. ఆమె నవ్వుతుంది. తాను అన్నదాంట్లో ఏం తమాషా ఉందో సైనికునికి తెలియదు."},"S-840":{"t":"ద్వారం వద్ద మూడు కోట్లు","sum":"జరాసంధునితో తదుపరి దఫా సమీపిస్తుండగా, ఒక అపరిచిత సైన్యం వస్తుంది: కాలయవనుడు, మూడు కోట్ల మ్లేచ్ఛ సైనికులతో. నీళ్లు మోసేవాడు ఎన్నడూ చూడని జెండాలు మైదానాన్ని కప్పేస్తాయి.","why":"ముప్పును పరిచిత స్థాయికి మించి పెంచుతుంది; రెండు వైపుల సమస్య ఒకే చిత్రంలో.","turn":"కొత్త జెండా దిగంతంలో కనిపిస్తుంది.","story":"నీళ్లు మోసేవాడు బొక్కెనతో గోడ వద్ద నిలిచి ఉండగా దిగంతం మారుతుంది. ఆ జెండాలు జరాసంధునివి కావు. అవి వేరే రంగు, వేరే ఆకారం, వాటి సంఖ్య చాలా ఎక్కువ. మూడు కోట్లు, అని గోడపై ఎవరో అంటారు, మైదానం నిండే వరకూ ఎవరూ నమ్మరు. మోసేవాడు తన సుద్ద గుర్తులను చూస్తాడు. తరువాత కొత్త సైన్యాన్ని చూసి, సుద్దను పక్కన పెట్టేస్తాడు."},"S-660":{"t":"రెండు వైపుల సందిగ్ధం","sum":"కృష్ణుడు, బలరాముడు రెండు వైపుల నుంచి ప్రమాదాన్ని చూస్తారు: కాలయవనునితో పోరాడుతుండగా జరాసంధుడు వస్తే ప్రజలు వారిద్దరి మధ్య నలిగిపోతారు. ఏ ఎంపికా సురక్షితం కాదు.","why":"ప్రతి ఎంపికకూ ఎవరో ఒకరు మూల్యం చెల్లించే మంత్రాంగం; ద్వారకకు కారణాన్ని ఏర్పరుస్తుంది.","turn":"బల్లపై ఉన్న పటం సముద్రాన్ని చూపుతుంది.","story":"మంత్రాంగం మళ్లీ సమావేశమవుతుంది. ఇద్దరు శత్రువులు, ఒకే నగరం. కాలయవనునితో పోరాడుతుండగా జరాసంధుడు వస్తే ప్రజలు వారిద్దరి మధ్య చిక్కుకుంటారు. కృష్ణుని స్వరం ఎంపికలను ఒక్కొక్కటిగా చెబుతుంది. ప్రతి ఒక్కటీ విఫలమవుతుందని చూపిస్తుంది. బలరాముడు బల్లపై కొడతాడు. బల్లపై ఉన్న పటంలో తీరం, దాని అంచున ఒక చిన్న ఆకారం, సముద్రం కనిపిస్తాయి. స్వరం అక్కడే ఆగుతుంది."},"S-619":{"t":"నిర్మించాలనే నిర్ణయం","sum":"ఏ శత్రువూ ప్రవేశించలేని కోటను నిర్మించి, కుటుంబాన్ని అక్కడ స్థిరపరిచి, తరువాత కాలయవనుని ఎదుర్కోవాలని నిర్ణయించుకుంటారు. కృష్ణుడు తీరంలో నిలుస్తాడు.","why":"రక్షణ నుంచి సృష్టికి మలుపు.","turn":"ఆయన నీటి వైపు చూపుతాడు.","story":"కృష్ణుడు ఆనర్తంలోని తీరానికి వెళ్తాడు. కెమెరాకు వీపు చూపుతూ నీటి అంచున నిలుస్తాడు. గాలి ఆయన వస్త్రాన్ని కదిలిస్తుంది. చాలాసేపు సముద్రాన్ని చూసి, ఒక చేతిని ఎత్తి చూపుతాడు. కెమెరా ఆ చెయ్యి చూపినచోటికి వెళ్తుంది: సముద్రం, చదునుగా, ఖాళీగా."},"S-174":{"t":"సముద్రం నుంచి నగరం పైకి లేస్తుంది","sum":"పన్నెండు యోజనాల చుట్టుకొలత గల కోట సముద్రం నుంచి లేస్తుంది: ఆకాశాన్ని తాకే బంగారు ద్వారాలు, స్ఫటిక మిద్దెలు, రత్నాల ఇళ్లు, ఖజానాలు, గుర్రపుశాలలు, కావలి గోపురాలు, ఆలయాలు. ప్రతి గీతలోనూ విశ్వకర్మ నైపుణ్యం కనిపిస్తుంది.","why":"చిత్రంలో అద్భుతపు మహా దృశ్యవైభవం; ముగింపు జరిగే స్థలమయ్యే నగరం.","turn":"మొదటి ద్వారం నీటి నుంచి లేస్తుంది.","story":"మొదటి ద్వారం నీటి నుంచి లేస్తుంది. తరువాత ఒక గోడ, తరువాత గోపురాలు, తరువాత స్ఫటికం, బంగారంతో మిద్దెలు. సముద్రం విడిపోయి వాటి చుట్టూ స్థిరపడుతుంది. ఖజానాలు, గుర్రపుశాలలు, కావలి గోపురాలు, ఆలయాలు ఎప్పుడూ అక్కడే ఉన్నట్లు పైకి వస్తాయి. తీరంలోని యాదవ నావికులు చేస్తున్న పని ఆపుతారు. ఒక స్త్రీ నోటికి చెయ్యి అడ్డు పెట్టుకుంటుంది. ఒక నిమిషం కన్నా తక్కువ పడుతుంది, ఎవరూ ఎవరినీ నిర్మిస్తుండగా చూడలేదు."},"S-797":{"t":"దేవతల కానుకలు","sum":"ఇంద్రుడు సుధర్మ సభను, పారిజాత వృక్షాన్ని ఇస్తాడు; వరుణుడు వేగవంతమైన గుర్రాలను; కుబేరుడు తన ఎనిమిది నిధులను. లోక సంపద అంతా సముద్రం వద్దకు వస్తుంది, అందులో ఏదీ అడగబడలేదు.","why":"లోక సంపద కోరనివారి వద్దకు తిరిగి వస్తుంది; పారిజాతం మథనంతో ముడిపడుతుంది.","turn":"చెట్టు ముంగిలిలో వేళ్లూనుతుంది.","story":"దేవతలు కొత్త రేవు వద్దకు కానుకలతో వస్తారు. ఇంద్రుడు ఒక పెద్ద సభా మందిరాన్ని, పూలు విరిసిన ఒక చెట్టును ఇస్తాడు. వరుణుడు వేగవంతమైన గుర్రాలను నడిపించుకు వస్తాడు. కుబేరుడు ఎనిమిది నిధులను కింద పెట్టి వాటి వైపు చూడడు. చెట్టు మధ్య ముంగిలిలో వేళ్లూనుతుంది, దాని పూలు విరుస్తాయి. వారు ఒకరి తరువాత ఒకరు ఖాళీ ఆసనానికి నమస్కరిస్తారు. వీటిలో దేన్నీ ఎవరూ అడగలేదు."},"S-508":{"t":"మహా తరలింపు: ద్వారకలో మేల్కొనడం","sum":"యోగశక్తితో మథుర ప్రజలందరూ ఒకే క్షణంలో ద్వారకకు చేర్చబడతారు. వారు మథురలో నిద్రపోయి సముద్రం ఒడ్డున మేల్కొంటారు: పిల్లలు, పశువులు, బండ్లు, దీపాలు.","why":"శత్రువు లేని సామూహిక తరలింపు ఘట్టం; ఆశ్చర్యం, నిరాశ్రయత ఒకేసారి.","turn":"ఒక పిల్లవాడు అలలను చూసి నవ్వుతాడు.","story":"మథుర నగరం నిద్రపోతుంది. వీధుల్లో దీపాలు మసకగా వెలుగుతాయి. ఎక్కడో ఒక శిశువు ఏడుస్తుంది, ఊరడింపబడుతుంది. ఒక కాంతి పైకప్పుల మీదుగా కదులుతుంది, అంతా మాయమవుతుంది. వేకువలో ద్వారకలో, ప్రజలు అవే పడకలలో, అవే బండ్లలో, అవే చేతుల్లో మేల్కొంటారు, వారికి వినిపించే శబ్దం సముద్రం. ఒక పిల్లవాడు వీధి అంచుకు పరుగెత్తి అలలను చూసి నవ్వుతాడు."},"S-719":{"t":"ద్వారం నుంచి ఒంటరి నడక","sum":"నిరాయుధుడై, తామర మాల ధరించిన కృష్ణుడు ప్రజలు సురక్షితంగా నిద్రిస్తుండగా నగర ద్వారం గుండా బయటకు నడుస్తాడు. ఒక కావలివాడు ఆయన వెళ్లడం చూస్తాడు.","why":"ముప్పును తనలో ఇముడ్చుకోవడానికి ఒంటరిగా బయటకు వెళ్లే ఏకైక వ్యక్తి; రుక్మిణి ఆయన గురించి మోసే చిత్రం.","turn":"ద్వారం ఆయన వెనుక మూసుకుంటుంది.","story":"నగరం నిద్రపోతోంది, ఒక్క వ్యక్తి తప్ప. ఆయన తామర మాలతో ద్వారం వద్దకు వస్తాడు. ఆయుధం లేదు. కావలివాడు ఆయనను చూసి ఏం చెప్పాలో తెలియక ఉండిపోతాడు. ఆయన తల ఊపి బయటకు వెళ్తాడు. దుమ్ములో ఒక అడుగు గుర్తు మిగులుతుంది. ద్వారం మూసుకుంటుంది. కావలివాడు చాలాసేపు అక్కడే నిలబడి ఉంటాడు."},"S-971":{"t":"అలల పక్కన కుమ్మరి చక్రం","sum":"కొత్త రేవుకు చక్రం తరలించబడిన ఒక కుమ్మరి దాన్ని అలల పక్కన ఉంచి కొత్త నగరపు మొదటి కుండను తిప్పుతాడు.","why":"నాలుగవ ఘట్టానికి లోక క్షేమ రుజువు: రెండు వైపుల యుద్ధం నుంచి రక్షించబడిన ప్రజలు స్థిరపడతారు.","turn":"మొదటి కుండ పైకి ఎత్తబడుతుంది.","story":"కుమ్మరి చక్రం రేవుకు తరలించబడింది. నీటి నుంచి గాలి వచ్చే చోట ఆయన దాన్ని పెట్టి, కాలితో తిప్పుతాడు. చేతులు తడిపి, చక్రంపై మట్టి ముద్ద పెట్టి లాగుతాడు. కొత్త నగరపు మొదటి కుండ ఆయన చేతుల కింద, గరుకుగా, అసమానంగా పైకి లేస్తుంది. దాన్ని ఎండలో, తుంపరలో పెడతాడు. అటుగా వెళ్లేవాడు చూసి నడిచి వెళ్తాడు."},"S-163":{"t":"రేవు వద్ద నావికుల కథ (వాహిక)","sum":"ఒక పడవవాడు, తీరం నుంచి వచ్చిన ఇద్దరు నావికులు సముద్రంలోని నగరం గురించి వాదించుకుంటారు. ఒకడు చూశానని ప్రమాణం చేస్తాడు; మరొకడు అది కథ మాత్రమే అంటాడు. బంధువును చూడడానికి దాటుతున్న రుక్మిణి పడవ వెనుక నుంచి వింటుంది.","why":"నాలుగవ ఘట్టాన్ని ప్రయాణికుల వాదనగా అందిస్తుంది; ఆమె ఎన్నడూ చూడని ప్రదేశం యొక్క చిత్రాన్ని ఇస్తుంది.","turn":"ఒక నావికుడు రాత్రంతా వెలిగే దీపాలను వర్ణిస్తాడు.","story":"కుండిన దగ్గర నదిలో ఒక పడవ దాటుతోంది. తీరం నుంచి వచ్చిన ఇద్దరు నావికులు సముద్రంలోని ఒక నగరం గురించి పడవవాడితో వాదిస్తున్నారు. తాను చూశానని ఒకడు అంటాడు. అది కథ మాత్రమే అని మరొకడు అంటాడు. పడవవాడు తెడ్డు వేస్తూ వింటాడు. రుక్మిణి ఒక బుట్టతో పడవ వెనుక కూర్చుని ఉంది. నావికుల్లో ఒకడు గోడ వెంట రాత్రంతా వెలిగే దీపాలను వర్ణిస్తాడు. ఆమె ఏమీ అనదు, కానీ ఆమె కళ్లు నీటిని అనుసరిస్తాయి."},"S-131":{"t":"రుక్మిణి సముద్రాన్ని ఊహిస్తుంది (వాహిక)","sum":"రుక్మిణి ఎన్నడూ సముద్రాన్ని చూడలేదు. ఒక చిత్రించిన వస్త్రం లేదా నావికుడి స్కెచ్ నగరాన్ని చూపుతుంది. ఆమె వేలితో గోడలను తడుముతుంది, తరువాత కళ్లు మూసుకుంటుంది. ఆమె ఊహించేది చిత్రం చూపుతుంది: ఉన్నట్లుగా కాదు, ఆమెకు కావలసిన విధంగా ఉన్న ప్రదేశం.","why":"ముగింపుకు పోలికను ఇస్తుంది: ఆమె ఊహించినది, ఆమె కనుగొన్నదానికి ఎదురుగా (E07-02).","turn":"ఆమె తన సొంత చిత్రాన్ని తయారుచేసుకుంటుంది.","story":"రాత్రివేళ తన గదిలో రుక్మిణి ఒక నావికుడు వదిలి వెళ్లిన చిత్రించిన వస్త్రాన్ని విప్పుతుంది. అది సముద్రంలోని ఒక నగరాన్ని చూపుతుంది. వేలితో గోడలను తడుముతుంది, తరువాత కళ్లు మూసుకుంటుంది. ఆమె చూసేదాన్ని చిత్రం చూపిస్తుంది: సగం వస్త్రం, సగం ఆమె కోరిక అయిన ఒక స్థలం. అందులో సముద్రం ఏ సముద్రం కన్నా పెద్దది. దీపాలు వెచ్చగా ఉన్నాయి. ఆమె కళ్లు తెరుస్తుంది, గది చిన్నదిగా ఉంది."},"S-484":{"t":"నారదుని గుర్తులు","sum":"కొంటె సందేశకుడైన నారదుడు, వాసుదేవుని గుర్తుల ద్వారా ఎలా గుర్తించాలో కాలయవనునికి చెబుతాడు: మాల, ఛాతీపై గుర్తు, నల్లని చర్మం. నవ్వుతూ వెళ్లిపోతాడు.","why":"నమ్మలేని సందేశకుని ద్వారా మూడవ వ్యక్తి ఖచ్చితమైన వర్ణన; ముఖం లేకుండా గుర్తుల పట్టికను ప్రేక్షకులకు ఇస్తుంది.","turn":"కాలయవనుడు ఆ గుర్తులను పైకి పునరావృతం చేస్తాడు.","story":"నారదుడు ఆహ్వానించబడినట్లే కాలయవనుని శిబిరంలోకి నడిచి వస్తాడు. కూర్చుని చిరునవ్వు నవ్వుతాడు. కాలయవనుడు గుర్తించే విధానం తెలుసుకోవలసిన ఒక వ్యక్తి ఉన్నాడని చెబుతాడు, గుర్తులను చెబుతాడు: తామర మాల, ఛాతీపై ఒక వెంట్రుకల వంపు, ఒక నిర్దిష్టమైన నల్లని చర్మపు రంగు. తనను ఎవరు పంపారని కాలయవనుడు అడగకముందే ఆయన వెళ్లిపోతాడు. యవనుడు ఒక మంత్రాన్ని నేర్చుకుంటున్నట్లు ఆ జాబితాను తనకు తాను గట్టిగా పునరావృతం చేస్తాడు."},"S-851":{"t":"కాలినడకన ఉన్న వ్యక్తిని కాలయవనుడు చూస్తాడు","sum":"నిరాయుధుడై, తామర మాల ధరించిన ఒక వ్యక్తి నగరం నుంచి బయటకు నడుస్తాడు. నారదుడు వర్ణించిన గుర్తులను కాలయవనుడు చూసి ఆయనను గుర్తిస్తాడు. గుర్రం దిగి, ఆయుధాలు లేకుండా పోరాడాలని నిర్ణయించుకుంటాడు.","why":"వేటను మొదలుపెట్టే గుర్తింపు.","turn":"అతను ఆయుధాన్ని పడేస్తాడు.","story":"మథుర ద్వారం నుంచి ఒక వ్యక్తి ఒంటరిగా, ఆయుధం లేకుండా, తామర మాల ధరించి బయటకు వస్తాడు. మైదానంలో ఉన్న కాలయవనుడు ఆయనను చూసి నిటారుగా అవుతాడు. తనకు చెప్పినదానితో గుర్తులను ఒక్కొక్కటిగా సరిచూస్తాడు. అవి సరిపోతాయి. గుర్రం దిగి, కత్తిని తీసివేసి కింద పడనిస్తాడు. చేతులతో పోరాడాలని అనుకుంటాడు."},"S-937":{"t":"ఆయుధం లేని వేట","sum":"కృష్ణుడు కాలయవనునికి ఎప్పుడూ ఒక్క అడుగు ముందు ఉంటాడు, ఎప్పుడూ ఒక్క అడుగు దూరంలో, పొలాలు, నదులు దాటి ఒక పర్వత గుహ వరకూ. కాలయవనుడు ఆయనను పిరికివాడని ఎగతాళి చేస్తాడు. కృష్ణుడు ఆ మాటలను అనుమతిస్తాడు.","why":"వేటాడబడేవాడే వేటగాడయ్యే వేట; చర్యగా సహనం; ఇతరులను కాపాడడానికి అంగీకరించిన అవమానం.","turn":"కొండలు దగ్గరవుతాయి.","story":"కాలయవనుడు పరుగెడతాడు, ఆయనను పట్టుకోలేడు. ముందున్న వ్యక్తి ఎప్పుడూ ఒక్క అడుగు దూరంలో ఉంటాడు. వారు ఒక పొలం, ఒక నది, ఒక గట్టు దాటుతారు. కాలయవనుడు ఆయనపై అరుస్తాడు: పిరికివాడా, పారిపోయేవాడా, పోరాడనివాడా. ఆ వ్యక్తి తిరగడు. వారి వెనుక సైన్యం వెనకబడుతుంది, దేశం మరింత కఠినంగా మారుతుంది. కొండలు దగ్గరవుతాయి. ముందు రాతిలో ఒక చీకటి తెరిచిన ద్వారం ఉంది."},"S-668":{"t":"గుహ, నిద్రిస్తున్న వ్యక్తి","sum":"కృష్ణుడు ఒక గుహలోకి ప్రవేశిస్తాడు. కాలయవనుడు చీకటిలోకి అనుసరించి నిద్రిస్తున్న ఒక మనిషిని చూస్తాడు. కృష్ణుడు నిద్ర నటిస్తున్నాడని అనుకుని దగ్గరకు వెళ్తాడు.","why":"ఉచ్చు: నిద్రిస్తున్న వ్యక్తి, గర్విష్ఠుడైన చొరబాటుదారుడు ఉన్న ఒక గది.","turn":"అతను కాలు ఎత్తుతాడు.","story":"గుహ చీకటిగా ఉంది, చాలా లోతుకు వెళ్తుంది. కాలయవనునికి ముందు ఒక సన్నని ఆకారం లోపలికి జారి, ఒక రాతి వెనుక మాయమవుతుంది. కాలయవనుడు రొప్పుతూ అనుసరిస్తాడు. చివరి భాగంలో, మసక వెలుగు ప్రాంతంలో, ఒక మనిషి నిద్రిస్తూ ఉంటాడు. అతని ఛాతీ కొద్దిగా మాత్రమే కదులుతోంది. ఒక మాయను వెంటాడుతున్న కాలయవనుడు, మరొకరిగా అనుకున్నదాన్ని చూస్తాడు. నిద్రిస్తున్న వ్యక్తి వద్దకు నడిచి కాలు ఎత్తుతాడు."},"S-973":{"t":"తన్ను, బూడిద","sum":"కాలయవనుడు నిద్రిస్తున్న వ్యక్తిని తంతాడు. ముచుకుందుడు కోపంతో మేల్కొని అతని వైపు చూస్తాడు. కాలయవనుడు బూడిదైపోతాడు.","why":"ఆయుధం లేని, నిశ్శబ్దమైన, భయపెట్టే ఒక చిన్న పోరాటం; గర్వపు చర్య మండే ఏదో ఒకదాన్ని నిద్రలేపుతుంది.","turn":"నిద్రిస్తున్న వ్యక్తి కళ్లు తెరుచుకుంటాయి.","story":"తన్ను తగులుతుంది. ముచుకుందుని కళ్లు తెరుచుకుంటాయి. అతను కోపంగా ఉన్నాడు, తనను నిద్రలేపినదాని వైపు చూస్తాడు. అర్ధ క్షణం ఏమీ ఉండదు. తరువాత అతని కళ్ల నుంచి వెలుగు గుహను నింపుతుంది. అది తేటపడ్డాక నేలపై బూడిద ఆకారం మాత్రమే మిగులుతుంది. ముచుకుందుడు నెమ్మదిగా లేచి కూర్చుంటాడు. ఒక రాతి వెనుక ఎవరో ఎదురు చూస్తున్నారు."},"S-515":{"t":"నిద్రించిన రాజు (ముచుకుందుని గతం)","sum":"ఇక్ష్వాకు వంశ రాజైన ముచుకుందుడు అసురులపై దేవతల పక్షాన పోరాడాడు. వరం ఇస్తామన్నప్పుడు, తనను లేపినవారిని కాల్చే శక్తితో, భంగం లేని నిద్రను కోరాడు. కార్తికేయుడు సేనాధిపతి అయినప్పుడు, ఆయన సేవ నుంచి విడుదలై మోక్షం కన్నా నిద్రను ఎంచుకున్నాడు.","why":"ఐదవ ఘట్టాన్ని మథనానికి కలుపుతుంది; యుగాలు నిద్రించే ప్రదేశంగా గుహ.","turn":"అతను కళ్లు మూసుకుంటాడు.","story":"చాలా కాలం క్రితం, ముచుకుందుడు రాక్షసులపై దేవతల పక్షాన పోరాడాడు, బాగా పోరాడాడు. యుద్ధం యుగాల పాటు సాగింది. చివరికి ఒక వరం ఇవ్వబడింది, అతను నిద్రను కోరాడు. నన్ను ఎవరూ లేపవద్దు, లేపినవారు దహనమవ్వాలి, అన్నాడు. ఒక గుహను కనుగొని పడుకున్నాడు. దేవతలు అతనికి స్వేచ్ఛ ఇచ్చినప్పుడు కూడా అతను నిద్రనే ఎంచుకున్నాడు. దృశ్యం మూడు చిత్రాలలో చెప్పబడుతుంది: ఒక యుద్ధం, ఒక ఒప్పందం, కళ్లు మూసుకోవడం."},"S-345":{"t":"ముచుకుందుడు ఆయనను చూస్తాడు","sum":"ఒక ఆకారం వెలుగులోకి అడుగు పెడుతుంది. యుగాలు నిద్రించిన రాజైన ముచుకుందుడు, అలౌకిక తేజస్సు గల ఒక వ్యక్తిని చూసి ఇదే పరమాత్ముడా అని ఆశ్చర్యపోతాడు. ఆయన ముఖమే ఈ మొత్తం దృశ్యం.","why":"విస్మయం చెందిన ముఖం ద్వారా కృష్ణుని అత్యంత స్వచ్ఛమైన చిత్రణ; ప్రకాశ పద్ధతి అతి చిన్న స్థాయిలో.","turn":"అతను వంగి నమస్కరిస్తాడు.","story":"ఒక ఆకారం వెలుగులోకి అడుగు పెడుతుంది. ముచుకుందుడు గుహ నేలపై కూర్చుని పైకి చూస్తాడు. అతనికి ఆయన తెలియదు, అయినా తెలుసు. ఎడమ వైపు నుంచి ఎక్కడి నుంచో అతని ముఖంపై వెలుగు పడుతుంది, అతని భావం మారుతుండగా కెమెరా అతనిపైనే ఉంటుంది: ఆశ్చర్యం, సందేహం, గుర్తింపు, దుఃఖం లాంటి ఏదో. అతని పెదవులు కదులుతాయి. తల వంచుతాడు. వృద్ధ ముఖంపై ఒక కన్నీరు జారుతుంది. కృష్ణుని చిత్రణను చిత్రం ప్రేక్షకులకు వాగ్దానం చేసింది, ఇదే అది."},"S-871":{"t":"“నా జన్మలు అసంఖ్యాకాలు”","sum":"ముచుకుందుడు ఆయన ఎవరని అడుగుతాడు. ఒక స్వరం చెబుతుంది: నా జన్మలు అసంఖ్యాకాలు; ఈ యుగంలో ధర్మాన్ని రక్షించడానికి వసుదేవుని కుమారుడిగా వచ్చాను; కంసుని చంపాను; నీ చూపు కాలయవనుని కాల్చింది; నువ్వు ఒకప్పుడు నా కోసం ప్రార్థించినందువల్ల నేను వచ్చాను.","why":"తన గురించి ఆయన చెప్పుకోవడం, నమ్మే వ్యక్తి విన్నది; చిత్రం అనుమతించే గుర్తింపు ప్రకటనకు అతి దగ్గరది.","turn":"అతనికి గర్గుని భవిష్యవాణి గుర్తుకు వస్తుంది.","story":"ముచుకుందుడు ఆయన ఎవరని అడుగుతాడు. వెలుగు నుంచి ఒక స్వరం బదులిస్తుంది. నా జన్మలు అసంఖ్యాకాలు, అంటుంది. ఈ యుగంలో ధర్మాన్ని రక్షించడానికి వసుదేవుని కుమారుడిగా వచ్చాను. కంసుని చంపాను. నీ చూపు యవనుని కాల్చింది, నువ్వు ఒకప్పుడు నా కోసం ప్రార్థించినందువల్ల నేను వచ్చాను. ప్రతి వాక్యం తగులుతుండగా ముచుకుందుని ముఖం మారుతుంది. అతనికి గర్గుడనే ఒక వృద్ధ ముని, ఈ రోజు గురించి ఆయన చెప్పినది గుర్తుకు వస్తాయి."},"S-640":{"t":"ముచుకుందుని స్తుతులు","sum":"ముచుకుందుడు ప్రార్థిస్తాడు: లౌకిక సుఖం యొక్క భ్రమ, మానవ జన్మ యొక్క అరుదైనతనం, రాజ్యం యొక్క వ్యర్థం, పాములా మృత్యువు, అధికారపు నిరర్థకత, సజ్జన సాంగత్యంతో విముక్తి. అతను సేవ మాత్రమే అడుగుతాడు.","why":"మొత్తం సమూహంలో భగవంతుని అత్యంత సన్నిహిత చిత్రణ; విస్మయం చెందిన సాక్షి మాట్లాడతాడు.","turn":"అతను దేన్నీ అడగడు.","story":"ముచుకుందుని ప్రార్థన పొడవైనది, చిత్రం దాన్ని అలాగే సాగనిస్తుంది. లౌకిక సుఖం ఒక కల అని, మానవ జన్మ అరుదైనదని, తాను దాన్ని ఒక రాజ్యం కోసం గడిపానని, అది తెలియలేదని అంటాడు. అధికారం ముగిసిపోయేది అని, మృత్యువు పాములా వస్తుందని అంటాడు. ఒకే ఒక్కటి అడుగుతాడు: భగవంతుని తెలిసిన వారికి దగ్గరగా ఉండడం. కెమెరా అతని ముఖంపైనే ఉంటుంది, దానిపై వెలుగు కదలదు."},"S-589":{"t":"పరీక్ష, త్యాగం","sum":"కృష్ణుడు వరాలు ఇస్తానంటాడు. ముచుకుందుడు ప్రతి ఒక్కటీ తిరస్కరిస్తాడు. కృష్ణుడు అతని స్థిరత్వాన్ని మెచ్చుకుని, ఆ ప్రతిపాదన ఒక పరీక్ష అని చెబుతాడు.","why":"తాను చూసిన సత్యం కోసం సంపదను వదిలేసిన మనిషి; రుక్మిణి విన్నపానికి ఒక వెలుగు.","turn":"అతను “ఏమీ వద్దు” అంటాడు.","story":"భగవంతుడు ఏదైనా ఇస్తానంటాడు. ముచుకుందుడు ఆలోచించి, ఏమీ వద్దంటాడు. మళ్లీ ఇస్తానంటారు. అతను తల ఊపుతాడు. ఏమీ అడగడు. నవ్వులా వినిపించే ఏదో స్వరం పలుకుతుంది. ఇది ఒక పరీక్ష అని, అతను నెగ్గాడని అంటుంది. ముచుకుందునికి పట్టినట్లు లేదు. అతను నమస్కరిస్తాడు."},"S-557":{"t":"ముని ఉత్తరం వైపు నడుస్తాడు","sum":"ముచుకుందుడు గుహ నుంచి బయటకు వచ్చి, యుగం మారిందని గ్రహించి, హరిని ఆరాధించడానికి బదరికాశ్రమం వైపు ఉత్తరానికి నడుస్తాడు.","why":"తాను మేల్కొన్న లోకాన్ని ఒక మనిషి వదిలి వెళ్తాడు; సాక్షి నిష్క్రమిస్తాడు.","turn":"అతను ఒకసారి వెనక్కి చూస్తాడు.","story":"ముచుకుందుడు గుహ నుంచి పగటి వెలుగులోకి వస్తాడు. చాలా కాలంగా అతను దాన్ని చూడలేదు. మొక్కలను, ఆకాశాన్ని, ప్రజలను చూస్తాడు. లోకం మారిందని, యుగం కూడా మారిందని గ్రహిస్తాడు. ఉత్తరం వైపు తిరిగి నడుస్తాడు. ఒక ఎత్తు చివర ఒకసారి వెనక్కి చూసి, ముందుకు సాగుతాడు."},"S-881":{"t":"యవన సైన్యం నాశనం","sum":"కృష్ణుడు మథురకు తిరిగి వచ్చి, మ్లేచ్ఛ సైన్యాన్ని నాశనం చేసి, దాని సంపదను ద్వారక వైపు పంపుతాడు.","why":"సారాంశ ఘట్టం: రెండవ ముట్టడి ముగుస్తుంది.","turn":"ద్వారం తెరుచుకుంటుంది.","story":"మథుర ద్వారం తెరుచుకుంటుంది. బయట, మైదానం యవన సైన్యంతో నిండి ఉంటుంది, తరువాతి దృశ్యంలో దాదాపు ఖాళీగా. శిథిలాలు, నిశ్శబ్దం ఉంటాయి. చనిపోయిన సైన్యపు సంపదను బండ్లలో ఎక్కించి సముద్రం వైపు దారిలో పంపుతారు. గోడపై నీళ్లు మోసేవాడు తన సుద్ద గుర్తులను చూసి, చివరిదాని కింద ఒక గీత గీస్తాడు."},"S-659":{"t":"మేకల కాపరి, పొగ","sum":"పర్వతం దగ్గర మందను మేపుతున్న ఒక మేకల కాపరి గుహ నుంచి పొగ, తరువాత ఒక ముని వెళ్లడం చూస్తాడు. ముట్టడి తొలగాక, మేకలు తిరిగి దారిపై నడుస్తాయి.","why":"ఐదవ ఘట్టానికి లోక క్షేమ రుజువు.","turn":"మేకలు దారిపైకి నడుస్తాయి.","story":"ఒక మేకల కాపరి, అతని మంద పర్వతపు వాలుపై మేస్తున్నారు. అతను గుహ నుంచి పొగను చూసి మేకలను దూరంగా తీసుకువెళ్తాడు. తరువాత ఉత్తరం వైపు నడుస్తున్న ఒక వృద్ధుడిని చూస్తాడు. ముట్టడి తొలగిందనే వార్త వచ్చినప్పుడు, మేకలను దారి వైపు నడిపిస్తాడు, అవి ఏమీ జరగనట్లే దానిపైకి నడుస్తాయి."},"S-906":{"t":"కాపరి కథ (వాహిక)","sum":"ఒక కాపరి స్నేహితునికి చెబుతాడు: ఒక యవనుడు ఒక మనిషి వెంట పరుగెత్తాడు, పొగ మాత్రమే బయటకు వచ్చింది. కుండ నింపుతున్న రుక్మిణి వింటుంది. ఏ మనిషి అని అడుగుతుంది. అతనికి తెలియదు. ఆమెకు మాల, ఒంటరి నడక (E04-07) గుర్తుకు వస్తాయి.","why":"ఐదవ ఘట్టాన్ని పుకారుగా అందిస్తుంది; రుక్మిణికి ఆయన గురించి ఆమె సొంత చిత్రాన్ని ఇస్తుంది: ఒంటరిగా బయటకు నడిచే వ్యక్తి.","turn":"ఆయన మాల వేసుకున్నాడా అని ఆమె అడుగుతుంది.","story":"కుండిన దగ్గర బావి వద్ద ఒక కాపరి స్నేహితునితో అంటాడు: ఒక యవనుడు ఒక మనిషి వెంట గుహలోకి పరుగెత్తాడు, పొగ మాత్రమే బయటకు వచ్చింది. కుండ నింపుతున్న రుక్మిణి ఆగుతుంది. “ఏ మనిషి?” అతనికి తెలియదు. “ఆయన మాల వేసుకున్నాడా?” కావచ్చు అంటాడు. రుక్మిణి వెళ్లడానికి తిరుగుతుంది, కుండ ఉండవలసినదాని కన్నా తేలికగా ఉంది."},"S-237":{"t":"అంబికా వద్ద ప్రార్థన పఠనం (వాహిక)","sum":"ఒక పూజారి రుక్మిణి తల్లికి, రుక్మిణికి ముచుకుందుని ప్రార్థనను పఠిస్తాడు: ఆయనను చూశాక రాజ్యాన్ని వదిలిన రాజు. వింటున్న రుక్మిణి చాలాసేపు మౌనంగా ఉంటుంది.","why":"ఆయనను నిజంగా చూసిన వ్యక్తి చెప్పిన, ఐదవ ఘట్టంలోని అత్యంత సన్నిహిత వృత్తాంతాన్ని అందిస్తుంది.","turn":"దాన్ని మళ్లీ చెప్పమని ఆమె పూజారిని అడుగుతుంది.","story":"అంబికా ఆలయంలో ఒక పూజారి రుక్మిణి తల్లికి, రుక్మిణికి పఠిస్తాడు. యుగాలు నిద్రించి, మేల్కొని, ఏమీ అడగని ఒక రాజు గురించి చెబుతాడు. ప్రార్థన ఆయన స్వరంలో, నెమ్మదిగా, ఖచ్చితంగా ఉంటుంది. రుక్మిణి చాలాసేపు ఏమీ అనదు. తరువాత దాన్ని మళ్లీ చెప్పమని పూజారిని అడుగుతుంది."},"S-702":{"t":"నారదుని గుర్తులు రుక్మిణికి చేరతాయి (వాహిక)","sum":"కబుర్లు చెప్పుకునే ఒక అతిథి, నారదుడు కాలయవనునికి ఇచ్చినట్లే వాసుదేవుని గుర్తించే గుర్తులను చెబుతాడు. రుక్మిణి చెలికత్తె నవ్వుతుంది; రుక్మిణి తాను విన్నదానితో ప్రతి గుర్తును సరిచూసుకుంటుంది.","why":"మూడవ వ్యక్తి ఇచ్చిన ఖచ్చితమైన వర్ణనకు చిత్రం అత్యంత దగ్గరగా వచ్చే చోటు; అలాగే E06-18కి ప్రేక్షకుల పట్టిక.","turn":"ఆమె ఒక గుర్తు గురించి అడుగుతుంది, అతిథి సమాధానం చెప్పలేకపోతాడు.","story":"రాజభవనానికి వచ్చిన ఒక అతిథి కృష్ణుని గురించి కబుర్లు చెబుతున్నాడు. తాను విన్నట్లే గుర్తులను చెబుతాడు. చెలికత్తె ఒకదానికి నవ్వుతుంది. రుక్మిణి ప్రశాంతంగా, దాదాపు తనలో తాను అనుకుంటూ, ప్రతిదాన్ని తాను విన్నదానితో సరిచూసుకుంటుంది: ఇది సరైనది, అది కాదు. అతిథి కాస్త నొచ్చుకుని ఆగుతాడు. రుక్మిణి నవ్వుతుంది. అతను తప్పుగా చెప్పిన ఒక వివరం ఉంది, ఆమెకు తెలుసు."},"S-438":{"t":"కథనానికి చట్రాన్ని ఇచ్చే ప్రశ్న","sum":"ఇది రాక్షస వివాహం అని విన్న పరీక్షిత్తు, కృష్ణుడు రుక్మిణిని ఎలా పొందాడని శుకుని అడుగుతాడు. శుకుడు ప్రారంభిస్తాడు. చిత్రం యొక్క రూపంలో ఒక బంటు కవి శ్రోత ప్రశ్నకు బదులిస్తాడు: “ఆయన ఆమెను ఎత్తుకుపోయాడంటారు.”","why":"“హరణం” అనే అభ్యంతరానికి రుక్మిణి ఎంపిక ద్వారా చిత్రం జవాబు చెప్పడానికి వీలిచ్చే చట్రం.","turn":"బంటు కవి అంటాడు: “లేఖ రాసింది ఆమె.”","story":"రాత్రివేళ చలిమంట, దాని చుట్టూ ఒక చిన్న గుంపు. ఒక శ్రోత తాను విన్నదాన్ని బంటు కవిని అడుగుతాడు: కృష్ణుడు ఒక రాజు కుమార్తెను ఎత్తుకుపోయాడని. కవి మంటలోకి చూస్తాడు. “అలా అంటారు,” అంటాడు. “ఆమె ముందుగా ఆయనకు రాసిందని వారు చెప్పరు.” శ్రోత అడగడానికి నోరు తెరుస్తాడు, కవి కథ మొదలుపెడతాడు. మంట కుండినలో ఒక ఉదయంలోకి కరిగిపోతుంది."},"S-407":{"t":"సభలో పాటలు","sum":"అతిథులు కృష్ణుని గుణాలను, సౌందర్యాన్ని, పరాక్రమాన్ని పాడతారు. సభ అంచున వింటున్న రుక్మిణి, ఆయనే సరైన భర్త అని నిర్ణయించుకుంటుంది. మరొకచోట ఆయన ఆమెను సరైన భార్యగా నిర్ణయిస్తాడు.","why":"ఆయన గురించి ఆమె చిత్రణకు మొదటి, అతి ముఖ్యమైన మూలం; చిత్రం యొక్క ప్రేరేపక కోరిక.","turn":"ఆమె నిర్ణయించుకుంటుంది.","story":"తండ్రి సభలో అతిథులు పాడతారు. మొదటివాడు ఆయన పరాక్రమాన్ని, రెండవవాడు ఆయన కలిసిన దేవతలను, మూడవవాడు ఆయన సౌందర్యాన్ని పాడతారు. రుక్మిణి గ్యాలరీ నుంచి చేతిని కటకటాలపై ఉంచి వింటుంది. ఆయన ముఖం గురించి వారు ఏకీభవించరు, కానీ మూడు పాటల్లోనూ ఒకే వ్యక్తి నడుస్తాడు. చివరి గాయకుడు ఆగినప్పుడు, ఆమె తన మనసు స్థిరపడిందని గ్రహిస్తుంది. ఆమె కదలదు. మరొక నగరంలో, ఎవరో తన మనసును స్థిరపరచుకున్నాడు."},"S-164":{"t":"సభ నిర్ణయిస్తుంది","sum":"కృష్ణునికి శత్రువైన రుక్మి కుటుంబపు మొగ్గును అడ్డుకుని శిశుపాలునితో సంబంధాన్ని ఏర్పాటు చేస్తాడు. కృష్ణుని వైపు మొగ్గు చూపే భీష్మకుడు కొడుకు మీద ప్రేమతో తల వంచుతాడు. రుక్మిణి నిరాకరించబడుతుంది.","why":"ప్రేరేపక సంఘటన: ఆమె ఎంపికను, ఆమెను రక్షించాల్సిన వ్యక్తే రద్దు చేస్తాడు.","turn":"ఆమె తండ్రి తల వంచుతాడు.","story":"రుక్మి ఇంటి వారంతా ఉండగా సంబంధం వార్తను తెస్తాడు. శిశుపాలుని తండ్రితో దాన్ని నిర్ణయించాడు. తనకు ఇతర కోరికలు ఉన్నాయని రుక్మిణి అంటుంది. ఆమె ఉద్దేశించిన గోపాలుని గురించి తాను ఏమనుకుంటున్నాడో రుక్మి చెబుతాడు. ఆమె తన తండ్రిని చూస్తుంది. భీష్మకుడు కిందకు చూస్తాడు. కొడుకును ప్రేమిస్తాడు, ఆమె అది చూస్తుంది. రుక్మి మాట్లాడుతూనే ఉంటాడు. ఆమె ఏడవదు. దృశ్యం ఆమె మౌనంపై ముగుస్తుంది."},"S-958":{"t":"సిరా","sum":"బాధపడిన రుక్మిణి నమ్మకమైన ఒక బ్రాహ్మణుని కృష్ణుని వద్దకు పంపుతుంది. ఆమె లేఖ రాస్తుంది: నేను నిన్ను ఎంచుకున్నాను; వివేకవతి అయిన ఏ కన్య మరొకరిని ఎంచుకోదు; నువ్వు రాకపోతే నేను ప్రాణం విడుస్తాను; రహస్యంగా రా; పథకం ఆలయ ఊరేగింపు. దాన్ని మూసివేసి ఆయనకు ఇస్తుంది.","why":"ఆమె మొదటి చర్య, చిత్రం యొక్క మొదటి మలుపు: పథకాన్ని మోసే, వెనక్కి తీసుకోలేని, క్రియాశీల ఎంపిక.","turn":"ఆమె దాన్ని మూసి ఇచ్చేస్తుంది.","story":"ఆమె రాత్రి కూర్చుని సిరాను బయటకు తీస్తుంది. రాజులకు లేఖలు ఎలా రాయాలో ఆమెకు నేర్పబడింది. ఒకరికి రాస్తుంది. ప్రతి వాక్యం ఆమెకు ఖరీదైనదే. ఆయనను ఎంచుకున్నానని చెబుతుంది. వివేకవతి అయిన ఏ కన్యా మరొకరిని ఎంచుకోదని చెబుతుంది. రోజును చెబుతుంది, ఎలా చేయవచ్చో వివరిస్తుంది. ఆయన రాకపోతే ప్రాణం విడిచి మరుజన్మలో మళ్లీ ప్రయత్నిస్తానని చెబుతుంది. దాన్ని మూసి, బ్రాహ్మణుని పిలిపించి అతని చేతిలో పెడుతుంది."},"S-354":{"t":"బ్రాహ్మణుని ప్రయాణం","sum":"బ్రాహ్మణుడు ఆ లేఖను పొడవైన దారిలో తీసుకెళ్తాడు: ఒక కావలి కేంద్రం, ఒక నది దాటడం, రుక్మి పంపిన ఒక వెంటాడేవాడు. ప్రతి ఒక్కటీ ఒక చిన్న పరీక్ష; ఆ లేఖ బంగారం కన్నా బరువైనదని అతను అనుకుంటాడు.","why":"సామాన్యుడు కథానాయకుడుగా ఉన్న యాక్షన్; మధ్యభాగపు ప్రధాన పాత్రగా వాహకుడు.","turn":"అతను లేఖను పొడిగా ఉంచి నదిని దాటుతాడు.","story":"బ్రాహ్మణుడు వేకువకు ముందే లేఖను వస్త్రంలో దాచుకుని బయలుదేరుతాడు. ఒక కావలి కేంద్రం వద్ద సైనికుడు అతని పని ఏమిటని అడుగుతాడు, బ్రాహ్మణుడు తీర్థయాత్ర గురించి ఏదో చెబుతాడు. నది పొంగి ఉంది, బ్రాహ్మణుడు రెట్టింపు ఇచ్చే వరకూ పడవవాడు దాటించడానికి నిరాకరిస్తాడు. అతని వెనుక దారిలో ఒక రౌతు కనిపిస్తాడు. అతను వేగంగా నడుస్తాడు, తరువాత నెమ్మదిగా, రౌతు దాటి వెళ్తాడు. తరువాతి గ్రామంలో బ్రాహ్మణుడు లేఖను తీసి అది పొడిగా ఉందో లేదో చూసుకుంటాడు."},"S-705":{"t":"ద్వారకలో బ్రాహ్మణుడు (చెప్పబడిన దృశ్యం)","sum":"బ్రాహ్మణుడు స్వీకరించబడి, గౌరవించబడి, భోజనం పెట్టబడతాడు. కృష్ణుడు ఆయన పాదాలు ఒత్తుతూ, ఆయన క్షేమం, కర్తవ్యాలు, రాజు గురించి అడిగి, సహాయం చేస్తానంటాడు. బ్రాహ్మణుడు అంతా చెప్పి లేఖను చదువుతాడు. త్వరగా నిర్ణయించమని కృష్ణుని కోరతాడు.","why":"దూత పాదాలు ఒత్తే వ్యక్తి యొక్క నిజాయితీ చిత్రణ; ఆలయం ముందు ఉన్న ఏకైక ప్రత్యక్ష సాక్షి వృత్తాంతం.","turn":"కృష్ణుడు లేఖను చదివి చిరునవ్వు నవ్వుతాడు.","story":"బ్రాహ్మణుడిని ఒక మందిరంలోకి తెచ్చి కూర్చోబెడతారు. ఎవరో అతని పాదాలు కడుగుతారు, అది సేవకుడు కాదు. చేతులు: వెచ్చగా, జాగ్రత్తగా. ఒక స్వరం అతని ప్రయాణం గురించి, అతని కర్తవ్యాల గురించి, అతని రాజు ప్రజలను కాపాడుతున్నాడా అని, అతనికి ఏమైనా కావాలా అని అడుగుతుంది. రోజుల తరబడి ఒక ప్రసంగాన్ని సాధన చేసిన బ్రాహ్మణుడు దాన్ని మరచిపోతాడు. అతను లేఖను తీసి గట్టిగా చదువుతాడు. పూర్తయ్యాక, త్వరగా నిర్ణయించమని భగవంతుడిని కోరతాడు."},"S-793":{"t":"రాత్రి ప్రయాణం","sum":"కృష్ణుడు పెళ్లి సమయం విని రథాన్ని ఆజ్ఞాపిస్తాడు; దారుకుడు తెస్తాడు. ఆయన, బ్రాహ్మణుడు ఒకే రాత్రిలో ఆనర్తం నుంచి విదర్భకు ప్రయాణిస్తారు: చీకటి దారి, గిట్టల శబ్దం, వేకువ వెలుగు.","why":"కనిపించకుండా సస్పెన్స్: కనబడని వ్యక్తి దారిలో ఉన్నాడు.","turn":"విదర్భ మైదానంలో వేకువ విరుస్తుంది.","story":"ఆయన పెళ్లి సమయం చదివి, రథాన్ని పిలుస్తాడు, రెండోసారి చెప్పించుకోడు. దారుకుడు దాన్ని తెస్తాడు. బ్రాహ్మణుడు ఎక్కుతాడు. వారు చీకటిలో బయలుదేరుతారు. దారి చక్రాల కింద కదులుతుంది, నక్షత్రాలు తిరుగుతాయి, గుర్రాలు నెమ్మదించవు. రాత్రిలో ఎక్కడో బ్రాహ్మణుడు కళ్లు మూసుకుంటాడు. తెరిచేసరికి తూర్పున ఒక బూడిదరంగు గీత, విదర్భ మైదానం ఉన్నాయి."},"S-108":{"t":"వధువును సిద్ధం చేయడం","sum":"భీష్మకుడు శిశుపాలుని పెళ్లికి సిద్ధపడతాడు. నగరం శుభ్రం చేయబడి అలంకరించబడుతుంది, క్రతువులు జరుగుతాయి, కానుకలు ఇవ్వబడతాయి. రుక్మిణికి స్నానం చేయించి అలంకరిస్తారు: బంధనంగా ఆచారం.","why":"ఊపిరాడని స్థితి: ఆమె కోరుకోని పెళ్లికి అలంకరించబడుతుంది.","turn":"ఆమె దుస్తుల మడతలో ఏదో దాచుకుంటుంది.","story":"నగరం శుభ్రం చేయబడి పూలతో అలంకరించబడుతుంది. పురోహితులు మంత్రాలు చదువుతారు. కానుకలు ఇస్తారు. అంతఃపురంలో రుక్మిణికి స్నానం చేయించి, ఆమె కదలలేనంతగా దుస్తులు, ఆభరణాలు ధరింపజేస్తారు. గాజులు ఆమె మణికట్టు చుట్టూ బిగుసుకుంటాయి. ప్రతి ఆభరణం ఒక బంధం. ఒక చెలికత్తె అద్దం పట్టుకుంటుంది. అందులో ఉన్న అపరిచితురాలిని చూసి, దుస్తుల మడతలో ఏదో జారవిడుస్తుంది."},"S-741":{"t":"రాజులు సమావేశమై ప్రమాణం చేస్తారు","sum":"దమఘోషుడు సైన్యంతో వస్తాడు; జరాసంధుడు, శాల్వుడు, దంతవక్త్రుడు, విదూరథుడు, పౌండ్రకుడు, వేలాది రాజులు శిశుపాలుని మిత్రులుగా వచ్చి, కృష్ణుడు వధువును ఎత్తుకుపోతే పోరాడతామని ప్రమాణం చేస్తారు.","why":"మారణకాండ అంచున ఉన్న నగరం; రాజుల కూటమి కనిపించేలా; కుండినలో భూభారం.","turn":"ప్రమాణం గట్టిగా చేయబడుతుంది.","story":"రాజులు పొడవైన వరుసగా వస్తారు. దమఘోషుడు సైన్యంతో వస్తాడు, తరువాత జరాసంధుడు, తరువాత శాల్వుడు, దంతవక్త్రుడు, విదూరథుడు, పౌండ్రకుడు, ప్రతి ఒక్కరూ ఒక పరివారంతో. సభలో వారు కలిసి, తరువాత విడివిడిగా ప్రమాణం చేస్తారు: కృష్ణుడు ఆమెను ఎత్తుకుపోవడానికి వస్తే, మేము ఆయనతో పోరాడతాము. రుక్మిణి ఒక కిటికీ నుంచి అది వింటుంది. జెండాలను లెక్కిస్తుంది. లెక్కించలేనన్ని ఉన్నాయి."},"S-121":{"t":"బలరాముడు వస్తాడు","sum":"సంఘర్షణకు భయపడి, తమ్ముని మీద ప్రేమతో బలరాముడు పెద్ద సైన్యంతో కుండినకు హడావుడిగా వస్తాడు.","why":"అడగకుండానే ఒక సైన్యాన్ని పంపే అన్న ప్రేమ.","turn":"ఆయన కవాతుకు ఆజ్ఞ ఇస్తాడు.","story":"బలరామునికి ఎవరూ చెప్పలేదు. రాజులు సమావేశమవుతున్నారని, తన తమ్ముడు ఒంటరిగా వెళ్లాడని విని, సైన్యాన్ని సమకూరుస్తాడు. పెద్ద బలగంతో వెంటనే బయలుదేరుతాడు. దారిలో ఆయన మౌనంగా ఉంటాడు. ఒక సేనాని ఏదైనా ఇబ్బంది ఉందా అని అడుగుతాడు. ఉంటుంది అంటాడు. సైన్యం మధ్యాహ్నమంతా ముందుకు సాగుతుంది."},"S-922":{"t":"ఎదురు చూపు","sum":"సమయం దగ్గరపడుతోంది. కృష్ణుడు, బ్రాహ్మణుడు ఇంకా రాలేదు. ఆమె కారణాలను ఊహిస్తుంది: బ్రహ్మ లేదా శివుని కోపం కూడా; సమయం ఇంకా దాటలేదని తనను తాను ఓదార్చుకుంటుంది.","why":"అత్యల్ప బిందువు: ఆశ భయంగా మారడం.","turn":"ఆమె తాను భయపడే దేవతలకే ప్రార్థిస్తుంది.","story":"సమయం దగ్గరపడింది, బ్రాహ్మణుడు ఇంకా తిరిగి రాలేదు. పెళ్లి దుస్తుల్లో రుక్మిణి తన గదిలో కూర్చుని ఎదురు చూస్తుంది. ఆయన ఎప్పటికీ చేరలేదని, లేఖ తిరస్కరించబడిందని, దేవతలు తనపై కోపంగా ఉన్నారని, తాను ఎక్కువ అడిగానని ఊహిస్తుంది. ప్రతి కారణాన్ని వరుసగా ఆలోచిస్తుంది. దీపం తక్కువగా మండుతుంది. ఒక చెలికత్తె భోజనం తెచ్చి తిరిగి తీసుకెళ్తుంది. తాను భయపడే దేవతలనే ప్రార్థించడం మొదలుపెడుతుంది."},"S-430":{"t":"శకునాలు, చిరునవ్వు","sum":"ఆమె ఎడమ కన్ను, చేయి, తొడ అదురుతాయి: శుభ సూచన. కృష్ణుని సందేశంతో, వాగ్దానంతో బ్రాహ్మణుడు నవ్వుతూ, ఆనందంగా లోపలికి వస్తాడు.","why":"భయం విరిగిపోతుంది; ఆమె లేఖకు జవాబు ఒక నివేదికగా వస్తుంది.","turn":"అతను మాట్లాడకముందే నవ్వుతూ లోపలికి నడుస్తాడు.","story":"ఆమె ఎడమ కన్ను అదురుతుంది, తరువాత చేయి, తరువాత తొడ. దీన్ని నమ్మాలో లేదో ఆమెకు తెలియదు. కొద్ది క్షణాల తరువాత తలుపు తెరుచుకుంటుంది, బ్రాహ్మణుడు నవ్వుతూ లోపలికి వస్తాడు. కాసేపు అతను ఏమీ అనడు, అదే చాలు. తరువాత ఆపుకోలేడు. తాను చూసినదాన్ని చెబుతాడు: సముద్రంలోని నగరం, బంగారు ద్వారాలు, దీపాలు. ఆయనే స్వయంగా తన పాదాలు కడిగాడని చెబుతాడు. తనకు కూడా నిద్ర పట్టలేదని ఆయన అన్నాడని చెబుతాడు. రుక్మిణి నవ్వుతుంది, తరువాత ఏడుస్తుంది."},"S-896":{"t":"అతిథులను స్వీకరిస్తున్న భీష్మకుడు","sum":"రుక్మిణి బ్రాహ్మణునికి నమస్కరిస్తుంది. భీష్మకుడు కృష్ణ బలరాములను గౌరవంగా స్వీకరించి, ఇతర రాజులను హోదా ప్రకారం ఆతిథ్యం ఇస్తాడు.","why":"తండ్రి నిశ్శబ్ద దుఃఖం, ఆతిథ్యం; కుటుంబపు చీలిన విధేయత.","turn":"ఆయన కృష్ణునికి స్వాగతం పలుకుతాడు.","story":"రాజభవన ద్వారం వద్ద భీష్మకుడు ఇద్దరు అతిథుల కోసం ఎదురు చూస్తాడు. తన కార్యదర్శిని ముందే పంపాడు, తానే కిందకు వెళ్తాడు. ఆయన ముఖమే కథ చెబుతుంది: ఉపశమనం, భయం, కృతజ్ఞత ఒకేసారి. అతిథులు వస్తారు; కెమెరా ఆయనపైనే ఉంటుంది. ఆయన నమస్కరిస్తాడు. వారిని కుడి చేత్తో లోపలికి నడిపిస్తాడు, జనం వెనుక మూసుకుంటారు. తాను ఏం చేశాడో, దాని మూల్యం ఏమిటో ఆయనకు తెలుసు."},"S-944":{"t":"నగర ప్రజల కోరిక","sum":"పౌరులు కృష్ణుని చూసి రుక్మిణి ఆయనను పెళ్లాడాలని తమ పుణ్యాన్ని అర్పిస్తారు.","why":"వధువు ఎంపిక కోసం ఒక నగరమంతా తన పుణ్యాన్ని అర్పిస్తుంది; ఆమె వినగలిగే బహిరంగ ఆశ.","turn":"ఒక స్త్రీ ఆమె కిటికీ వైపు ఒక మాలను ఎత్తుతుంది.","story":"ఆమె కిటికీ కింద వీధిలో, పౌరులు ఆమె చూడలేని ఎవరినో చూస్తున్నారు. వారు నెమ్మదిగా మాట్లాడుకుంటారు. ఒక స్త్రీ మాలను ఎత్తి పట్టుకుంటుంది. ఆమె ఆయనను పెళ్లాడగలిగితే తన పుణ్యాన్ని ఇస్తానని ఒక వృద్ధుడు అంటాడు. ఒక పిల్లవాడు అదే మాటను, కొంచెం గట్టిగా అంటాడు. వీధి దాన్ని గుసగుసలుగా అందుకుంటుంది. తెర వెనుక ఉన్న రుక్మిణి అంతా వింటుంది, చూడదు."},"S-420":{"t":"కాపలా ఊరేగింపు","sum":"రుక్మిణి తల్లులు, స్నేహితులు, సంగీతకారులు, బంటు కవులతో కలిసి, డప్పులు, శంఖాలు, కొమ్ముల మధ్య కాపలాగా అంబికా ఆలయానికి వెళ్తుంది. సైనికుల వలయం ఆమెను చుట్టుముడుతుంది.","why":"ఆచారం ద్వారా తప్పించుకోవడం: పథకం ఒక ఉత్సవంగా మొదలవుతుంది.","turn":"ఆమె ఆలయ గుమ్మం దాటి అడుగు పెడుతుంది.","story":"ఆమె రాజభవనం నుంచి ఆలయానికి వెళ్తుంది, చుట్టూ సైనికుల వలయంతో. తల్లులు ముందు నడుస్తారు, స్నేహితులు వెనుక. సంగీతకారులు వాయిస్తారు, శంఖాలు మోగుతాయి, బంటు కవులు పాత కథలను నెమ్మదిగా పాడతారు, వారిలో ఒకడు, మెల్లగా, ప్రతి అభ్యర్థినీ దాటిన దేవి గురించిన కథను పాడతాడు. సైనికులు ఆయన రాక సంకేతాల కోసం దారిని గమనిస్తారు. ఆమె నేరుగా ముందుకు చూస్తుంది. ఆలయ ద్వారం చివరన ఉంది."},"S-802":{"t":"అంబికకు ప్రార్థన","sum":"ఆమె స్నానం చేసి, లోపలికి ప్రవేశించి, బ్రాహ్మణ స్త్రీల ఆరాధనలో నడిపించబడి, కృష్ణుడు తన భర్త కావాలని ప్రార్థించి, ఆశీర్వాదాలు, ప్రసాదం అందుకుంటుంది. ఆమె వెనుక ఆలయ గోడపై మథన ఫలకాలు ఉన్నాయి.","why":"శివుని విషాన్ని పట్టుకున్న దేవి ఆలయంలో మౌన విన్నపం; ఆయనను తప్ప మరేదీ ఆమె అడగదు.","turn":"ఆమె విగ్రహం నుంచి తన కళ్లు పైకి ఎత్తుతుంది.","story":"ఆమె స్నానం చేసి, లోపలికి ప్రవేశించి, దేవి ముందు మోకరిల్లుతుంది. ఆలయ స్త్రీలు ఆమెను ఆరాధన ద్వారా నడిపిస్తారు. ఆమె తాను అడగడానికి వచ్చినదాన్ని అడుగుతుంది. తనను రక్షించమని అడగదు. తాను ఎంచుకున్నదాన్ని భరించగలిగే శక్తిని అడుగుతుంది. దేవి కళ్లు చిత్రించబడ్డాయి, చేతులు తెరిచి ఉన్నాయి. ఆమె వెనుక గోడపై విషం, కంఠం ఫలకం ఉంది. ఆశీర్వాదాలను, ప్రసాదాన్ని తీసుకుని లేచి నిలుస్తుంది."},"S-279":{"t":"మౌనాన్ని విడిచిపెడుతుంది","sum":"ఆమె తన మౌన వ్రతాన్ని విడిచి, చెలికత్తె నడిపించగా, ఆమెను చూసి నివ్వెరపోయిన రాజుల మధ్యకు నడుస్తుంది.","why":"ఆమె స్వరం, బహిరంగ చర్య; పతాక ఘట్టపు మొదటి అడుగు.","turn":"ఆమె మాట్లాడుతుంది.","story":"ఆమె స్నేహితులు వెనుక ఉండగా ఆలయ ద్వారం నుంచి బయటకు వస్తుంది. ఒక చెలికత్తె ఆమె చెయ్యి పట్టుకుంటుంది. ఆమె మౌన వ్రతాన్ని విడిచి ఎవరికీ వినిపించనిది ఏదో అంటుంది. తరువాత నెమ్మదిగా ముంగిలిలోకి రాజుల మధ్య నడుస్తుంది. వారు వధువు దాటి వెళ్లడం కోసం ఎదురు చూస్తున్నారు. మాట్లాడడం ఆపేస్తారు. ఒకరు గిన్నె జారవిడుస్తారు. ఆమె వారిని వస్తువులన్నట్లు దాటి నడుస్తుంది."},"S-449":{"t":"మొదటి చూపు","sum":"ఆమె సిగ్గుతో ముందుకు వచ్చి రాజుల వైపు చూపులు విసురుతుంది. కృష్ణుని చూసి ఆయన రథం ఎక్కడానికి ఆతృత పడుతుంది.","why":"చివరికి గుర్తింపు; చిత్రమంతా ఆలస్యం చేసిన క్షణం; ఒకే ఘట్టంలో తలకిందులు, గుర్తింపు.","turn":"ఆమె కళ్లు ఆయనను కనుగొంటాయి.","story":"ఆమె కళ్లు దించుకుని రాళ్లపై నడుస్తుంది. తరువాత పైకెత్తి ఆయనను చూస్తుంది. కెమెరా ఆమెదే. ఆయన ముంగిలి అంచున రథంలో నిలబడి ఉన్నాడు. ఆయన ఏ పాటా కాదు, అన్ని పాటలూ. గాయకులు ఎందుకు ఏకీభవించలేదో ఆమె చూస్తుంది: ప్రతి ఒక్కరూ ఆయనను వేరే వెలుగులో పట్టుకున్నారు. ఇప్పుడు ఈ ఒక్కటే ఉంది. చిత్రమంతా నిలిపి ఉంచిన నీలం వెలుగు వచ్చేస్తుంది. ఎవరూ ఆయన పేరు చెప్పరు."},"S-615":{"t":"ఎత్తుకోవడం","sum":"ఆయన శత్రువుల ఎదుటే ఆమెను పట్టుకుని రథంపైకి ఎత్తుతాడు. ఆమె ఎంచుకుంది: ఆమె ఇష్టపూర్వకంగా వెళ్తుంది.","why":"ఒకేసారి పట్టుకోవడం, ఎంచుకోవడం: తీసుకుపోబడడాన్ని ఆమె ఎంచుకుంటుంది. చిత్ర ఇతివృత్తం ఒక చర్యలో.","turn":"ఆమె పాదం నేలను విడుస్తుంది.","story":"ఆమె ఎక్కే వరకూ ఆయన ఎదురు చూడడు. ప్రతి రాజు ఎదుట ఆమెను తన చేతుల్లోకి తీసుకుని పక్కన కూర్చోబెడతాడు. రథం కుదుపుకు గురవుతుంది. ఆమె పాదం అప్పటికే పలకపై ఉంది. దారుకుని చేతులు కళ్లెంపై ఉన్నాయి. అర్ధ క్షణం ఏం జరిగిందో ఎవరికీ అర్థం కాదు. ఆమె తిరిగి తన వెనుక ఉన్న ముఖాలను చూస్తుంది, ఆలయం వైపు వెనక్కి చూడదు."},"S-413":{"t":"రాజుల వలయం గుండా","sum":"బలరాముడు ముందు నడిపిస్తుండగా, నక్కల నుంచి తన ఆహారాన్ని తీసుకుపోయే సింహంలా ఆయన రాజుల వలయం గుండా రథాన్ని నడుపుతాడు. శంఖం మోగుతుంది.","why":"ఎత్తిన తరువాత శక్తి విడుదల; రాజుల అవమానం కనిపించేలా.","turn":"వలయం విరిగిపోతుంది.","story":"రథం నక్కల గుండా సింహంలా రాజుల వలయం గుండా వెళ్తుంది. బలరాముని సైనికులు ముందు దారి తెరుస్తారు. శంఖం పొడవుగా, స్పష్టంగా మోగుతుంది. రాజులు కత్తులు దూయడానికి చాలా ఆలస్యం అవుతుంది. రుక్మిణి కటకటాలను పట్టుకుని కిందకు చూడదు. ముందు దారి తెరుచుకుంటుంది. ఆమె వెనుక నూరు గుర్రాలు ఒకేసారి తిరుగుతాయి."},"S-190":{"t":"కూటమి విలాపం","sum":"జరాసంధుడు మరియు ఇతరులు సహించలేరు. “కేవలం గోపాలురు” తమ గౌరవాన్ని తీసుకుపోయారని విలపిస్తారు. శిశుపాలుడు పెళ్లికొడుకు వస్త్రాల్లో నిలబడి ఉంటాడు.","why":"రాజుల అవమానం; ఓడిపోయినవారి వైపు నుంచి అరుదైన దృశ్యం.","turn":"శిశుపాలుడు తన ఖాళీ చేతులను చూసుకుంటాడు.","story":"రథం ఉన్న చోటే రాజులు నిలబడి ఉంటారు. గోపాలురు తమను దోచుకున్నారని జరాసంధుడు అంటాడు. దంతవక్త్రుడు ప్రమాణం చేస్తాడు. శాల్వుడు తన చేతులను చూసుకుంటాడు. వారి మధ్యలో, మెడలో ఇంకా మాలతో, పెళ్లికొడుకు వస్త్రాల్లో శిశుపాలుడు నిలబడి ఉన్నాడు. వధువు నడిచిన ఖాళీ నేలను చూస్తాడు. ఎవరూ అతనికి ఏమీ చెప్పరు."},"S-753":{"t":"వెంటాడటం, యాదవుల రక్షణ","sum":"ఆగ్రహించిన రాజులు ఆయుధాలు ధరించి వెంటాడతారు. యాదవ సేనానులు వారిని ఎదుర్కోవడానికి తిరుగుతారు. బాణాలు పడతాయి; రుక్మిణి తన భర్త సైన్యం గురించి భయపడుతుంది. కృష్ణుని స్వరం ఆమెకు ధైర్యం చెబుతుంది: మీ వైపు వారు త్వరలోనే వారిని నాశనం చేస్తారు. గదుడు, సంకర్షణుడు మరియు ఇతరులు గుర్రాలను, ఏనుగులను, రథాలను కూల్చేస్తారు.","why":"ఆమె ఎంపిక యొక్క మొదటి పరీక్ష: తన కోసం వచ్చిన వారి గురించి ఆమె భయపడుతుంది.","turn":"యాదవ వరుస నిలుస్తుంది.","story":"రాజులు ఆయుధాలు ధరించి వెంటాడతారు. రథం వెనుక యాదవ సేనానులు తిరిగి వారిని ఎదుర్కొంటారు. బాణాలు వర్షంలా పడతాయి. అవి పడడం చూసి రుక్మిణి మొదటిసారి తన కోసం చనిపోతున్న మనుషుల గురించి ఆలోచిస్తుంది. ఆమె పక్కన ఒక స్వరం నెమ్మదిగా, ఆమె వైపు వారు త్వరలోనే వారిని నాశనం చేస్తారని అంటుంది. ఆమె చూస్తుంది. వారి వెనుక గుర్రాలు కూలుతాయి, ఏనుగులు తిరుగుతాయి, వెంటాడటం ముక్కలవుతుంది."},"S-905":{"t":"శిశుపాలుని ఓదార్చే జరాసంధుడు","sum":"జరాసంధుడు తన వైపు నాశనమవడం చూసి వెనక్కి తగ్గుతాడు. నిరాశలో ఉన్న శిశుపాలుని ఓదార్చుతాడు: గెలుపు, ఓటమి కాలం, విధి ఆధీనంలో ఉంటాయి; కాలం తిరిగినప్పుడు రాజులు గెలుస్తారు. వారు ఇళ్లకు వెళ్తారు.","why":"పరువు నిలబెట్టుకునే మార్గంగా తత్వం; కూటమి తనను తాను ఓదార్చుకునే అలవాటు.","turn":"శిశుపాలుడు ఓదార్పును అంగీకరిస్తాడు.","story":"రాజులు యుద్ధభూమి నుంచి ముక్కలుగా వస్తారు. జరాసంధుడు ఖాళీ చేతులతో నిలబడిన శిశుపాలుని చూస్తాడు. అతనితో కొడుకుతో మాట్లాడినట్లు మాట్లాడతాడు. గెలుపు, ఓటమి కాలం, విధికి చెందినవి అంటాడు. కాలం తిరుగుతుంది, తిరిగినప్పుడు మనం గెలుస్తాం. శిశుపాలుడు విని తల ఊపుతాడు. రాజులు ఇళ్లకు వెళ్తారు. వారు వెళ్లాక కూడా కెమెరా కొద్దిసేపు దారిపైనే ఉంటుంది."},"S-697":{"t":"రుక్మి ప్రమాణం","sum":"సహించలేని రుక్మి ఒక దళంతో వెంటాడి, కృష్ణుని చంపి తన చెల్లెలిని తిరిగి తెచ్చే వరకూ కుండినలో మళ్లీ ప్రవేశించనని రాజుల ఎదుట ప్రతిజ్ఞ చేస్తాడు.","why":"అతనికి సొంత ఇంటిని మూసేసే బహిరంగ ప్రతిజ్ఞ; వ్యక్తిగత ప్రత్యర్థి యొక్క శిఖరం.","turn":"అతను ప్రమాణం చేస్తాడు.","story":"రుక్మి సహించలేడు. రాజుల ఎదుట తన గుర్రంపై తిరిగి, ఆ గోపాలుని చంపి చెల్లెలిని తిరిగి తెచ్చే వరకూ కుండినలో మళ్లీ అడుగు పెట్టనని ప్రమాణం చేస్తాడు. రాజులు చూస్తారు. అతను ఒక దళాన్ని పోగు చేసి ఒంటరిగా రథం వెంట వెళ్తాడు. అతని వెనుక ఎవరూ ఆపడానికి ప్రయత్నించరు."},"S-713":{"t":"ద్వంద్వ యుద్ధం","sum":"రుక్మి దాడి చేస్తాడు. కృష్ణుడు అతని ప్రతి విల్లును విరుస్తాడు, అతని ఆయుధాలను, డాలును నాశనం చేస్తాడు. రుక్మి కత్తితో కిందకు దూకుతాడు; కృష్ణుడు దాన్ని ముక్కలు చేసి, అతన్ని చంపడానికి తన కత్తిని సిద్ధం చేస్తాడు. రుక్మిణి తాను ప్రేమించే ఇద్దరు పురుషులు ఒకరినొకరు చంపుకోవడానికి ప్రయత్నించడం చూస్తుంది.","why":"అన్నదమ్ముల పోరు, అన్న వర్సెస్ భర్త; కృష్ణుడు చర్య తీసుకునే అత్యంత పొడవైన దృశ్యం.","turn":"కత్తి పైకి ఎత్తబడుతుంది.","story":"రుక్మి వచ్చి చేరతాడు. అతను దాడి చేస్తాడు, కృష్ణుడు అతని విల్లును విరుస్తాడు. మరొకటి తీసుకుంటాడు, అదీ విరుగుతుంది. మూడోది తీసుకుంటాడు. ఆయుధం తరువాత ఆయుధం, డాలు తరువాత డాలు, రుక్మి చేతిలో కత్తితో కిందకు దూకే వరకూ. కృష్ణుడు దాన్ని ముక్కలు చేస్తాడు. తన కత్తిని తిప్పుతాడు. రథంలో ఉన్న రుక్మిణి, తాను ప్రేమించే ఇద్దరు పురుషులు ముగింపు వైపు కదలడం చూస్తుంది."},"S-703":{"t":"విన్నపం","sum":"రుక్మిణి కృష్ణుని పాదాలపై పడి తన అన్న ప్రాణాల కోసం వేడుకుంటుంది. ఆయన ఆగుతాడు.","why":"ఆమె రెండవ నిర్ణయాత్మక చర్య: ఇప్పుడే తనను రక్షించిన వ్యక్తి పాదాల వద్ద మోకాళ్లపై. కరుణ గెలిచింది.","turn":"ఆయన కత్తిని దించుతాడు.","story":"ఆమె మోకాళ్లపై పడుతుంది. ఆమెలో ఏదీ దీన్ని ప్లాన్ చేయలేదు. ఆయన పాదాలను చేతులతో చుట్టి, తన అన్న ప్రాణం కోసం అడుగుతుంది. కత్తి ఆమె పైన ఉంది. లోకం నిశ్చలంగా ఉంది. ఆమె పైకి చూడదు. తరువాత కత్తి ఖాళీగా కిందకు వస్తుంది, ఆమె భర్త దాన్ని దించుతాడు. రుక్మిణి తల ఇంకా వంగే ఉంటుంది. చాలాసేపు ఆమె కదలదు."},"S-950":{"t":"గుండు కొట్టడం","sum":"కృష్ణుడు రుక్మిని వస్త్రంతో కట్టి, అతని జుట్టు, మీసాల్లో కొంత భాగాన్ని తీసేస్తాడు. ఒకే గీతలో కరుణ, అవమానం. రుక్మిణి ముఖం తిప్పుకుంటుంది.","why":"కరుణ యొక్క మూల్యం: అన్న బతుకుతాడు, కానీ అవమానింపబడతాడు.","turn":"మంగలి కత్తి.","story":"ఆయన రుక్మిని ఒక వస్త్రపు ముక్కతో కట్టి, అతని సగం మీసాన్ని, సగం జుట్టును కత్తిరిస్తాడు. అది కరుణ, అదే అవమానం, ఒకే చర్యలో. రుక్మి ప్రతిఘటించడు. రుక్మిణి ముఖం తిప్పుకుంటుంది. కత్తిరించిన జుట్టు దారిపై పడుతుంది. గాలి కొంత తీసుకుపోతుంది."},"S-569":{"t":"బలరాముని మందలింపు","sum":"బలరాముడు రుక్మిని విడిపించి కృష్ణుని మందలిస్తాడు: ఇది మన కుటుంబానికి తగదు.","why":"వధువు ఎదుట నైతిక భేదాభిప్రాయం ఉన్న ఇద్దరు సోదరులు; బలరాముని రెండు విధేయతలు.","turn":"కృష్ణుడు జవాబు చెప్పడు.","story":"బలరాముడు తన సైన్యంతో వచ్చి జరిగినదాన్ని చూస్తాడు. రుక్మిని విడిపించి తన తమ్ముని వైపు తిరుగుతాడు. ఇది మనకు తగదు, అంటాడు. ఇది సిగ్గుపడే విషయం కాదు. కృష్ణుడు జవాబు చెప్పడు. వారి మధ్య రుక్మిణి నిలబడి ఏమీ అనదు. గాలి కత్తిరించిన జుట్టును దారి వెంట కదిలిస్తుంది."},"S-866":{"t":"బలరాముడు ఆమెను ఓదార్చుతాడు","sum":"బలరాముడు రుక్మిణిని ఓదార్చుతాడు: ప్రతి ఒక్కరూ తమ సొంత ఆనందాన్ని, దుఃఖాన్ని భరిస్తారు; ఆత్మ శరీరం కాదు; యోధుని కర్తవ్యాలు కఠినంగా ఉండవచ్చు. ఆమె శాంతిస్తుంది.","why":"దుఃఖ సమయంలో బావగారు గురువుగా మారడం; కృష్ణునికి దగ్గరి వ్యక్తి ఆయన గురించి ఒక మనిషిగా మాట్లాడే మొదటి సందర్భం.","turn":"ఆమె ముఖం తుడుచుకుంటుంది.","story":"బలరాముడు నేలపై రుక్మిణి పక్కన కూర్చుంటాడు. ప్రతి ఒక్కరూ తమ సొంత ఆనందాన్ని, తమ సొంత దుఃఖాన్ని భరిస్తారని ఆమెకు చెబుతాడు. ఆత్మ శరీరం కాదని చెబుతాడు. యోధుని కర్తవ్యాలు కఠినంగా ఉండవచ్చని, ఆమె అన్న తనది ఎదుర్కొన్నాడని అంటాడు. అది బాధించదని ఆమెకు చెప్పడు. ఆమె వింటుంది, ముసుగు చివరతో ముఖం తుడుచుకుని తల ఊపుతుంది."},"S-191":{"t":"రుక్మి ప్రవాసం","sum":"అవమానింపబడిన రుక్మి భోజకటం అనే నగరాన్ని నిర్మించి కుండినకు తిరిగి వెళ్లడానికి నిరాకరిస్తాడు.","why":"ఇంటికి వెళ్లనవసరం లేకుండా గర్విష్ఠుడైన మనిషి ఒక నగరాన్ని కడతాడు; దాని మూల్యం.","turn":"మొదటి గోడ లేస్తుంది.","story":"రుక్మి ఇంటికి వెళ్లడు. అతను ప్రమాణం చేశాడు, ఆ మాటను నిలబెట్టుకుంటాడు. కుండినకు దూరంగా ఒక నది మైదానంలో నేలలో ఒక కొయ్యను పాతి దాని చుట్టూ గోడ కట్టిస్తాడు. మొదటి గోడలు లేస్తాయి. కూలీలు రాళ్లు పేరుస్తారు. ఒక ప్రమాణంతో నగరం తయారవుతుంది. సాయంత్రం అతను కోటగోడపై నిలబడి ఇంటి వైపు చూస్తాడు."},"S-435":{"t":"పూల మాలలు, వస్త్రం, ఒక దాటడం","sum":"పూల అమ్మకందారు మాలలు మరో వధువుకు వాడబడతాయి. నేతగాడి పెళ్లి వస్త్రం రథంపై తీసుకుపోబడుతుంది. పడవవాడు ఒక యాదవ సైనికుడిని నది దాటిస్తాడు, ఇంకెవరినీ కాదు.","why":"ఆరవ ఘట్టానికి లోక క్షేమ రుజువు: బలవంతపు కూటమి రెండు రాజ్యాలను యుద్ధంతో కట్టివేయదు; సంతలు తిరిగి వస్తాయి.","turn":"మరో ఇంట్లో ఒక వధువు ఆ అమ్మకందారు మాలలు ధరిస్తుంది.","story":"పెళ్లి రద్దవుతుంది, పూల అమ్మకందారు తన మాలలు మరో ఇంటి గుమ్మం వద్ద మరో వధువుకు వాడబడడం చూస్తుంది. రాని రోజు కోసం నేసిన నేతగాడి పెళ్లి వస్త్రం రథం వెనుక తీసుకుపోబడుతుంది. పడవవాడు ఒక్క యాదవ సైనికుడిని నది దాటించి మిగతా అందరినీ తిరస్కరిస్తాడు. ఒకే ఉదయంలో మూడు చిన్న కథలు. వధువును ఎవరు తీసుకుపోయారో వారికి ఎవరికీ తెలియదు. అందరూ సంతోషంగా ఉన్నారు."},"S-565":{"t":"దృశ్య మార్పు: దారి నుంచి నగరానికి","sum":"కృష్ణుడు వైదిక పద్ధతిలో ఆమెను వివాహమాడి ద్వారకకు తీసుకెళ్తాడని గ్రంథం చెబుతుంది. చిత్రం వాటిలో ఏదీ చూపదు. బలరాముని ఓదార్పు తరువాత దారి నుంచి నగరానికి ఒక కత్తిరింపు వెళ్తుంది, ఆచారం ఒక ఖాళీగా మిగులుతుంది.","why":"ప్రాజెక్ట్ నియమాన్ని నిలబెడుతుంది: తెరపై పెళ్లి లేదు, దాని తరువాత ఏమీ లేదు.","turn":"దారి అంచున సముద్రం కనిపిస్తుంది.","story":"దారి. బలరాముని ఓదార్పు ముగిసింది, రథం ముందుకు సాగుతుంది. క్రతువులు జరిగాయని గ్రంథం చెబుతుంది, చిత్రం వాటిలో ఏదీ చూపదు. ఒక కత్తిరింపు: చక్రాలు, దుమ్ము, కొండల మధ్య ఒక ఖాళీ, నేల ముగిసే చోట ఒక వెలుగు గీత. ఆ ఖాళీలో ఎక్కడో ఒక వివాహం జరిగింది, మనకు అది చూపబడదు. దారి అంచున సముద్రం కనిపిస్తుంది."},"S-735":{"t":"సముద్రం మొదటి చూపు","sum":"లోతట్టులో బతికిన రుక్మిణి రథం నుంచి మొదటిసారి సముద్రాన్ని చూస్తుంది, నీటి నుంచి నగరం లేస్తూ. తాను ఊహించినదానితో పోల్చుకుంటుంది.","why":"రెండవ మొదటి చూపు: కథలకు జవాబిచ్చే సముద్రం; అంచనాల మొదటి తలకిందులు.","turn":"ఆమె బంగారు ద్వారాన్ని చూస్తుంది.","story":"ఆమె ఎన్నడూ సముద్రాన్ని చూడలేదు. రథం నుంచి అది మొదట ఒక గీతగా వస్తుంది, తరువాత అంతు లేని విశాలతగా, తరువాత నీటిలో నిలిచిన బంగారు ద్వారంగా. అది పాటల్లోని నగరం కాదు. అంతకన్నా ఎక్కువ, అలాగే చిన్నది కూడా. ఆమె కటకటాలను పట్టుకుంటుంది. గాలి ఆమె ముసుగును లాగుతుంది. ఆమె ఏమీ అనదు. ఆయన పక్కనే ఉన్నాడని, సముద్రం తన పూర్తి దృష్టిని తీసుకుందని ఆమెకు తెలుసు."},"S-460":{"t":"నగరం గుమ్మాల వద్ద","sum":"ద్వారక అలంకరించబడింది; అనేక వంశాల అతిథులు సంతోషిస్తారు; పౌరులు రత్నాల కానుకలు ఇస్తారు; గుమ్మాలకు దీపాలు; వీధుల్లో పూలు. అమ్మకందారు, నీళ్లు మోసేవాడు, కుమ్మరి, మేకల కాపరి, రైతు, జాలరి కుటుంబం ఒక్కొక్కరు ఒక్కో గుమ్మంలో కనిపిస్తారు. వీధిలో ఒక ఆవు పడుకుంటుంది. గోడ శుభ్రంగా ఉంది.","why":"లెక్క ముగుస్తుంది: లోకం యొక్క లాభాలు ఒకేసారి కనిపిస్తాయి.","turn":"నీళ్లు మోసేవాడు శుభ్రమైన గోడ పక్కన చెయ్యి ఎత్తుతాడు.","story":"నగరం వీధిలోకి వచ్చింది. గుమ్మాలకు దీపాలు వేలాడతాయి. నేలపై పూలు పడి ఉన్నాయి. కుండిన నుంచి అమ్మకందారు బుట్టతో ఒక మూల నిలిచి ఉంది, నీళ్లు మోసేవాడు శుభ్రమైన గోడ పక్కన, కుమ్మరి తన చక్రం వద్ద, మేకల కాపరి మేకలతో, రైతు తన ఆవుతో, జాలరి కుటుంబం రేవుపై. ప్రతి ఒక్కరూ చెయ్యి ఎత్తుతారు. పౌరులు కానుకలు ఇస్తారు. రథం వారి మధ్య నెమ్మదిగా వెళ్తుంది. ఒక విశాల దృశ్యంలో, వారిలో ప్రతి ఒక్కరూ ఒక గుమ్మంలో ఉన్నారు."},"S-334":{"t":"దీపం","sum":"కుండిన నుంచి ఆమె తెచ్చిన దీపం ఆమె చేతుల్లో; అలాంటిదే మరో దీపం ద్వారకలో ఇప్పటికే వెలుగుతోంది. ఆమె తన దీపాన్ని దాని పక్కన పెడుతుంది.","why":"లేఖకు జవాబు; జంట దీపాల అంశం.","turn":"రెండవ దీపం ఇప్పటికే వెలుగుతూ ఉండడం ఆమె చూస్తుంది.","story":"తన కొత్త గదిలో ఆమె కుండిన నుంచి తెచ్చిన దీపాన్ని సంచి నుంచి తీస్తుంది. అన్నిటి గుండా దాన్ని కాపాడుకుంది. ఒక అరపై పెడుతుంది, అక్కడ అదే ఆకారంలో మరో దీపం అప్పటికే వెలుగుతూ ఉండడం చూస్తుంది. ఎవరో చేతితో వెలిగించారు. ఆమె చాలాసేపు నిలబడి ఉంటుంది. తన దీపాన్ని వెలిగించి మొదటిదాని పక్కన పెడుతుంది."},"S-547":{"t":"ఖాళీ స్థానం","sum":"ఆనందం మధ్యలో, రాని ఒక అన్న కోసం ఒక స్థానం ఏర్పాటు చేయబడుతుంది. భోజకటానికి ఒక దారం.","why":"ఆ రోజు మూల్యం: రుక్మి గైర్హాజరు.","turn":"ఆమె ఖాళీ స్థానాన్ని గమనిస్తుంది.","story":"విందు మధ్యలో ఎవరి కోసమో ఒక స్థానం వేయబడి ఉంటుంది. ఒక చిన్న గిన్నె, ఒక పళ్లెం, బల్ల చివర ఒక ఖాళీ. అక్కడ ఎవరూ కూర్చోరు. మాటలు సాగుతూనే ఉంటాయి. రుక్మిణి ఆ స్థానాన్ని చూసి, తరువాత తలుపు వైపు చూస్తుంది. ఏమీ అనదు. ఆమె పక్కన ఎవరో ఆమె చూపును చూసి, ఆ స్థానాన్ని కొద్దిగా సరిగ్గా సర్దుతారు. భోజనం సాగుతుంది."},"S-285":{"t":"పాట","sum":"ఒక బంటు కవి హరణ కథను పాడతాడు, గ్రంథం చెప్పినట్లు అది దేశమంతా పాడబడింది. ఇది ఆమె వైపు కథ. రాజులు వింటారు.","why":"కథ పాటగా మారుతుంది; బంటు కవి తన చట్రాన్ని ముగిస్తాడు.","turn":"బంటు కవి ఆమె లేఖను కూడా చేర్చుతాడు.","story":"ఒక ముంగిలిలో బంటు కవి పాడడం మొదలుపెడతాడు. ఒక పురుషుని గురించి విని, ఆయనకు రాసి, ఒక ఆలయం నుంచి బయటకు నడిచిన విదర్భ అమ్మాయి కథ. అతను దాన్ని ఆమె వైపు నుంచి పాడతాడు, ఇంతవరకూ ఎవరూ అలా చేయలేదు. శ్రోతల్లో అవతలి వైపు మిత్రులుగా పెళ్లికి వచ్చిన రాజులు కూడా ఉన్నారు. వారు వింటారు. చివరలో బంటు కవి ముంగిలి అంతటా చూస్తాడు. ఆమె అక్కడే ఉంది, అతను నమస్కరిస్తాడు."},"S-559":{"t":"ఆయన చెప్పేది, చెప్పనిది","sum":"ఒక వాక్యం లేదా ఒక మౌనం: ఆమె లేఖకు ఆయన జవాబు, లేదా ఆలయం వద్ద తాను చూసినది ఆమె ఆయనకు చెప్పడం (లేఖకు వ్యతిరేకం). ఇద్దరిలో ఒకరు మాట్లాడతారు.","why":"చిత్రంలో చివరి సంభాషణ; ఇప్పుడు ఆమె ఆయనను వెలిగిస్తుంది.","turn":"ఇద్దరిలో ఒకరు మాట్లాడతారు.","story":"సముద్రం ఒడ్డున ఒక మిద్దెపై ఇద్దరూ ఉన్నారు. ఇద్దరిలో ఒకరు మాట్లాడాలి. ఆయన అయితే, ఆమె లేఖకు జవాబిస్తాడు. ఆమె అయితే, ఆలయం వద్ద తాను చూసినది ఆయనకు చెబుతుంది. సాయంత్రం దాదాపు ముగిసింది. ఒక వాక్యం, లేదా ఒక మౌనం, చిత్రం ఒకదాన్ని ఎంచుకుంటుంది. వారి వెనుక సముద్రం గట్టిగా వినిపిస్తుంది. ఆమె మొదటిసారి ఆయనను ఒక కథగా కాక ఒక మనిషిగా చూస్తుంది."},"S-709":{"t":"సముద్రపు అంచున కలిసి","sum":"ఇద్దరూ పక్కపక్కనే నిలబడతారు, ప్రక్క నుంచి లేదా వెనుక నుంచి చూపిన దృశ్యంలో, రుక్మిణి దృశ్య కేంద్రంగా. ఈ చిత్రం చిత్రంలోని కృష్ణుని ఏ దృశ్యం కన్నా కొంచెం ఎక్కువసేపు నిలుపబడుతుంది.","why":"చివరి చిత్రం: ఒకరిని దాదాపు చూడని చిత్రం తరువాత ఒకే ఫ్రేమ్‌లో ఇద్దరు.","turn":"నిలిపిన దృశ్యం.","story":"ఇద్దరూ సముద్రపు అంచున పక్కపక్కనే నిలబడతారు, ప్రక్క నుంచి లేదా వెనుక నుంచి. వెలుగు పొడవుగా, తక్కువగా ఉంది. రుక్మిణి ఫ్రేమ్ మధ్యలో ఉంది. ఆమె ఆయన వైపు చూడదు. చిత్రంలో మొదటిసారి ఫ్రేమ్‌లో మరెవరూ లేరు. ఆయనను చూపిన ఏ దృశ్యం కన్నా ఈ దృశ్యం కొంచెం ఎక్కువసేపు నిలుపబడుతుంది. తరువాత చిత్రం ముగుస్తుంది."},"S-446":{"t":"గుర్తులతో పుట్టిన బిడ్డ","sum":"మూడు కళ్లు, నాలుగు చేతులతో ఒక శిశువు పుడతాడు. తన మరణానికి కారణమయ్యేవాని ఒడిలో పెట్టినప్పుడు ఆ గుర్తులు మాయమవుతాయని ఆకాశవాణి చెబుతుంది.","why":"ప్రత్యర్థి జీవితానికి ఒక భవిష్యవాణిని ఇస్తుంది; కనబడని కౌంట్‌డౌన్.","turn":"స్వరం మాట్లాడుతుంది.","story":"చేది రాజభవనంలో ఒక బిడ్డ పుడతాడు, గది నిశ్శబ్దమవుతుంది. అతనికి మూడు కళ్లు, నాలుగు చేతులు ఉన్నాయి. రాణి అతన్ని చూస్తుంది, సూతికా స్త్రీలు వెనక్కి తగ్గుతారు. ఆకాశం నుంచి ఒక స్వరం పలుకుతుంది: అదనపు చేతులు, మూడవ కన్ను అతని మరణానికి కారణమయ్యేవాని ఒడిలో పెట్టినప్పుడు రాలిపోతాయి. రాజు రాణి వింటారు. అది ఎవరో ఆ స్వరాన్ని ఎవరూ అడగరు."},"S-807":{"t":"తల్లి భయం","sum":"కృష్ణుడు సందర్శించి శిశువును తన ఒడిలోకి తీసుకుంటాడు; అదనపు చేతులు, కన్ను మాయమవుతాయి. తన బిడ్డను పునరుద్ధరించిన వ్యక్తే అతని మరణానికి నిర్ణయించబడినవాడు కావచ్చని తల్లి గ్రహిస్తుంది.","why":"భయంతో కలిసిన గుర్తింపు; కృష్ణుడు, శిశుపాలుల మొదటి కలయిక.","turn":"గుర్తులు మాయమవుతాయి.","story":"కృష్ణుడు రాజభవనాన్ని సందర్శిస్తాడు. తల్లి బిడ్డను ఆయన ఒడిలో పెడుతుంది, ఎందుకంటే చెప్పబడింది. అదనపు చేతులు, కన్ను మాయమవుతాయి. ఆమె ఊపిరి బిగబడుతుంది. బిడ్డ కేవలం ఒక బిడ్డ మాత్రమే. తన కొడుకును పూర్ణుడిని చేసిన వ్యక్తే అతన్ని అంతం చేస్తాడని ఆమెకు ఒక్కసారిగా అర్థమవుతుంది. దృశ్యం ఆయన ముఖంపై కాకుండా ఆమె ముఖంపై ముగుస్తుంది."},"S-208":{"t":"నూరు తప్పులు","sum":"తల్లి తన కొడుకును విడిచిపెట్టమని కృష్ణుని వేడుకుంటుంది. కృష్ణుడు నూరు తప్పులను సహిస్తానని వాగ్దానం చేస్తాడు.","why":"చిత్రంలోని గడియారం; తన కొడుకును తీసుకుపోయేవానితో చేసిన ఒప్పందం.","turn":"కృష్ణుడు ఒప్పుకుంటాడు.","story":"ఆమె తన కొడుకును విడిచిపెట్టమని అడుగుతుంది. ఆయన దయతో అతని తప్పులను క్షమిస్తానంటాడు. ఎన్నో అని ఆమె అడుగుతుంది. నూరు అంటాడు. ఆమె తల ఊపుతుంది, తన కొడుకుకు చెప్పదు. కెమెరా ఆమెపైనే ఉంటుంది. ఆ సంఖ్య, మొదలై వినబడని గడియారంలా చిత్రంలోకి వెళ్తుంది."},"S-329":{"t":"జయ విజయుల శాపం","sum":"నలుగురు కుమారులు వైకుంఠాన్ని సందర్శిస్తారు, ద్వారపాలకులు జయ విజయులు వారిని ఆపుతారు. వారు లోకంలో పుట్టాలని శపిస్తారు. విష్ణువు వారికి ఎంపిక ఇస్తాడు: భక్తులుగా ఏడు జన్మలు లేదా శత్రువులుగా మూడు జన్మలు. వారు మూడు ఎంచుకుంటారు.","why":"శిశుపాలుని జీవితం వెనుక ఉన్న విశ్వ శాపం, దుర్వాసుని శాపానికి ప్రతిబింబం.","turn":"వారు శత్రువులుగా మూడు జన్మలను ఎంచుకుంటారు.","story":"వైకుంఠ ద్వారం వద్ద ఇద్దరు కావలివారు నలుగురు ఋషులను ఆపుతారు. ఋషులు చూడటానికి పిల్లలు, వాస్తవానికి ప్రాచీనులు. జయ, విజయులు ఎవరూ లోపలికి రాకూడదంటారు. ఋషులు వారిని కింద లోకంలో పుట్టమని శపిస్తారు. భగవంతుడే ద్వారం వద్దకు వస్తాడు, కావలివారు ఆయన పాదాల వద్ద పడతారు. వారికి ఆయన స్నేహితులుగా ఏడు జన్మలు లేదా ఆయన శత్రువులుగా మూడు జన్మలు ఉండవచ్చు. వారు మూడు ఎంచుకుంటారు, ఎందుకంటే ఆయనకు ఎక్కువ కాలం దూరంగా ఉండలేరు."},"S-946":{"t":"పోయిన వధువు","sum":"పెళ్లికొడుకు వస్త్రాల్లో ఉన్న శిశుపాలుడు వధువు పోయిందని తెలుసుకుంటాడు. అతని శత్రుత్వం గట్టిపడుతుంది.","why":"ప్రత్యర్థి గాయం; అతని అవమానం, తరువాతి ద్వేషానికి కారణం.","turn":"ఆమె ఇష్టపూర్వకంగా వెళ్లిందని అతను గ్రహిస్తాడు.","story":"మెడలో మాలతో, పెళ్లికొడుకు వస్త్రాల్లో శిశుపాలుడు ఆలయం వద్ద ఎదురు చూస్తాడు. ఒక వధువు వస్తుందని అతనికి చెప్పబడింది. ముంగిలి ఖాళీగా ఉంది. అతను ఎవరినో అడుగుతాడు. వారు చెబుతారు. అతను దారిని చూస్తాడు, తరువాత తన చేతులను చూసుకుంటాడు. ఆమె ఇష్టపూర్వకంగా వెళ్లిందని అతనికి అర్థమవుతుంది. అతని ముఖం నెమ్మదిగా మారుతుంది, దాని స్థానంలో వచ్చేది దుఃఖం కాదు."},"S-128":{"t":"బలరాముని రెండు విధేయతలు","sum":"తన తమ్ముని సైన్యంతో రక్షించి, గుండు గురించి మందలించే వ్యక్తి. ఒకే మనిషిలో రెండు విధేయతలు.","why":"E06-28కి మించి బలరాముని పాత్రను లోతు చేస్తుంది; సాధ్యమైన రెండవ ఘట్టం.","turn":"అతను రుక్మికి న్యాయాన్ని ఎంచుకుంటాడు.","story":"బలరాముడు తన తమ్ముని సైన్యంతో రక్షించాడు, మౌనంగా ఉండడు. గుండు కొట్టడం తగదని ఆయనకు చెబుతాడు. మళ్లీ నెమ్మదిగా చెబుతాడు. తరువాత సైన్యం వైపు తిరిగి ఆగమని చెబుతాడు. రెండు విధేయతలనూ కొనసాగిస్తాడు, అవి ఒకటేనని నటించడు. దృశ్యం ఆయన వెళ్తున్న వీపుపై ముగుస్తుంది."},"S-218":{"t":"రుక్మి హద్దు మీరడం","sum":"నియంత్రణ, ప్రతిజ్ఞ, వినాశం ఒకే వృత్తంలో: సంబంధం కుదిర్చే అన్న, ప్రమాణం చేస్తాడు, ద్వంద్వ యుద్ధంలో ఓడతాడు, ఇంటికి వెళ్లనవసరం లేకుండా ఒక నగరాన్ని కడతాడు.","why":"ఒకే దృశ్యంలో వ్యక్తిగత ప్రత్యర్థి వృత్తం; ఒకే దృశ్య సారాంశంగా ఉండగలదు.","turn":"అతను ప్రమాణం చేస్తాడు.","story":"రుక్మి ఒక సంబంధం కుదురుస్తాడు. ప్రమాణం చేస్తాడు. ద్వంద్వ యుద్ధంలో ఓడతాడు. ఒక నగరాన్ని కడతాడు. నాలుగు చిన్న చిత్రాలు: అతని స్వరమే గట్టిగా ఉన్న సభ, అతను ప్రమాణం చేసే దారి పక్క, అతను పడే దారి, అతను మొదటి రాయి వేసే మైదానం. వాటి మధ్య మనిషి మారడు. మారేది ఒక్కటే, అతనికి ఎంత మిగిలి ఉందో."}},"terms":{"evn":{"Churning":"క్షీరసాగర మథనం","Earth’s burden":"భూభారం","Jarasandha":"జరాసంధుని దాడులు","Dvārakā":"ద్వారకా నిర్మాణం","Mucukunda":"ముచుకుంద గుహ","Abduction":"రుక్మిణీ హరణం","Final episode":"చివరి ఘట్టం","Backstories":"పూర్వకథలు"},"k":{"Not present":"లేడు","Spoken of, indirect (voice only)":"ప్రస్తావన, పరోక్షం (గొంతు మాత్రమే)","Spoken of, indirect":"ప్రస్తావన, (Rukmini, waiting) and Krishna’s world (told, never seen) take turns until the temple door, where they meet. Good for checking that neither thread starves.":"కచ్చితమైన వంతులు: కుండిన (రుక్మిణి, ఎదురు చూస్తూ), కృష్ణుని లోకం (చెప్పబడినది, ఎన్నడూ కనబడనిది) ఆలయ ద్వారం వద్ద కలిసే వరకూ మార్చి మార్చి వస్తాయి. రెండు దారాల్లో ఏదీ తక్కువ కాకుండా చూసుకోవడానికి మంచిది.","Cold open: the burning hill":"ప్రారంభ దృశ్యం: మండుతున్న కొండ","The enemy’s vow":"శత్రువు ప్రతిజ్ఞ","The first siege":"మొదటి ముట్టడి","Seventeen times":"పదిహేడు సార్లు","The oldest war":"అతి పురాతన యుద్ధం","Why he lets him live":"ఆయన అతన్ని ఎందుకు బతకనిస్తాడు","The pot is seized":"కుండను లాక్కుంటారు","Two armies, one city":"రెండు సైన్యాలు, ఒక నగరం","The city in the sea":"సముద్రంలో నగరం","The man on foot":"కాలినడకన వెళ్తున్నవాడు","The sleeper":"నిద్రిస్తున్నవాడు","What reaches Kuṇḍina":"కుండినకు చేరేది","The letter":"లేఖ","Mohinī and the war":"మోహిని, యుద్ధం","The night before":"ముందటి రాత్రి","The extraction":"ఎత్తుకుపోవడం","The duel":"ద్వంద్వ యుద్ధం","Board 5 · The action cut":"బోర్డ్ 5 · యాక్షన్ కూర్పు","The same 115 scenes cut as an action film: a cold open on the burning hill, the sieges up front, the reasons delivered on the move, and the abduction played as the extraction it is. Krishna is still unseen until the temple door, so the set pieces carry the first half and the drama rides between them.":"అవే 115 సన్నివేశాలు యాక్షన్ చిత్రంగా కూర్చినవి: మండుతున్న కొండతో ప్రారంభం, ముట్టడులు ముందే, కారణాలు పరుగులో చెప్పబడతాయి, హరణం ఒక ఎత్తుకుపోయే ఆపరేషన్‌లా సాగుతుంది. ఆలయ ద్వారం వరకూ కృష్ణుడు కనబడడు, కాబట్టి మొదటి సగాన్ని యాక్షన్ ఘట్టాలే మోస్తాయి, నాటకం వాటి మధ్య నడుస్తుంది."}};

/* ---------- sanitise ---------- */
function clean(d){
  const seen=new Set();const cols=[];
  (d&&Array.isArray(d.cols)?d.cols:[]).forEach((c,i)=>{
    if(!c)return;const ids=[];(Array.isArray(c.ids)?c.ids:[]).forEach(x=>{if(BASE[x]&&!seen.has(x)){seen.add(x);ids.push(x)}});
    const o={id:String(c.id||('c'+Date.now()+i)),name:String(c.name||'Sequence').slice(0,60),ids};
    if(typeof c.note==='string'&&c.note.trim())o.note=c.note.slice(0,600);
    if(typeof c.lastp==='string'&&c.lastp.trim())o.lastp=c.lastp.slice(0,400);
    if(c.ap===true){o.ap=true;if(typeof c.apAt==='string')o.apAt=c.apAt.slice(0,40)}
    if(c.te&&typeof c.te==='object'){const t={};
      if(typeof c.te.name==='string'&&c.te.name.trim())t.name=c.te.name.slice(0,80);
      if(typeof c.te.note==='string'&&c.te.note.trim())t.note=c.te.note.slice(0,700);
      if(Object.keys(t).length)o.te=t}
    cols.push(o);
  });
  const cat={};if(d&&d.cat)Object.keys(d.cat).forEach(k=>{if(BASE[k]&&(d.cat[k]==='A'||d.cat[k]==='D')&&d.cat[k]!==BASE[k].cat)cat[k]=d.cat[k]});
  return {cols:cols.length?cols:defaultState().cols,cat};
}
function cleanShots(a){
  if(!Array.isArray(a))return null;
  const out=[];
  a.forEach(s=>{
    if(!s)return;
    const x=typeof s==='string'?{x:s}:s;
    const txt=String(x.x||x.text||'').trim();if(!txt)return;
    const o={t:String(x.t||x.type||'SHOT').trim().toUpperCase().slice(0,16)||'SHOT',x:txt.slice(0,700)};
    const te=String(x.te||'').trim();if(te)o.te=te.slice(0,700);
    const mj=String(x.mj||'').trim();if(mj)o.mj=mj.slice(0,1400);
    const imgs=[];
    if(Array.isArray(x.imgs))x.imgs.forEach(g=>{const id=String((g&&g.id)||g||'').trim();if(id&&imgs.length<8)imgs.push({id:id.slice(0,64)})});
    else{const im=String(x.img||'').trim();if(im)imgs.push({id:im.slice(0,64)})}
    if(imgs.length)o.imgs=imgs;
    if(x.chk&&typeof x.chk==='object'){
      const per=[];
      if(Array.isArray(x.chk.per))x.chk.per.forEach(q=>{if(q)per.push({i:Number(q.i)||0,ok:q.ok===true,note:String(q.note||'').slice(0,300)})});
      o.chk={best:typeof x.chk.best==='number'?x.chk.best:-1,note:String(x.chk.note||'').slice(0,500),
        fix:String(x.chk.fix||'').slice(0,400),at:String(x.chk.at||'').slice(0,40)};
      if(per.length)o.chk.per=per.slice(0,8);
    }
    if(x.a===true)o.a=true;          /* the shot is approved */
    if(x.ma===true)o.ma=true;        /* its image prompt is approved */
    out.push(o);
  });
  return out.slice(0,60);
}

/* ---------- scene overrides, shots and history ---------- */
const TXT=['t','sum','why','turn','story','rasa','pov','pl','k','mins'];
const SNAP=['t','sum','why','turn','story','rasa','pov','pl','k','mins'];
let ov={},ovRef=null;
const midOf=m=>{const n=String(m).match(/\d+(?:\.\d+)?/g);if(!n)return 1.5;const a=n.map(Number);return a.length>1?(a[0]+a[1])/2:a[0]};
function applyOv(){
  ORDER.forEach(c=>{BY[c]=BASE[c]});
  Object.keys(ov).forEach(code=>{
    if(!BASE[code])return;
    const o=ov[code]||{},b=Object.assign({},BASE[code]),f={};
    TXT.forEach(k=>{if(typeof o[k]==='string'&&o[k].trim()){b[k]=o[k].trim();f[k]=1}});
    if(Array.isArray(o.gen)&&o.gen.length)b.gen=o.gen.filter(x=>typeof x==='string').slice(0,5);
    const t=Number(o.tier);if(isFinite(t)&&t>=1&&t<=5){b.tier=Math.round(t);f.tier=1}
    if(typeof o.carrier==='boolean'){b.carrier=o.carrier;f.carrier=1}
    if(f.mins)b.mid=midOf(b.mins);
    if(o.te&&typeof o.te==='object')b.te=o.te;
    const sh=cleanShots(o.shots);if(sh)b.shots=sh;
    b.hist=Array.isArray(o.hist)?o.hist:[];
    b.ovf=f;b.ed=Object.keys(f).length>0;b.lastp=typeof o.prompt==='string'?o.prompt:'';
    b.ap=o.ap===true;b.apAt=typeof o.apAt==='string'?o.apAt:'';
    BY[code]=b;
  });
}
function snapOf(code){
  const s=BY[code],o={at:new Date().toISOString(),prompt:(ov[code]&&ov[code].prompt)||''};
  SNAP.forEach(k=>{o[k]=s[k]});
  o.tier=s.tier;o.carrier=!!s.carrier;o.gen=s.gen;
  if(s.te)o.te=s.te;
  if(s.shots)o.shots=s.shots;
  if(!(ov[code]&&ov[code].hist&&ov[code].hist.length)&&!BY[code].ed)o.base=true;
  return o;
}
function pushHist(code){
  const prev=ov[code]||{};
  const h=Array.isArray(prev.hist)?prev.hist.slice():[];
  h.unshift(snapOf(code));
  ov[code]=Object.assign({},prev,{hist:h.slice(0,10)});
}
async function saveOv(code){
  try{localStorage.setItem('sceneboard.ov',JSON.stringify(ov))}catch(e){}
  if(mode!=='db'||!ovRef)return;
  try{
    const o=ov[code];
    if(o&&Object.keys(o).length)await ovRef.doc(code).set(o);else await ovRef.doc(code).delete();
    setStatus('saved',true);
  }catch(e){setStatus('fail')}
}

/* ---------- approval ----------
   A scene, a sequence, a shot or an image prompt can be approved by hand.
   An approved thing is frozen: no prompt can rewrite it, no edit by hand can
   touch it, and it cannot be restored over, until the approval is removed. */
const sceneAp=c=>!!(ov[c]&&ov[c].ap);
const seqApId=id=>{const c=state.cols.find(x=>x.id===id);return !!(c&&c.ap)};
const shotsOf=c=>(BY[c]&&BY[c].shots)||[];
const apShots=c=>shotsOf(c).filter(x=>x.a).length;
/* a scene may be approved only once every one of its shots is approved */
function sceneApBlock(code){
  const a=shotsOf(code);
  if(!a.length)return 'Write its shots first, then approve them — a scene is approved only when all of its shots are.';
  const n=a.filter(x=>x.a).length;
  return n<a.length?('Approve all of its shots first — '+n+' of '+a.length+' are approved.'):'';
}
/* a sequence may be approved only once every scene in it is approved */
function seqApBlock(col){
  if(!col.ids.length)return 'Put scenes in it first.';
  const n=col.ids.filter(i=>sceneAp(i)).length;
  return n<col.ids.length?('Approve all of its scenes first — '+n+' of '+col.ids.length+' are approved.'):'';
}
/* an approval holds everything under it: the sequence holds its scenes, the
   scene holds its shots, so the lock is taken off from the top down */
const seqHolding=code=>{const w=where(code);return w&&state.cols[w.ci].ap?state.cols[w.ci]:null};
const LOCKED_BY_SEQ='Its sequence is approved. Take that approval off first.';
const LOCKED_BY_SCENE='This scene is approved. Take that approval off first.';
const shotLocked=code=>sceneAp(code);
const apChip=on=>on?'<span class="apchip" title="Approved">approved</span>':'';
const apCount=()=>ORDER.reduce((n,c)=>n+(sceneAp(c)?1:0),0);
const LOCKED_SCENE='This scene is approved. Remove the approval in Options before changing it.';
const LOCKED_SEQ='This sequence is approved. Remove the approval before changing it.';
function setSceneAp(code,on){
  if(on){const why=sceneApBlock(code);if(why){toast(why);return}}
  else if(seqHolding(code)){toast(LOCKED_BY_SEQ);return}
  const prev=ov[code]||{},next=Object.assign({},prev);
  if(on){next.ap=true;next.apAt=new Date().toISOString()}else{delete next.ap;delete next.apAt}
  if(Object.keys(next).length)ov[code]=next;else delete ov[code];
  applyOv();saveOv(code);render();
  toast(on?'Scene approved — its text and category are locked':'Approval removed from the scene');
}
function setSeqAp(id,on){
  const c=state.cols.find(x=>x.id===id);if(!c)return;
  if(on){const why=seqApBlock(c);if(why){toast(why);return}}
  if(on){c.ap=true;c.apAt=new Date().toISOString()}else{delete c.ap;delete c.apAt}
  persist();render();
  toast(on?'Sequence approved — its name, context and order are locked':'Approval removed from the sequence');
}
function setShotAp(code,i,key,on){
  if(shotLocked(code)){toast(LOCKED_BY_SCENE);return}
  const a=(BY[code].shots||[]).slice();if(!a[i])return;
  if(key==='a'&&!on&&a[i].a&&sceneAp(code)){toast(LOCKED_BY_SCENE);return}
  a[i]=Object.assign({},a[i]);
  if(on)a[i][key]=true;else delete a[i][key];
  setShots(code,a,on?(key==='a'?'Shot approved':'Image prompt approved'):'Approval removed');
}

/* ---------- persistence ---------- */
let boardsData={},active='b1',catRef=null,boardsRef=null,dirtyCat=false;
const bid=n=>parseInt(String(n).replace(/\D/g,''),10)||0;
const boardIds=()=>Object.keys(boardsData).sort((a,b)=>bid(a)-bid(b));
function curBoard(){return boardsData[active]||(boardsData[active]={name:'Board '+bid(active),desc:'',cols:state.cols})}
function saveLocal(){try{localStorage.setItem('sceneboard.v2',JSON.stringify({boards:boardsData,cat:state.cat,active}))}catch(e){}}
function persist(catChanged){
  curBoard().cols=state.cols;if(catChanged)dirtyCat=true;
  saveLocal();
  if(mode!=='db')return;
  pending=true;setStatus('saving');clearTimeout(wtimer);wtimer=setTimeout(flush,600);
}
async function flush(){
  if(writing){again=true;return}
  const id=active,b=boardsData[id];if(!b){pending=false;return}
  writing=true;const j=JSON.stringify(b.cols);
  try{
    await boardsRef.doc(id).set({name:b.name,desc:b.desc||'',te:b.te||null,cols:b.cols,order:b.cols.flatMap(c=>c.ids),updated:new Date().toISOString()});
    lastJSON=j;
    if(dirtyCat){await catRef.set({cat:state.cat});dirtyCat=false}
    setStatus('saved',true);
  }catch(e){setStatus('fail')}
  writing=false;pending=false;
  if(again){again=false;persist()}
}
function readBoard(v,id){v=v||{};const o={name:String(v.name||'Board '+bid(id)).slice(0,70),desc:String(v.desc||'').slice(0,400),cols:clean({cols:v.cols}).cols};
  if(v.te&&typeof v.te==='object')o.te={name:String(v.te.name||'').slice(0,80),desc:String(v.te.desc||'').slice(0,500)};return o}
function switchBoard(id){
  if(id===active||!boardsData[id])return;
  if(pending){clearTimeout(wtimer);flush()}
  active=id;state.cols=boardsData[id].cols;lastJSON=JSON.stringify(state.cols);closeDrawer();render();saveLocal();
}
function dupBoard(){
  if(pending){clearTimeout(wtimer);flush()}
  const n=Math.max(0,...boardIds().map(bid))+1,id='b'+n,src=curBoard();
  boardsData[id]={name:'Board '+n,desc:'Copy of '+src.name+'.',cols:JSON.parse(JSON.stringify(src.cols))};
  active=id;state.cols=boardsData[id].cols;lastJSON='';closeDrawer();persist();render();toast('tBoardNew',{n});
}
let delArm=false;
async function delBoard(){
  if(boardIds().length<2){toast('This is the only board. Copy it first if you want to try another order.');return}
  if(!delArm){delArm=true;toast('Click × again to delete “'+curBoard().name+'”');setTimeout(()=>{delArm=false},4000);return}
  delArm=false;
  const id=active,gone=curBoard().name;
  clearTimeout(wtimer);pending=false;
  delete boardsData[id];active=boardIds()[0]||'b1';state.cols=curBoard().cols;lastJSON=JSON.stringify(state.cols);
  closeDrawer();saveLocal();render();
  if(mode==='db'&&boardsRef){try{await boardsRef.doc(id).delete();setStatus('saved',true)}catch(e){setStatus('fail')}}
  toast('Deleted “'+gone+'”');
}
/* start from the orders built into the page */
function seedBoards(){
  const ids=Object.keys(SEED||{}).sort();
  if(!ids.length)return false;
  boardsData={};ids.forEach(id=>{boardsData[id]=readBoard(SEED[id],id)});
  active=boardsData[active]?active:ids[0];
  state.cols=curBoard().cols;lastJSON='';
  return true;
}
/* Boards that ship with a new version of the page are added to an existing
   store once each, and a board the person has deleted is never resurrected:
   every seed id we have offered is remembered. */
function addNewSeeds(){
  let known=[];try{known=JSON.parse(localStorage.getItem('sceneboard.seeded')||'[]')||[]}catch(e){}
  const ids=Object.keys(SEED||{}).sort();
  if(!ids.length)return false;
  const fresh=ids.filter(id=>!boardsData[id]&&known.indexOf(id)<0);
  const remember=()=>{try{localStorage.setItem('sceneboard.seeded',JSON.stringify(ids.filter(id=>boardsData[id]||known.indexOf(id)>=0)))}catch(e){}};
  if(!fresh.length){remember();return false}
  fresh.forEach(id=>{boardsData[id]=readBoard(SEED[id],id)});
  remember();persist();
  toast(fresh.length===1?'New board in this version: “'+bName(boardsData[fresh[0]])+'”':'Added '+fresh.length+' new boards from this version');
  return true;
}
function renderTabs(){
  $('boards').innerHTML=boardIds().map(id=>'<button type="button" data-board="'+id+'" aria-pressed="'+(id===active)+'" title="'+esc(bName(boardsData[id]))+'">'+esc(bName(boardsData[id]))+'</button>').join('')+'<button type="button" class="plus" id="dupboard" title="'+esc(T('copyTip'))+'">'+esc(T('copyBoard'))+'</button>';
  const bn=$('bname');if(document.activeElement!==bn)bn.value=bName(curBoard());
  $('bdesc').textContent=bDesc(curBoard());
}
async function boot(){
  curBoard();applyOv();render();
  let db=null;try{db=await (window.claude&&window.claude.use?window.claude.use('db'):null)}catch(e){}
  try{samp=await (window.claude&&window.claude.use?window.claude.use('sample'):null)}catch(e){samp=null}
  try{assets=await (window.claude&&window.claude.use?window.claude.use('assets'):null)}catch(e){assets=null}
  if(samp)render();
  if(!db){
    mode='local';
    let saved=false;
    try{const r=JSON.parse(localStorage.getItem('sceneboard.v2')||'null');
      if(r&&r.boards&&Object.keys(r.boards).length){saved=true;boardsData={};Object.keys(r.boards).forEach(k=>boardsData[k]=readBoard(r.boards[k],k));state.cat=clean({cols:[],cat:r.cat}).cat;active=boardsData[r.active]?r.active:(boardIds()[0]||'b1');state.cols=curBoard().cols}}catch(e){}
    if(!saved)seedBoards();else addNewSeeds();
    try{const o=JSON.parse(localStorage.getItem('sceneboard.ov')||'null');if(o&&typeof o==='object'){ov=o;applyOv()}}catch(e){}
    setStatus('local');render();return;
  }
  mode='db';boardsRef=db.collection('boards');catRef=db.doc('meta/cats');ovRef=db.collection('scenes');
  const t=setTimeout(()=>{if(!lastJSON)setStatus('slow')},10000);
  catRef.onSnapshot(s=>{
    if(s.exists&&!dirtyCat&&!pending){const c=clean({cols:[],cat:(s.data()||{}).cat}).cat;if(JSON.stringify(c)!==JSON.stringify(state.cat)){state.cat=c;if(!dragging)render()}}
  },()=>{});
  ovRef.onSnapshot(qs=>{
    const next={};qs.docs.forEach(d=>{next[d.id]=d.data()||{}});
    if(JSON.stringify(next)!==JSON.stringify(ov)){ov=next;applyOv();if(!dragging&&!asking)render()}
  },()=>{});
  boardsRef.onSnapshot(qs=>{
    clearTimeout(t);
    const seen={};qs.docs.forEach(d=>{seen[d.id]=readBoard(d.data(),d.id)});
    if(Object.keys(seen).length){if(pending&&boardsData[active])seen[active]=boardsData[active];boardsData=seen}
    else if(!Object.keys(boardsData).length||!flat().length)seedBoards();   /* an empty store: start from the seeds */
    if(!boardsData[active])active=boardIds()[0]||'b1';
    const b=curBoard(),j=JSON.stringify(b.cols);
    if(!pending&&!dragging&&j!==lastJSON){state.cols=b.cols;lastJSON=j;render()}else renderTabs();
    if(!pending)setStatus('saved',true);
  },()=>{mode='local';setStatus('local')});
}

/* ---------- render ---------- */
let dragging=false;
function cardHTML(code,pos){
  const s=BY[code],cat=catOf(code);
  const dots=[1,2,3,4,5].map(i=>'<i class="'+(i<=s.tier?'on':'')+'"></i>').join('');
  return '<div class="card'+(s.ap?' apd':'')+'" data-c="'+code+'" data-cat="'+cat+'"'+(s.ap?' data-ap="1"':'')+' tabindex="0" role="button" aria-label="'+esc(sc(s,'t'))+', '+catLabel(cat)+(s.ap?', approved':'')+'">'+
    (pos?'<span class="pos">'+pos+'</span>':'')+
    '<div class="cb"><div class="top"><span class="code">'+code+'</span><span class="chip">'+catLabel(cat)+'</span>'+(s.ed?'<span class="edflag">edited</span>':'')+apChip(s.ap)+'</div>'+
    '<div class="ttl">'+esc(sc(s,'t'))+'</div>'+
    '<div class="meta"><span>'+esc(term('evn',s.evn))+'</span><span>'+esc(s.mins)+' '+T('min')+'</span><span class="dots" title="'+T('tier')+' '+s.tier+'">'+dots+'</span>'+(s.carrier?'<span>'+T('carrier')+'</span>':'')+(s.shots&&s.shots.length?'<span>'+s.shots.filter(x=>x.a).length+'/'+s.shots.length+' shots'+(s.shots.reduce((n,x)=>n+((x.imgs||[]).length),0)?' · '+s.shots.reduce((n,x)=>n+((x.imgs||[]).length),0)+' images':'')+'</span>':'')+'</div></div>'+
    (pos?'':'<button class="add" type="button" data-add="'+code+'" title="'+esc(T('addTip'))+'" aria-label="'+esc(T('addAria'))+'">+</button>')+
    '<button class="more" type="button" data-more="'+code+'" title="More" aria-label="More options">⋯</button></div>';
}
function render(){
  const placed=placedSet();
  // bin
  let list=all().filter(s=>!placed.has(s.c));
  const binTotal=list.length;
  const q=filt.q.trim().toLowerCase();
  list=list.filter(s=>(filt.f==='all'||catOf(s.c)===filt.f)&&(filt.ev==='0'||String(s.ev)===filt.ev)&&(!q||(s.t+' '+s.c+' '+s.pl+' '+s.pov+' '+s.evn+' '+sc(s,'t')+' '+term('pl',s.pl)+' '+term('pov',s.pov)+' '+term('evn',s.evn)).toLowerCase().includes(q)));
  const so={ev:(a,b)=>a.ev-b.ev||a.src.localeCompare(b.src),code:(a,b)=>a.c.localeCompare(b.c),title:(a,b)=>sc(a,'t').localeCompare(sc(b,'t'),isTe()?'te':undefined),tier:(a,b)=>b.tier-a.tier||sc(a,'t').localeCompare(sc(b,'t'),isTe()?'te':undefined)}[filt.sort];
  list.sort(so);
  $('bin').innerHTML=list.length?list.map(s=>cardHTML(s.c)).join(''):'<div class="empty">'+T(binTotal?'noMatch':'allPlaced')+'</div>';
  $('bincount').textContent=T('binCount',{n:list.length,t:binTotal});
  // board
  let n=0;
  $('board').innerHTML=state.cols.map(c=>{
    const mins=c.ids.reduce((a,i)=>a+BY[i].mid,0),note=colNote(c);
    return '<div class="col'+(folded.has(c.id)?' folded':'')+(c.ap?' apd':'')+'" data-id="'+esc(c.id)+'"><div class="chead">'+
      '<button class="fold" type="button" data-fold="'+esc(c.id)+'" aria-expanded="'+(!folded.has(c.id))+'" aria-label="Fold or unfold this sequence">'+(folded.has(c.id)?'▸':'▾')+'</button>'+
      '<span class="grip" title="'+esc(T('gripTip'))+'" aria-hidden="true">⠿</span>'+
      '<input class="cname" value="'+esc(colName(c))+'" aria-label="'+esc(T('seqName'))+'" maxlength="60"'+(c.ap?' readonly title="Approved — the name is locked"':'')+'>'+
      (c.ap?'<span class="apmark" title="Approved">✓</span>':'')+
      '<button class="ebtn" type="button" data-seq="'+esc(c.id)+'" title="Open this sequence (right-click for more)" aria-label="Edit sequence">✎</button>'+
      '<button class="xbtn" type="button" data-del="'+esc(c.id)+'" title="'+esc(T('delTip'))+'" aria-label="'+esc(T('delAria'))+'">×</button></div>'+
      '<div class="cinfo">'+T('colInfo',{n:c.ids.length,w:T(c.ids.length===1?'scene':'scenes'),t:fmtMin(mins)})+'</div>'+
      (note?'<div class="cnote">'+esc(note)+'</div>':'')+
      '<div class="cards">'+c.ids.map(i=>cardHTML(i,++n)).join('')+'</div></div>';
  }).join('')+'<button class="newcol" id="newcol" type="button">'+esc(T('addSeq'))+'</button>';
  renderTabs();stats();bindSortables();
  const ae=document.activeElement;
  const typing=ae&&((ae.classList&&ae.classList.contains('edp'))||ae.id==='shx'||ae.id==='sht'||ae.id==='mjx');
  if(!typing){if(openCode)scenePanel(openCode,true);else if(openSeq)seqPanel(openSeq,true)}
  if(!$('read').hidden)readThrough(true);
}
function stats(){
  const order=flat();

function ae2(n){return (n<10?'0':'')+n}
function ae3(n){return Math.round(n*1000)/1000}
/* which picture is this shot's picture: the one the check kept */
function aeImg(sh){
  const imgs=sh.imgs||[];if(!imgs.length)return null;
  const chk=sh.chk||{},b=chk.best;
  if(typeof b==='number'&&b>=0&&b<imgs.length)return{id:imgs[b].id,why:'checked: picture '+(b+1)+' of '+imgs.length+' kept'};
  if(typeof b==='number'&&b<0)return null;      /* the check said none of them is the shot */
  const ok=(chk.per||[]).filter(p=>p&&p.ok&&typeof p.i==='number');
  if(ok.length&&ok[0].i<imgs.length)return{id:imgs[ok[0].i].id,why:'checked: picture '+(ok[0].i+1)+' passed'};
  return{id:imgs[0].id,why:imgs.length===1?'one picture, not checked':imgs.length+' pictures, not checked — the first is used'};
}
/* 00:12.4 — for slates and burn-ins */
function aeTc(sec){
  sec=Math.round(Math.max(0,sec)*10)/10;
  let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=Math.round(sec%60*10)/10;
  if(x>=59.95){x=0;m++;if(m===60){m=0;h++}}
  const xs=(x<10?'0':'')+x.toFixed(1);
  return h?h+':'+ae2(m)+':'+xs:ae2(m)+':'+xs;
}
/* how far a move travels: a long shot can carry a bigger push and still read
   as slow, a short one needs less; action scenes move more, still ones less */
function aeSpeed(kind,dur,cat,rasa){
  let f=Math.min(1.6,Math.max(.6,dur/8));
  if(cat==='A')f*=1.35;
  if(rasa==='Śānta'||rasa==='Karuṇa')f*=.8;
  const mv=AE_MV[kind]||[107,113,0,0],mid=(mv[0]+mv[1])/2;
  return [Math.round((mid+(mv[0]-mid)*f)*100)/100,Math.round((mid+(mv[1]-mid)*f)*100)/100,
          Math.round(mv[2]*f),Math.round(mv[3]*f),Math.round(f*1000)/1000];
}
/* the approved shots of a scene, laid out across its runtime */
function aeShots(code,ctx){
  const s=BY[code];if(!s)return [];
  const got=(s.shots||[]).filter(x=>x.a);
  if(!got.length)return [];
  const total=(s.mid||1.5)*60,ws=got.map(x=>AE_W[aeKind(x.t)]||1),sum=ws.reduce((a,b)=>a+b,0)||1;
  const cat=catOf(code),rasa=s.rasa||'',title=sc(s,'t');
  let at=0;
  return got.map((x,i)=>{
    const dur=total*ws[i]/sum,g=aeImg(x),k=aeKind(x.t),sp=aeSpeed(k,dur,cat,rasa),
      label=ae2(i+1)+' · '+(x.t||'SHOT'),why=g?g.why:'no picture the check kept',
      row={n:i+1,label:label,text:x.x||'',mj:x.mj||'',dlg:x.dlg||'',
      id:g?g.id:'',why:why,imgs:(x.imgs||[]).length,
      file:g?ae2(i+1)+'_'+(k||'SHOT')+'_'+g.id.slice(0,8)+'.png':'',
      at:ae3(at),dur:ae3(dur),tcIn:aeTc(at),tcOut:aeTc(at+dur),
      z0:sp[0],z1:sp[1],dx:sp[2],dy:sp[3],mf:sp[4],
      burn:code+'  ·  '+title+(ctx?'   ·   '+ctx:'')+'\r'+
        label+'   '+aeTc(at)+' – '+aeTc(at+dur)+'   ('+(Math.round(dur*10)/10)+'s)\r'+
        'shot '+(i+1)+' of '+got.length+'   ·   '+why+'   ·   move ×'+sp[4]};
    at+=dur;return row;
  });
}
function aeReady(code){return aeShots(code).some(x=>x.file)}
function aeCount(ids){return ids.filter(aeReady).length}
/* the ExtendScript for one scene */
function aeScript(code,rows,ctx){
  const s=BY[code],name=code+' · '+sc(s,'t'),dur=rows.reduce((a,x)=>a+x.dur,0),

      rows.length+' shots  ·  '+used+' picture'+(used===1?'':'s')+' used of '+up+' uploaded  ·  '+
      aeTc(dur)+'  ·  '+AE_FPS+' fps\r'+
      (ctx?ctx+'  ·  ':'')+'weighted by shot type'+(dlg?'  ·  '+dlg+' shot'+(dlg===1?'':'s')+' with dialogue':'')};
  return ['/* '+name,
' * Built by the Scene Board from approved shots and checked pictures.',

' * The slate, the per-shot burn-in and the dialogue are real layers, so they',
